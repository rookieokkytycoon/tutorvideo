$('bookfile').onchange=async e=>{
  const files=Array.from(e.target.files||[]).slice(0,6);
  e.target.value="";                       /* same files can be picked again */
  if(!files.length)return;
  if(answering){$('status').textContent="Finishing an answer first — try again in a second";
    $('status').className='status busy';return;}
  if(COACH.on)await coachStop();
  /* Books handed over MID-LESSON (or while following a stream) join the
     conversation instead of replacing it — and SEVERAL books queue like a
     broadcast schedule: each is analyzed in turn while the previous one is
     already playing, announced by a divider chapter, its chapters appended
     to the same continuous live lesson. A channel of instruction, not a
     pile of separate lessons. */
  $('bookBtn').disabled=true;
  verifyArm('book tutorial');
  if(files.length>1)
    chatMsg('sys','&#128218; '+files.length+' books queued — each becomes a '
           +'segment of one continuous lesson');
  try{
    for(let bi=0;bi<files.length;bi++){
      const file=files[bi];
      const merging=(lessonRunning||LIVE.on||bi>0)&&scenes.length>0;
      if(lessonRunning&&!merging){
        chatMsg('sys','&#9632; stopped the lesson that was playing');
        await stopLesson();}
      $('status').textContent=`Reading "${file.name}" (${bi+1}/${files.length})`
                             +` — extracting the book and structuring it`;
      $('status').className='status busy';
      const fd=new FormData(); fd.append("file",file);
      const r=await fetch("/api/book",{method:"POST",body:fd});
      const d=await r.json();
      if(d.disabled)throw new Error("book upload needs an API key on the server ("+(d.why||"")+")");
      if(!r.ok||!d.chapters){
        chatMsg('sys','&#9888; "'+file.name+'" could not be read'
               +(d.error?' — '+d.error.message:''));
        continue;                  /* one bad book must not stop the rest */
      }
      const expl=d.detailed&&d.detailed.steps
        ?('&#9096; self-experiment: two independent readers extracted '
          +d.detailed.steps+' detailed steps — '
          +Math.round((d.detailed.agreement||0)*100)+'% corroborated'
          +(d.detailed.contested?', '+d.detailed.contested
            +' contested step(s) queued for review in the hivemind':''))
        :'';
      if(merging){
        const at=scenes.length;
        scenes.push(prepScene({mode:'anim',seconds:6,
          title:'next: '+String(d.title).slice(0,44),
          narration:'Next up — '+d.title+'.',
          steps:[{beat:'the next book begins',els:[
            {type:'text',x:25,y:30,text:'up next',color:'ink',in:'fade'},
            {type:'box',x:25,y:20,w:34,h:9,label:String(d.title).slice(0,44),
             color:'blue',in:'pop'}]}]}),
          ...d.chapters.map(prepScene));
        renderSceneList(); renderTimeline();
        chatMsg('sys',`&#128214; "${d.title}" — ${d.pages} pages read, `
          +`${d.chapters.length} chapters queued into the running lesson`
          +(d.ingested?`, ${d.ingested} of its procedures now in the hivemind — `
            +`interrupt any time and the answer comes from the book`:''));
        if(expl)chatMsg('sys',expl);
        $('status').textContent="";$('status').className='status';
        if(!lessonRunning)runLesson(at);   /* holding live: play the book now */
        continue;
      }
      topicNow=d.topic||d.title; $('topic').value=topicNow;
      $('chat').innerHTML=""; qaHistory=[]; currentScene=-1;
      scenes=d.chapters.map(prepScene);
      renderSceneList(); renderTimeline();
      chatMsg('sys',`&#128214; "${d.title}" — ${d.pages} pages read, `
        +`${scenes.length} chapters`
        +(d.ingested?`, ${d.ingested} of its procedures now in the hivemind — `
          +`interrupt any time and the answer comes from the book`:''));
      if(expl)chatMsg('sys',expl);
      $('status').textContent="";$('status').className='status';
      if(voiceOn)withVoices(()=>voiceNote(true));
      runLesson(0);              /* not awaited: the NEXT book analyzes while
                                    this one is already playing */
    }
  }catch(err){
    $('status').textContent=err.message;$('status').className='status err';
  }finally{$('bookBtn').disabled=false;}
};

/* ============ record to a video file for YouTube ============ */
$('rec').onclick=()=>{
  if(recorder){recorder.stop();return;}
  if(!('MediaRecorder'in window)){$('status').textContent="Recording not supported in this browser";$('status').className='status err';return;}
  const stream=cv.captureStream(30);
  const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';
  recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:4_000_000});
  const chunks=[];
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  recorder.onstop=()=>{
    const blob=new Blob(chunks,{type:'video/webm'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=(topicNow||'tutorial').replace(/\W+/g,'_')+'.webm';
    a.click(); URL.revokeObjectURL(a.href);
    recorder=null; $('recdot').className='recdot'; $('rec').textContent='Record';
    chatMsg('sys','&#9679; saved video — upload the .webm straight to YouTube');
  };
  recorder.start(500);
  $('recdot').className='recdot on'; $('rec').textContent='Stop & save';
  chatMsg('sys','&#9679; recording the board (captions + tutor included, silent track)');
};

/* ===== OpenClaw: a YouTube how-to becomes a lesson the rigs perform =====
   The server reads the transcript, Claude splits it into steps and says of
   each one whether the fingers do the work, the body does, or both — and
   "both" comes back as a compose chapter, so posture and grip play side by
   side. The steps land in the hivemind on the way past, so the video keeps
   answering questions long after it has finished playing. */
async function mineVideo(url){
  if(lessonRunning||answering||COACH.on){
    chatMsg('sys','finish or pause the lesson first');return;}
  if(!url){chatMsg('sys','paste a YouTube URL, a how-to article URL, '
                        +'or just type what you want to learn');return;}
  $('mine').disabled=true;
  $('status').textContent="Reading the transcript and extracting the steps";
  $('status').className='status busy';
  try{
    const r=await fetch("/api/mine",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({url:url,track:trackReal})});
    const d=await r.json();
    if(!r.ok||!d.lesson||!d.lesson.length){
      chatMsg('sys','could not mine that video'+(d.error?' — '+d.error.message:''));
      return;
    }
    const mods=(d.doc.steps||[]).map(s=>s.modality);
    const count=m=>mods.filter(x=>x===m).length;
    const nodes=Object.values((d.stats&&d.stats.nodes)||{}).reduce((a,b)=>a+b,0);
    chatMsg('sys','&#9683; mined "'+d.title+'" — '+d.lesson.length+' chapters ('
           +count('both')+' body+hands, '+count('hand')+' hands, '
           +count('body')+' body), now '+nodes+' nodes in the hivemind');
    if(d.doc.warnings&&d.doc.warnings.length)
      chatMsg('sys','the video warned: '+d.doc.warnings[0]);
    /* a mined video is analyzed instruction, the same as a book — its
       steps are to be performed, not watched */
    verifyArm('mined video tutorial');
    playPreset(d.title,d.lesson);
  }catch(e){
    chatMsg('sys','mining failed — '+e.message);
  }finally{
    $('mine').disabled=false;
    $('status').textContent="";$('status').className='status';
  }
}
$('mine').onclick=()=>mineVideo($('tube').value.trim());
$('tube').addEventListener('keydown',e=>{
  if(e.key==='Enter')mineVideo($('tube').value.trim());});

/* ============ livestream -> tutorial ============
   A livestream is a how-to being written in real time. Following one polls
   /api/live, which mines ONLY the transcript tail that arrived since the
   last poll — the new instruction is appended to the playing lesson as
   fresh chapters, and its procedures join the hivemind as they are said.
   The lesson keeps playing; the stream keeps teaching it. */
const LIVE={on:false,url:"",timer:null,got:0,cursor:null,gen:0};
async function livePoll(first){
  if(!LIVE.on)return;
  /* generation token: a poll that was in flight when the user pressed
     Stop (or Stop+Follow) must land dead — without this a stale poll
     appends the stream's chapters into whatever lesson came after, and a
     quick re-follow leaves two 40s poll chains running forever */
  const gen=LIVE.gen;
  try{
    /* the cursor rides along so any server worker knows where we are —
       without it a multi-worker deploy would re-mine the same tail */
    const r=await fetch("/api/live",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({url:LIVE.url,reset:!!first,
        cursor:first?null:LIVE.cursor})});
    const d=await r.json();
    if(!LIVE.on||gen!==LIVE.gen)return;
    if(d&&typeof d.cursor==='number')LIVE.cursor=d.cursor;
    if(!r.ok)
      chatMsg('sys','live follow: '+(d.error?d.error.message:'failed')
             +' — still trying');
    else if(d.waiting){
      if(first)chatMsg('sys','&#9679; following the stream — waiting for '
        +'enough new material'+(d.note?' ('+d.note+')':''));
    }else if(d.chapters&&d.chapters.length){
      LIVE.got+=d.chapters.length;
      if(lessonRunning){
        scenes.push(...d.chapters.map(prepScene));
        renderSceneList();renderTimeline();
        chatMsg('sys','&#9679; live: '+d.chapters.length+' new chapter(s) '
               +'from the stream queued into this lesson — its steps are in '
               +'the hivemind, so Ask knows them already');
      }else if(scenes.length){
        /* the lesson finished while the stream kept talking — the new
           chapters continue the SAME lesson, they do not start a new one */
        const at=scenes.length;
        scenes.push(...d.chapters.map(prepScene));
        renderSceneList();renderTimeline();
        chatMsg('sys','&#9679; live: the stream taught '+d.chapters.length
               +' more chapter(s) — resuming');
        runLesson(at);
      }else{
        /* keep the chapters even if playback cannot start right now (an
           answer in flight) — the server's cursor has already moved past
           this slice, so dropping them would lose it for good */
        scenes=d.chapters.map(prepScene);
        renderSceneList(); renderTimeline();
        chatMsg('sys','&#9679; live: the stream\'s first '+d.chapters.length
               +' chapter(s) are ready'+(answering?' — queued':' — playing'));
        if(!answering){topicNow=d.title||'live lesson';
          $('topic').value=topicNow; runLesson(0);}
      }
    }
  }catch(e){}
  if(LIVE.on&&gen===LIVE.gen)
    LIVE.timer=setTimeout(()=>livePoll(false),40000);
}
function liveStop(){
  LIVE.on=false; LIVE.gen++; clearTimeout(LIVE.timer);
  $('liveBtn').textContent='Follow live';
  $('liveBtn').setAttribute('aria-pressed','false');
  /* the warm verify camera was held for the stream — no stream, no hold */
  if(!lessonRunning&&!VERIFY.busy)verifyRelease();
}
$('liveBtn').onclick=()=>{
  if(LIVE.on){liveStop();
    chatMsg('sys','stopped following the stream — '+LIVE.got
           +' chapter(s) came from it');return;}
  const url=$('tube').value.trim();
  if(!url){chatMsg('sys','paste the livestream URL first, then Follow live');
    return;}
  LIVE.on=true; LIVE.url=url; LIVE.got=0; LIVE.cursor=null; LIVE.gen++;
  $('liveBtn').textContent='Stop live';
  $('liveBtn').setAttribute('aria-pressed','true');
  chatMsg('sys','&#9679; following the livestream — new instruction becomes '
         +'new chapters as it arrives');
  /* a followed stream is analyzed instruction too — same contract */
  verifyArm('live stream tutorial');
  livePoll(true);
};

/* ======================= live coaching ==================================
   Every other mode in this file points one way: the rig performs and the
   student watches. This is the return path — the camera comes on, MediaPipe
   tracks the student's body in this tab, and the same nine joint angles are
   measured on both sides and subtracted. What comes out is not a score for
   its own sake but a sentence: "straighten your right elbow".

   Two landmark streams come back from one detection and both are used, for
   different reasons:

     worldLandmarks  metres, hip-centred, camera-independent  -> the angles
     landmarks       normalised image space                   -> the overlay

   Angles have to come from the world stream or the grade would depend on
   where the student stood; the overlay has to come from the image stream or
   the bones would not sit on the body in the video. Using either one for
   both jobs is the obvious mistake here.

   Nothing is uploaded. The video element is never sent anywhere, the model
   runs on the GPU in this tab, and the only thing that reaches the server is
   a few angles per second when the session ends and asks for a summary.

   The DEFINITIONS — which triples of joints are measured, what tolerance a
   step allows, how a delta becomes English — all arrive from coach.py in
   the reference payload. This file computes, it does not decide. */
const MP_VER="0.10.14";
const MP_BASE="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@"+MP_VER;
const POSE_MODEL="https://storage.googleapis.com/mediapipe-models/pose_landmarker"
                +"/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";
/* the same model file posetrack.py downloads server-side, so a clip tracked
   here and one tracked there come off identical weights */
const HAND_MODEL="https://storage.googleapis.com/mediapipe-models/hand_landmarker"
                +"/hand_landmarker/float16/1/hand_landmarker.task";
const REPLAY_FPS=12;        /* posetrack.TRACK_FPS — the board's own rate */
const REPLAY_MAX=240;       /* posetrack.MAX_SECONDS * TRACK_FPS */
/* MediaPipe's 21 hand landmarks, in handform.FINGER_CHAIN order: four bones
   per finger off the wrist, plus the knuckle line so a palm reads as a palm */
const HAND_BONES=[[0,1],[1,2],[2,3],[3,4], [0,5],[5,6],[6,7],[7,8],
                  [0,9],[9,10],[10,11],[11,12], [0,13],[13,14],[14,15],[15,16],
                  [0,17],[17,18],[18,19],[19,20], [5,9],[9,13],[13,17],[1,5]];
const VIS_MIN=0.5;          /* a landmark below this is not being seen */
const CUE_HOLD=1100;        /* ms a fault must persist before it is spoken */
const CUE_GAP=4200;         /* ms between spoken corrections, so it is a coach
                               and not a metronome */
const SAMPLE_MS=250;

const COACH={
  on:false, starting:false, ref:null, clip:null, spec:null,
  step:0, mirror:true,
  video:null, stream:null, landmarker:null, hander:null,
  lastVideoTime:-1, lm:null, handLm:null, live:null, last:null,
  seenAt:0, holdMs:0, loopT0:0, sampleAt:0,
  cueText:"", cueSince:0, spokeAt:0, spokeText:"",
  samples:[], note:"", err:"", fps:0, fpsT:0, fpsN:0,
  /* the take: raw landmark streams kept exactly as the trackers emit them,
     because /api/replay hands them to the same functions posetrack feeds —
     reducing them here would mean two different decimations to keep in sync */
  recBody:[], recHand:[], recAt:0
};

/* --- the same arithmetic as coach.py, from the same definitions ---------- */
function angleAt(a,b,c){
  const u=V.sub(a,b), w=V.sub(c,b), nu=V.len(u), nw=V.len(w);
  if(nu<1e-9||nw<1e-9)return 180;
  return Math.acos(clampf(V.dot(u,w)/(nu*nw),-1,1))*180/Math.PI;
}
/* 33 BlazePose world landmarks -> our 17, y flipped up, exactly as
   motion.normalize_track does it server-side. Scale is irrelevant: angles
   do not have units. */
function coachFrame(wl){
  const m=COACH.spec.blazepose;
  return COACH.spec.joints.map(n=>{const p=wl[m[n]];return [p.x,-p.y,p.z];});
}
/* Visibility per OUR joint, taken from the image stream (the world stream
   does not always carry it). A measure whose three joints are not all
   visible is dropped rather than guessed — a student sitting at a desk gets
   graded on their arms instead of being marked down for absent ankles. */
function coachVis(lm){
  const m=COACH.spec.blazepose;
  return COACH.spec.joints.map(n=>{
    const p=lm[m[n]];
    return p&&p.visibility!=null?p.visibility:1;
  });
}
function coachAngles(frame,vis){
  const sp=COACH.spec, JI={}; sp.joints.forEach((n,i)=>JI[n]=i);
  const ok=nm=>vis[JI[nm]]>=VIS_MIN, out={};
  for(const n in sp.angles){
    const [a,b,c]=sp.angles[n];
    if(!(ok(a)&&ok(b)&&ok(c)))continue;
    out[n]=+angleAt(frame[JI[a]],frame[JI[b]],frame[JI[c]]).toFixed(1);
  }
  if(['shoulder_l','shoulder_r','hip_l','hip_r'].every(ok)){
    const mid=(p,q)=>[(p[0]+q[0])/2,(p[1]+q[1])/2,(p[2]+q[2])/2];
    const tr=V.sub(mid(frame[JI.shoulder_l],frame[JI.shoulder_r]),
                   mid(frame[JI.hip_l],frame[JI.hip_r])), n=V.len(tr);
    out[sp.torso]=n<1e-9?0:+(Math.acos(clampf(tr[1]/n,-1,1))*180/Math.PI).toFixed(1);
  }
  return out;
}
/* A step's target is a BAND, not a pose — see the note in coach.py. Zero
   anywhere inside it; outside, the distance to the nearer edge. */
function offBand(v,t){
  const lo=t.lo-t.tol, hi=t.hi+t.tol;
  return v<lo?v-lo:v>hi?v-hi:0;
}
function scorePose(live,step){
  const sp=COACH.spec;
  if(COACH.mirror){
    const m={}; for(const n in live)if(sp.mirror[n])m[sp.mirror[n]]=live[n];
    live=m;
  }
  const keys=new Set(step.key||[]);
  let tot=0,wtot=0,worstKey=1; const deltas={},errs=[];
  for(const n in step.targets){
    if(!(n in live))continue;
    const d=offBand(live[n],step.targets[n]), e=Math.abs(d);
    const w=keys.has(n)?sp.key_weight:1, s=Math.max(0,1-e/sp.span);
    tot+=w*s; wtot+=w;
    if(keys.has(n))worstKey=Math.min(worstKey,s);
    deltas[n]=d;
    if(e>0)errs.push([w*e,n,d]);
  }
  if(!wtot)return{score:0,deltas:{},cues:[],ok:false,seen:false};
  errs.sort((a,b)=>b[0]-a[0]);
  /* the mean alone is too kind: one badly wrong key joint has to show */
  const sc=Math.round(100*(tot/wtot)*(1-sp.worst_pull*(1-worstKey)));
  return {score:sc, deltas:deltas, seen:true, ok:sc>=(COACH.ref.pass||78),
          cues:errs.slice(0,2).map(e=>({angle:e[1], label:sp.cues[e[1]].label,
            text:e[2]>0?sp.cues[e[1]].over:sp.cues[e[1]].under,
            off:Math.round(Math.abs(e[2]))}))};
}

/* --- starting and stopping ---------------------------------------------- */
async function loadLandmarker(){
  const vision=await import(MP_BASE+"/vision_bundle.mjs");
  const files=await vision.FilesetResolver.forVisionTasks(MP_BASE+"/wasm");
  const pose=d=>vision.PoseLandmarker.createFromOptions(files,{
    baseOptions:{modelAssetPath:POSE_MODEL,delegate:d},
    runningMode:"VIDEO",numPoses:1,
    minPoseDetectionConfidence:0.5,minPosePresenceConfidence:0.5,
    minTrackingConfidence:0.5});
  const hand=d=>vision.HandLandmarker.createFromOptions(files,{
    baseOptions:{modelAssetPath:HAND_MODEL,delegate:d},
    runningMode:"VIDEO",numHands:1,
    minHandDetectionConfidence:0.5,minHandPresenceConfidence:0.5,
    minTrackingConfidence:0.5});
  /* a machine with no usable WebGL still coaches, just slower */
  const both=async d=>[await pose(d),await hand(d)];
  try{return await both("GPU");}catch(e){return await both("CPU");}
}
async function coachStart(){
  if(COACH.on||COACH.starting)return;
  const topic=$('topic').value.trim();
  if(!topic){$('status').textContent="Type what you want coached in the topic box";
    $('status').className='status err';return;}
  if(answering){$('status').textContent="Finishing an answer first";
    $('status').className='status busy';return;}
  COACH.starting=true; $('coach').disabled=true;
  if(lessonRunning)await stopLesson();
  try{
    $('status').textContent="Building the reference motion";
    $('status').className='status busy';
    const r=await fetch("/api/coach",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({question:topic,text:topic,seconds:10})});
    const d=await r.json();
    if(!r.ok||!d.reference)throw new Error((d.error&&d.error.message)||"no reference");
    COACH.clip=d.clip; COACH.ref=d.reference; COACH.spec=d.reference;

    $('status').textContent="Asking for your camera";
    COACH.stream=await navigator.mediaDevices.getUserMedia(
      {video:{width:{ideal:640},height:{ideal:480},facingMode:"user"},audio:false});
    const v=document.createElement('video');
    v.autoplay=true;v.muted=true;v.playsInline=true;v.srcObject=COACH.stream;
    await v.play();
    COACH.video=v;

    $('status').textContent="Loading the pose and hand trackers";
    const pair=await loadLandmarker();
    COACH.landmarker=pair[0]; COACH.hander=pair[1];

    COACH.recBody=[]; COACH.recHand=[]; COACH.recAt=0;
    COACH.on=true; COACH.step=0; COACH.samples=[]; COACH.holdMs=0;
    COACH.last=null; COACH.lm=null; COACH.lastVideoTime=-1;
    COACH.cueText=""; COACH.spokeText=""; COACH.spokeAt=0; COACH.err="";
    COACH.loopT0=performance.now(); COACH.sampleAt=0;
    player.clip=null; player.els=[]; player.annos=[]; player.active=false;
    scenes=[]; renderSceneList(); renderTimeline(); $('beats').innerHTML="";
    setBadge('coach');
    /* the same Pause button the lesson uses — a coaching session is a thing
       you interrupt, ask about and resume, not a mode with its own controls */
    $('pauseBtn').disabled=false; $('pauseBtn').textContent='Pause';
    $('coach').textContent="Finish coaching"; $('coach').classList.add('on');
    $('status').textContent=""; $('status').className='status';
    chatMsg('sys','&#9673; coaching "'+(COACH.ref.title||topic)+'" — '
      +COACH.ref.steps.length+' step(s), judged on '
      +COACH.spec.measures.length+' joint angles'
      +(COACH.ref.source==='hivemind'?', grounded in the hivemind':'')
      +'. Nothing leaves this tab.');
    /* the reference is only worth copying if there is a movement in it */
    if(!COACH.ref.physical)
      chatMsg('sys','&#9888; there is no physical action in "'+topic+'" — the '
        +'reference is a talking gesture, so the score will not mean much. '
        +'Try something you can actually do: "squat", "how to lift a box", '
        +'"change a bike tyre".');
    const s0=COACH.ref.steps[0];
    speak("Step one. "+s0.text+". Copy me, and stand back so I can see all of you.");
    captionText=s0.text; captionQA=false;
  }catch(e){
    coachRelease();
    const why=(e&&e.name==='NotAllowedError')
      ?"camera permission denied — nothing to coach with"
      :(e&&e.name==='NotFoundError')?"no camera on this machine"
      :(""+(e&&e.message||e));
    $('status').textContent="Coaching failed — "+why;
    $('status').className='status err';
    chatMsg('sys','&#9888; coaching could not start — '+why);
  }finally{
    COACH.starting=false; $('coach').disabled=false;
  }
}
function coachRelease(){
  if(COACH.stream)COACH.stream.getTracks().forEach(t=>t.stop());
  if(COACH.landmarker){try{COACH.landmarker.close();}catch(_){}}
  if(COACH.hander){try{COACH.hander.close();}catch(_){}}
  if(COACH.video){COACH.video.srcObject=null;}
  COACH.stream=null; COACH.landmarker=null; COACH.hander=null;
  COACH.video=null; COACH.on=false; COACH.handLm=null;
  $('coach').textContent="Coach me"; $('coach').classList.remove('on');
  $('pauseBtn').disabled=!lessonRunning;
}
async function coachStop(){
  if(!COACH.on)return;
  const ref=COACH.ref, samples=COACH.samples.slice(), mirror=COACH.mirror;
  const body=COACH.recBody.slice(), hand=COACH.recHand.slice();
  const steps=(ref.steps||[]).map(s=>s.text);
  const title=ref.title||topicNow||"what you just did";
  coachRelease();
  setBadge(''); captionText=""; clearBoard();
  if(!samples.length&&!body.length&&!hand.length){
    chatMsg('sys','&#9632; coaching stopped — nothing was tracked');
    return;
  }
  if(samples.length){
    $('status').textContent="Scoring the session"; $('status').className='status busy';
    try{
      const r=await fetch("/api/coach/report",{method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({reference:ref,samples:samples,mirror:mirror})});
      const d=await r.json();
      if(!r.ok||!d.steps)throw new Error((d.error&&d.error.message)||"no report");
      chatMsg('tutor','<b>'+d.overall+'/100</b> &middot; '+d.steps_passed+'/'
        +d.steps_total+' steps<br>'+d.steps.map(s=>
          '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:.72rem">'
          +'step '+s.step+' &middot; best '+(s.best==null?'—':s.best)+'</span> '
          +s.verdict).join('<br>'));
      chatMsg('tutor',d.verdict);
    }catch(e){
      chatMsg('sys','&#9888; could not score the session — '+e.message);
    }finally{
      $('status').textContent=""; $('status').className='status';
    }
  }
  await coachReplay(body,hand,steps,title);
}

/* --- the take becomes a chapter ------------------------------------------
   The camera tracked the student; this hands those landmark streams to the
   same server functions /api/track feeds, and what comes back is an ordinary
   clip. It is then pushed into `scenes` and played by runLesson — so the
   thing they just did is performed by the servo chains, with the gestures
   recognised from THEIR frames, and pause / interrupt / ask / resume all work
   on it because it is not a special case. */
async function coachReplay(body,hand,steps,title){
  if(body.length<6&&hand.length<6){
    chatMsg('sys','not enough tracked frames to replay — stand back so the '
                 +'camera can see you, or hold a hand up in shot');
    return;
  }
  $('status').textContent="Rebuilding what you did as a clip";
  $('status').className='status busy';
  try{
    const r=await fetch("/api/replay",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({body:body,hand:hand,fps:REPLAY_FPS,kind:"compose",
                           steps:steps,title:title})});
    const d=await r.json();
    if(!r.ok||!(d.frames||(d.parts&&d.parts.length)))
      throw new Error((d.error&&d.error.message)||"no clip");
    const what=d.kind==='compose'
      ?d.parts.map(p=>PANE_LABEL[p.kind]||p.kind).join(' + ')
      :(PANE_LABEL[d.kind]||d.kind);
    const ges=(d.parts?d.parts:[d]).reduce((n,c)=>n+(c.gestures||[]).length,0);
    chatMsg('sys','&#9673; replaying your own motion — '+what+', '
      +Math.round(d.seconds)+'s, '+ges+' gesture(s) read back from your frames'
      +((d.missing||[]).length?' (no '+d.missing.join('/')+' in shot)':''));
    /* a scene that already carries its clip: ensureClip short-circuits on
       sc.clip !== undefined, so nothing is re-fetched or re-synthesised */
    const sc=prepScene({
      title:"you, performed by the rigs",
      narration:"Here is what you just did, rebuilt as motion. Every limb is a "
               +"chain of servos following the positions the camera tracked — "
               +"and the gestures named in the corner were read back out of "
               +"your frames, not out of anything you typed.",
      mode:d.kind==='compose'?'compose':d.kind,
      seconds:Math.max(6,Math.round(d.seconds)),
      clip:d, qa:true, fresh:true});
    const at=scenes.length;
    scenes.push(sc); renderSceneList(); renderTimeline();
    $('status').textContent=""; $('status').className='status';
    if(!lessonRunning)runLesson(at); else pendingSeek=at;
  }catch(e){
    chatMsg('sys','&#9888; could not replay your motion — '+e.message);
    $('status').textContent=""; $('status').className='status';
  }
}

/* --- one frame ----------------------------------------------------------- */
function coachTick(now){
  const v=COACH.video;
  if(!v||v.readyState<2)return;
  /* detectForVideo must not be handed the same frame twice, and the webcam
     is 30fps while this loop is 60 — half these ticks are a redraw only */
  if(v.currentTime!==COACH.lastVideoTime){
    COACH.lastVideoTime=v.currentTime;
    let res=null,hres=null;
    try{res=COACH.landmarker.detectForVideo(v,now);}
    catch(e){COACH.err=""+(e.message||e);}
    try{hres=COACH.hander.detectForVideo(v,now);}
    catch(e){/* fingers are a bonus; a hand miss must not stop the body */}
    COACH.fpsN++;
    if(now-COACH.fpsT>1000){COACH.fps=COACH.fpsN;COACH.fpsN=0;COACH.fpsT=now;}
    const lm=res&&res.landmarks&&res.landmarks[0];
    const wl=res&&res.worldLandmarks&&res.worldLandmarks[0];
    const hwl=hres&&hres.worldLandmarks&&hres.worldLandmarks[0];
    COACH.handLm=(hres&&hres.landmarks&&hres.landmarks[0])||null;
    /* Record the take at the board's own rate, not the camera's: the clip
       plays at REPLAY_FPS, so sampling faster only inflates the payload.
       Streams are kept independent — a frame where the hand left shot is a
       shorter hand clip, not a hole in the body clip. */
    if(now-COACH.recAt>=1000/REPLAY_FPS){
      COACH.recAt=now;
      const r4=n=>Math.round(n*1e4)/1e4;                 /* 0.1 mm is plenty */
      if(wl&&COACH.recBody.length<REPLAY_MAX)
        COACH.recBody.push(wl.map(p=>[r4(p.x),r4(p.y),r4(p.z)]));
      /* y down -> y up, exactly as posetrack.track_hand does on the way in */
      if(hwl&&COACH.recHand.length<REPLAY_MAX)
        COACH.recHand.push(hwl.map(p=>[r4(p.x),r4(-p.y),r4(p.z)]));
    }
    if(lm&&wl){
      COACH.lm=lm;
      const vis=coachVis(lm);
      const live=coachAngles(coachFrame(wl),vis);
      COACH.live=live;
      const step=COACH.ref.steps[COACH.step];
      /* three measures is the floor: fewer than that and a "score" would be
         an opinion about one elbow dressed up as a grade */
      if(Object.keys(live).length>=3){
        COACH.last=scorePose(live,step); COACH.seenAt=now; COACH.note="";
        if(now-COACH.sampleAt>SAMPLE_MS&&COACH.samples.length<3000){
          COACH.sampleAt=now;
          COACH.samples.push({step:COACH.step,
            t:+((now-COACH.loopT0)/1000).toFixed(2),angles:live});
        }
      }else{
        COACH.note="step back — I can only see part of you";
      }
    }else{
      COACH.lm=null;
      COACH.note="I cannot see anybody — step into frame";
    }
  }
  if(now-COACH.seenAt>700){COACH.last=null;COACH.holdMs=0;}

  /* progress and speech pause while the tutor is answering a question, but
     tracking does not — the point of interrupting mid-coaching is to ask
     about the pose you are holding right now */
  if(player.paused||answering)return;

  const dt=Math.min(now-(COACH.lastNow||now),100); COACH.lastNow=now;
  const st=COACH.ref.steps[COACH.step];
  if(COACH.last&&COACH.last.ok){
    COACH.holdMs+=dt;
    if(COACH.holdMs>=(COACH.ref.hold||1.6)*1000)coachAdvance();
  }else if(COACH.last){
    COACH.holdMs=Math.max(0,COACH.holdMs-dt*0.6);   /* decay, do not reset */
    const cue=COACH.last.cues[0];
    if(cue){
      if(cue.text!==COACH.cueText){COACH.cueText=cue.text;COACH.cueSince=now;}
      else if(now-COACH.cueSince>CUE_HOLD&&now-COACH.spokeAt>CUE_GAP
              &&cue.text!==COACH.spokeText&&!speaking){
        COACH.spokeAt=now; COACH.spokeText=cue.text;
        captionText=cue.text; captionQA=true;
        speak(cue.text,true);
      }
    }else COACH.cueText="";
  }
}
function coachAdvance(){
  COACH.holdMs=0; COACH.spokeText=""; COACH.cueText="";
  if(COACH.step>=COACH.ref.steps.length-1){
    chatMsg('sys','&#10003; all '+COACH.ref.steps.length+' steps held — finishing');
    coachStop();
    return;
  }
  COACH.step++;
  COACH.loopT0=performance.now();
  const st=COACH.ref.steps[COACH.step];
  chatMsg('sys','&#10003; step '+COACH.step+' held — moving on');
  captionText=st.text; captionQA=false;
  speak("Good. Step "+(COACH.step+1)+". "+st.text);
  wipe();
}

/* --- the board while coaching -------------------------------------------- */
function coachPanes(){
  const top=10, strip=76, gap=10;
  const h=cv.height-CAP_H-strip-top, w=(cv.width-gap*3)/2;
  return {L:[gap,top,w,h], R:[gap*2+w,top,w,h], stripY:top+h+8};
}
/* cover-fit, mirrored: a coaching feed that is not a mirror makes every
   student correct the wrong way round */
function coachVideoRect(r){
  const v=COACH.video, vw=v.videoWidth||640, vh=v.videoHeight||480;
  const s=Math.max(r[2]/vw,r[3]/vh), dw=vw*s, dh=vh*s;
  const ox=r[0]+(r[2]-dw)/2, oy=r[1]+(r[3]-dh)/2;
  ctx.save();
  ctx.beginPath();ctx.rect(r[0],r[1],r[2],r[3]);ctx.clip();
  ctx.translate(2*r[0]+r[2],0);ctx.scale(-1,1);
  try{ctx.drawImage(v,ox,oy,dw,dh);}catch(_){}
  ctx.restore();
  return {ox:ox,oy:oy,dw:dw,dh:dh,flip:2*r[0]+r[2]};
}
function coachRender(now){
  const p=coachPanes(), ref=COACH.ref, st=ref.steps[COACH.step];

  /* left: the rig, looping this step's own segment of the clip */
  const span=Math.max(st.end-st.start,0.4);
  const t=st.start+(((now-COACH.loopT0)/1000)%span);
  const vp=[p.L[0]/cv.width,p.L[1]/cv.height,p.L[2]/cv.width,p.L[3]/cv.height];
  withViewport(vp,()=>{try{drawSkeleton(COACH.clip,t);}catch(e){}});
  ctx.strokeStyle='rgba(20,20,18,.14)';ctx.lineWidth=1;
  ctx.strokeRect(p.L[0]+.5,p.L[1]+.5,p.L[2]-1,p.L[3]-1);
  coachPaneTag(p.L,'copy this','#2456D6');

  /* right: you, with the tracked bones on top of you */
  ctx.fillStyle='#EDEEE9';ctx.fillRect(p.R[0],p.R[1],p.R[2],p.R[3]);
  if(COACH.video&&COACH.video.readyState>=2){
    const m=coachVideoRect(p.R);
    if(COACH.lm)coachOverlay(COACH.lm,m,p.R);
    if(COACH.handLm)coachHandOverlay(COACH.handLm,m,p.R);
  }
  ctx.strokeStyle='rgba(20,20,18,.14)';ctx.lineWidth=1;
  ctx.strokeRect(p.R[0]+.5,p.R[1]+.5,p.R[2]-1,p.R[3]-1);
  /* the note goes in the strip, not here — a tag long enough to say "step
     back, I can only see part of you" runs under the Live badge */
  coachPaneTag(p.R,'you','#C93A2E');

  coachStrip(p.stripY,st);
}
function coachPaneTag(r,text,color){
  ctx.font='11px "IBM Plex Mono", monospace';
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  /* the Live badge lives in the board's top-right corner, so a long tag has
     to be cut rather than allowed to run underneath it */
  const room=r[2]-24;
  while(text.length>4&&ctx.measureText(text).width>room)
    text=text.slice(0,-2)+'…';
  const w=ctx.measureText(text).width+14;
  ctx.fillStyle='rgba(253,253,248,.9)';ctx.fillRect(r[0]+6,r[1]+6,w,18);
  ctx.fillStyle=color;ctx.fillText(text,r[0]+13,r[1]+19);
}
/* The bones sit on the video because they come from the IMAGE landmarks;
   the colours come from the WORLD ones. A joint whose measured angle is
   outside the band for this step turns red and says by how much. */
function coachOverlay(lm,m,r){
  const sp=COACH.spec, JI={}; sp.joints.forEach((n,i)=>JI[n]=i);
  const P=sp.joints.map(n=>{
    const q=lm[sp.blazepose[n]];
    return [m.flip-(m.ox+q.x*m.dw), m.oy+q.y*m.dh];
  });
  const inside=q=>q[0]>=r[0]&&q[0]<=r[0]+r[2]&&q[1]>=r[1]&&q[1]<=r[1]+r[3];
  ctx.save();
  ctx.beginPath();ctx.rect(r[0],r[1],r[2],r[3]);ctx.clip();
  sp.bones.forEach(b=>{
    const a=P[b[0]], c=P[b[1]];
    if(!inside(a)&&!inside(c))return;
    ctx.strokeStyle='rgba(253,253,248,.85)';ctx.lineWidth=6;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(c[0],c[1]);ctx.stroke();
    ctx.strokeStyle='#141412';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(c[0],c[1]);ctx.stroke();
  });
  /* one dot per measured joint, coloured by that joint's own error */
  const d=(COACH.last&&COACH.last.deltas)||{};
  /* mirroring means the fault reported for "elbow_r" belongs on the student's
     LEFT elbow — draw it where the body actually is, not where the rig is */
  const site=n=>COACH.mirror?sp.mirror[n]:n;
  for(const n in sp.angles){
    const j=JI[sp.angles[site(n)][1]];
    if(j==null)continue;
    const off=Math.abs(d[n]||0), q=P[j];
    if(!inside(q))continue;
    /* grey means "not being measured", not "correct" — a joint that dropped
       out of view must not read as a pass */
    ctx.fillStyle=!COACH.last?'#8A9086':off>0?'#C93A2E':'#1F9E7A';
    ctx.beginPath();ctx.arc(q[0],q[1],off>0?6:4.5,0,7);ctx.fill();
    if(off>6){
      ctx.font='10px "IBM Plex Mono", monospace';
      ctx.fillStyle='#C93A2E';ctx.textAlign='left';
      ctx.fillText(Math.round(off)+'°',q[0]+9,q[1]+3);
    }
  }
  ctx.restore();
}
/* The fingers, on the same footing as the body: green because they are not
   being scored — coaching measures nine body angles, and handform owns the
   fingers. They are drawn (and recorded) so the replay has a hand clip. */
function coachHandOverlay(lm,m,r){
  const P=lm.map(q=>[m.flip-(m.ox+q.x*m.dw), m.oy+q.y*m.dh]);
  const inside=q=>q[0]>=r[0]&&q[0]<=r[0]+r[2]&&q[1]>=r[1]&&q[1]<=r[1]+r[3];
  ctx.save();
  ctx.beginPath();ctx.rect(r[0],r[1],r[2],r[3]);ctx.clip();
  ctx.lineCap='round';
  HAND_BONES.forEach(b=>{
    const a=P[b[0]], c=P[b[1]];
    if(!a||!c||(!inside(a)&&!inside(c)))return;
    ctx.strokeStyle='rgba(253,253,248,.8)';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(c[0],c[1]);ctx.stroke();
    ctx.strokeStyle='#1F9E7A';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(c[0],c[1]);ctx.stroke();
  });
  ctx.fillStyle='#1F9E7A';
  P.forEach((q,i)=>{if(!inside(q))return;
    ctx.beginPath();ctx.arc(q[0],q[1],i%4===0?2.6:1.9,0,7);ctx.fill();});
  ctx.restore();
}
function coachStrip(y,st){
  const ref=COACH.ref, last=COACH.last, pass=ref.pass||78;
  const x=10, w=cv.width-20, h=68;
  ctx.fillStyle='rgba(253,253,248,.96)';ctx.fillRect(x,y,w,h);
  ctx.strokeStyle='rgba(20,20,18,.12)';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,w-1,h-1);

  const sc=last?last.score:0;
  const col=!last?'#8A9086':sc>=pass?'#1F9E7A':sc>=55?'#E08A2E':'#C93A2E';
  ctx.font='600 30px "IBM Plex Sans", sans-serif';
  ctx.fillStyle=col;ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.fillText(last?String(sc):'--',x+12,y+34);
  ctx.font='10px "IBM Plex Mono", monospace';ctx.fillStyle='#8A9086';
  ctx.fillText('/100',x+12,y+48);

  /* the bar, with the pass mark on it, and the hold filling from the left
     once you are over that mark — you can see the step about to tick over */
  const bx=x+70, bw=w-84, by=y+12, bh=10;
  ctx.fillStyle='#E4E5E0';ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle=col;ctx.fillRect(bx,by,bw*Math.max(0,Math.min(sc,100))/100,bh);
  ctx.fillStyle='#141412';ctx.fillRect(bx+bw*pass/100-1,by-3,2,bh+6);
  const hold=Math.min(COACH.holdMs/((ref.hold||1.6)*1000),1);
  if(hold>0){ctx.fillStyle='#1F9E7A';ctx.fillRect(bx,by+bh+3,bw*hold,3);}

  ctx.font='12px "IBM Plex Sans", sans-serif';ctx.fillStyle='#141412';
  const head='Step '+(COACH.step+1)+'/'+ref.steps.length+' — '+st.text;
  ctx.fillText(head.length>78?head.slice(0,77)+'…':head,bx,y+38);

  ctx.font='11px "IBM Plex Mono", monospace';
  if(COACH.note){ctx.fillStyle='#C93A2E';ctx.fillText(COACH.note,bx,y+55);}
  else if(last&&last.cues.length){
    ctx.fillStyle='#C93A2E';
    ctx.fillText(last.cues.map(c=>c.text+' ('+c.off+'°)').join('   ·   ')
                 .slice(0,96),bx,y+55);
  }else if(last){
    ctx.fillStyle='#1F9E7A';
    ctx.fillText(hold>0?'hold it…':'in range on every measured angle',bx,y+55);
  }
  /* what is being banked for the replay, so it is never a surprise at the end
     that there was no hand in shot and therefore no hand clip */
  ctx.textAlign='right';ctx.fillStyle='#8A9086';
  ctx.fillText((COACH.mirror?'mirrored':'same side')+'  ·  '+COACH.fps+' fps'
              +'  ·  rec '+COACH.recBody.length+'b/'+COACH.recHand.length+'h'
              +(COACH.err?'  ·  '+COACH.err.slice(0,20):''),x+w-12,y+55);
  ctx.textAlign='left';
}
/* What the tutor can see when a student interrupts mid-session. The phrasing
   comes out of the same table coach.py ships, so the answer and the overlay
   never disagree about which joint is wrong. */
function coachContext(){
  if(!COACH.on)return [];
  const ref=COACH.ref, st=ref.steps[COACH.step], sp=COACH.spec;
  const out=["LIVE COACHING: the student's camera is on and I am scoring their "
            +"form against \""+(ref.title||'the reference motion')+"\"",
             "current step "+(COACH.step+1)+"/"+ref.steps.length+": "+st.text,
             "this step is judged on: "
              +(st.key||[]).map(n=>sp.cues[n].label).join(', ')];
  if(COACH.last&&COACH.last.seen){
    out.push("their score right now: "+COACH.last.score+"/100"
            +(COACH.mirror?" (mirrored, so their left copies my right)":""));
    if(COACH.last.cues.length)
      COACH.last.cues.forEach(c=>out.push("fault: "+c.label+" is "+c.off
        +" degrees outside the target band — \""+c.text+"\""));
    else out.push("no fault right now — inside tolerance on every measured angle");
  }else out.push(COACH.note||"I cannot see them in frame at the moment");
  out.push("the left half of the board is my rig performing this step on a "
          +"loop; the right half is their camera with the tracked skeleton on it");
  return out;
}

$('coach').onclick=()=>{COACH.on?coachStop():coachStart();};

/* ============ verify through the camera, mid-lesson ============
   Coaching is a session of its own; VERIFY is the same closed loop woven
   INTO the lesson. With it on, every whole-body chapter — a book exercise,
   a livestream step, a mined procedure — is followed by "your turn": the
   camera comes on, MediaPipe tracks the student's joints, and the SAME
   angle-band scoring the coach uses grades them against that chapter's own
   steps. Hit the pose and the lesson moves on; the tracking never leaves
   the tab. The camera and trackers start once and stay warm for the whole
   verified lesson. */
/* ============ liquid neural network (LTC) ============
   A real liquid time-constant network — Hasani et al. 2021 — implemented
   dependency-free like every other model in this project. Per frame, the
   measured joint-band deviations flow into a small continuous-time RNN
   whose neurons' time constants DEPEND ON THE INPUT (the liquid property),
   integrated with the paper's fused ODE solver:

       f      = sigmoid(W x + U u + b)
       x(t+dt)= (x + dt * f (.) A) / (1 + dt * (1/tau + f))

   so the effective time constant tau/(1 + tau f) tightens when the input
   is busy and relaxes when it is quiet. The recurrent core is fixed from a
   seeded generator (same dynamics for everyone); the READOUT — which sees
   [gain*x ; u], liquid state plus the direct-input skip connection, the
   standard reservoir readout — is adapted online per student with a
   cross-entropy gradient against the physics teacher signal and persisted
   in the browser: the self-experimentation loop, learned not scripted.

                                 wr.y-VERIFY.handPrev[3]))/dt;
            VERIFY.handScore=Math.round(Math.min(100,55+sp*280));
          }else VERIFY.handScore=55;
          VERIFY.handPrev=[p.x,p.y,wr.x,wr.y]; VERIFY.handPrevAt=now;
        }else{VERIFY.handScore=0;VERIFY.handPrev=null;}
      }catch(_){}
    }else if(VERIFY.pose){
      try{
        const out=VERIFY.pose.detectForVideo(v,now);
        const wl=out.worldLandmarks&&out.worldLandmarks[0];
        const il=out.landmarks&&out.landmarks[0];
        if(wl&&il){VERIFY.live=coachAngles(coachFrame(wl),coachVis(il));
                   VERIFY.lm=il;}

    if(st.kind==='hand'){

        text:'show your working hand to the camera',off:0}];
    }else if(VERIFY.live&&VERIFY.ref){
      const ri=Math.max(0,Math.min(VERIFY.refIdx[VERIFY.si]||0,
                                   VERIFY.ref.steps.length-1));
      const s=scorePose(VERIFY.live,VERIFY.ref.steps[ri]);
      sc100=s.score; cues=s.cues||[]; deltas=s.deltas; seen=true;
    }
    if(sc100!=null){
      VERIFY.score=sc100; VERIFY.cues=cues;
      VERIFY.per[VERIFY.si].best=Math.max(VERIFY.per[VERIFY.si].best,sc100);
      const landing=sc100>=verifyNeed();
      /* the liquid network watches the same frames, taught by the physics
         (landing) and by the tracker (engagement) */
      const conf=lnnStep(
        lnnInputs(deltas,sc100,seen,VERIFY.hold/VERIFY_HOLD_MS,
                  st.kind==='hand'),
        (now-VERIFY.lastT)/1000,landing?1:0,seen?1:0);
      /* the round's trajectory is banked so the outcome predictor can be
         taught what THIS ending looked like when the round resolves */
      if(LNN.z){VERIFY.zbuf.push(LNN.z.slice());
        if(VERIFY.zbuf.length>150)VERIFY.zbuf.shift();}

         fires now instead of after the full timeout */

        VERIFY.predLow+=now-VERIFY.lastT;
      else VERIFY.predLow=0;
      if(VERIFY.predLow>5000&&now-VERIFY.stepT0>6000&&!VERIFY.earlyHinted){
        VERIFY.earlyHinted=true;

      }
      if(landing){VERIFY.hold+=now-VERIFY.lastT;
        if(VERIFY.hold>VERIFY_HOLD_MS)verifyNext(true);
      }else if(conf<0.6)VERIFY.hold=0;

/* ============ the knowledge quiz ============

   the HEAD did. One grounded multiple-choice question after each chapter,
   answered by click. Right: praise and on. Wrong: the correct answer is
   spoken, the point is re-explained as a NEW ANIMATED CHAPTER through the
   same agentic QA path a student's own question takes, and a knowledge
   point missed twice sends the tutor to study a video about it — the same
   open-world self-experimentation the movements get. */
const QUIZ={on:false,busy:false,asked:0,right:0,missed:[],_res:null};
$('chat').addEventListener('click',e=>{
  const b=e.target.closest('[data-quiz]');
  if(!b||!QUIZ._res)return;
  const r=QUIZ._res; QUIZ._res=null;
  b.parentElement.querySelectorAll('[data-quiz]')
    .forEach(x=>{x.disabled=true;});
  r(parseInt(b.getAttribute('data-quiz'),10));
});
function quizAsk(d){
  captionText=d.question; captionQA=true;
  if(voiceOn)speak(d.question);
  const chip=(i,label)=>'<button data-quiz="'+i+'" style="margin:3px 4px 0 0;'
    +'padding:5px 10px;border:1px solid #DCDCD2;border-radius:8px;'
    +'background:#FDFDF8;font:inherit;font-size:12px;cursor:pointer">'
    +label+'</button>';
  chatMsg('tutor','<b>'+d.question+'</b><br>'
    +d.choices.map((c,i)=>chip(i,String.fromCharCode(65+i)+'. '+c)).join('')
    +chip(-1,'skip'));
  return new Promise(res=>{
    QUIZ._res=res;
    const t=setInterval(()=>{   /* a stopped or redirected lesson lets go */
      if(lessonAbort||!QUIZ.on||pendingSeek!=null){clearInterval(t);
        if(QUIZ._res){QUIZ._res=null;res(null);}}
      if(!QUIZ._res)clearInterval(t);
    },300);
  });
}
async function quizChapter(sc){
  if(QUIZ.busy||!sc.narration)return;
  QUIZ.busy=true;
  try{
    const r=await fetch("/api/quiz",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({title:sceneName(sc),narration:sc.narration,
                           topic:topicNow||''})});
    const d=await r.json();
    if(!r.ok||!d.question||!Array.isArray(d.choices))return;
    if(lessonAbort)return;
    QUIZ.asked++;
    const ans=await quizAsk(d);
    captionText=""; captionQA=false;
    if(ans==null||ans<0){if(ans===-1)chatMsg('sys','question skipped');return;}
    if(ans===d.answer){
      QUIZ.right++;
      chatMsg('tutor','&#10003; right'+(d.why?' — '+d.why:''));
      if(voiceOn)speak('Right. '+(d.why||''));
    }else{
      QUIZ.missed.push(d);
      chatMsg('tutor','not quite — the answer is "'+d.choices[d.answer]+'"'
             +(d.why?'. '+d.why:''));
      if(voiceOn)speak('Not quite. The answer is '+d.choices[d.answer]
                      +'. '+(d.why||''));
      /* the miss is re-explained IN ANIMATION: route it through the same
         agentic QA path the student's own questions take, which answers
         grounded in the hivemind and builds a new animated chapter */
      if(!answering&&!lessonAbort){
        $('q').value='Explain again, with an animation: '+d.question;
        handleQuestion();
      }
      /* a knowledge point missed twice is a hole — go study a video on it */
      if(QUIZ.missed.filter(m=>m.topic===d.topic).length>=2)
        verifyStudy(d.topic||d.question);
    }
  }catch(_){}
  finally{QUIZ.busy=false; QUIZ._res=null;}
}
$('quizBtn').onclick=()=>{
  QUIZ.on=!QUIZ.on;

  $('quizBtn').setAttribute('aria-pressed',String(QUIZ.on));
  chatMsg('sys',QUIZ.on
    ?'&#9673; quiz on — after each chapter, one check question grounded in '
      +'what was actually taught. A miss is re-explained in animation; two '
      +'misses on one point and the tutor goes to study it.'
    :'quiz off'+(QUIZ.asked?' — '+QUIZ.right+'/'+QUIZ.asked+' so far':''));
};

/* ============ social simulation ============
   Movement chapters are verified by the camera; knowledge by the quiz. A
   SOCIAL skill can only be verified by USING it — so a social chapter ends
   in a role-play: a partner character speaks from the 3D room (a skeleton
   actor performing its own body language), the student answers by voice or
   the Ask box, and the reply is graded against the chapter's skill. Every
   exchange is measured into the QUANTIFIED SELF — score, response latency,
   reply length, persisted per student — and an online logistic predictor
   over that record (the same online cross-entropy discipline as the liquid
   network's readouts) forecasts whether the next exchange will land BEFORE
   it starts. The forecast is applied: a predicted struggle makes the
   partner scaffold (warmer, easier opening); a predicted breeze makes it
   stretch. A low-scoring reply is re-explained in full-steps animation
   through the same QA path everything else uses. */
const SIM={on:true,busy:false,told:false,low:0,_res:null,log:[]};
const SELF={n:0,score:50,latency:8,words:12,acc:0,accN:0,
            w:[0,0,0,0],b:0,eta:0.15};
function selfLoad(){
  try{
    const s=JSON.parse(localStorage.getItem('tutor_self_v1')||'null');
    if(!s)return;
    ['n','score','latency','words','acc','accN','b'].forEach(k=>{
      if(Number.isFinite(+s[k]))SELF[k]=+s[k];});
    if(Array.isArray(s.w)&&s.w.length===4&&s.w.every(Number.isFinite))
      SELF.w=s.w;
  }catch(_){}
}
function selfSave(){
  try{localStorage.setItem('tutor_self_v1',JSON.stringify(SELF));}catch(_){}
}
selfLoad();
function selfFeatures(latency,words){
  return [SELF.score/100,
          Math.min(1,(latency==null?SELF.latency:latency)/30),
          Math.min(1,(words==null?SELF.words:words)/40),
          Math.min(1,SELF.n/50)];
}
function selfPredict(){
  /* BEFORE the exchange: forecast p(reply lands >=70) from who the record
     says this student is — their running averages, not this reply */
  const z=selfFeatures(null,null);
  let o=SELF.b; for(let i=0;i<4;i++)o+=SELF.w[i]*z[i];
  return 1/(1+Math.exp(-o));
}
function selfLearn(pred,latency,words,landed){
  /* AFTER: one cross-entropy step on what actually happened, and an honest
     ledger of whether the pre-exchange forecast was right */
  const z=selfFeatures(latency,words);
  let o=SELF.b; for(let i=0;i<4;i++)o+=SELF.w[i]*z[i];
  const p=1/(1+Math.exp(-o));
  const g=SELF.eta*((landed?1:0)-p);
  for(let i=0;i<4;i++)SELF.w[i]+=g*z[i];
  SELF.b+=g;
  SELF.accN++; if((pred>=0.5)===!!landed)SELF.acc++;
}
function selfRecord(score,latency,words){
  const a=0.15;
  SELF.n++;
  SELF.score=(1-a)*SELF.score+a*score;
  SELF.latency=(1-a)*SELF.latency+a*latency;
  SELF.words=(1-a)*SELF.words+a*words;
  selfSave();
}
const SIM_WORDS=/\b(conversation|small talk|greeting|introduc\w*|interview|network\w*|negotiat\w*|apolog\w*|feedback|eye contact|listen\w*|empathy|persuas\w*|assertive\w*|conflict|dating|date|social|rapport|body language|presentation|public speaking|charisma|compliment|boundar\w*|de.?escalat\w*)\b/i;
function simIsSocial(sc){
  return SIM_WORDS.test((topicNow||'')+' '+(sceneName(sc)||'')
                        +' '+(sc.narration||''));

const SIM_SYS=`You open a SOCIAL ROLE-PLAY inside an animated lesson. You play ONE character the student must interact with, practicing the chapter's skill. Return STRICT JSON only — no prose, no fence:
{"skill":"the one skill being practiced, 2-6 words","scenario":"one sentence setting the scene, spoken to the student","partner":"your character's opening line, natural spoken dialogue","gesture":"one short imperative for the character's body language (e.g. 'Wave hello with an open palm, then stand relaxed')"}
Stay in a scene a beginner could meet tomorrow. If the instructions say SCAFFOLD, open warm and easy; if STRETCH, make the character realistically difficult (distracted, skeptical, brusque) — never abusive.`;
const SIM_EVAL_SYS=`You grade ONE reply in a social role-play, against the skill being practiced. Return STRICT JSON only:
{"score":0-100,"feedback":"one warm, concrete sentence about their reply","better":"a stronger version of their line, natural dialogue","partner":"your character's next spoken line continuing the scene, or \\"\\" if the scene is complete","gesture":"the character's body language for that line, or \\"\\"","done":true or false}
Score the SKILL, not eloquence: a plain reply that does the skill beats a fancy one that dodges it. 70 is the landing bar.`;
async function simTurn(line,gesture,skill){
  /* the partner acts from the 3D room: a skeleton actor performing its
     own body language while the line is spoken — the same player any
     chapter uses, so orbiting, annotations and captions all work */
  const ns={mode:'world',qa:true,sim:true,fresh:true,
            title:'role-play: '+(skill||'social skill'),
            narration:line,seconds:8,
            actors:[{kind:'skeleton',title:'your partner',
                     steps:[gesture||'Stand relaxed and make eye contact']}]};
  prepScene(ns);
  try{await ensureMedia(ns);}catch(_){}
  wipe(); captionText=line; captionQA=true;
  if(voiceOn)speak(line);
  await playScene(ns,(ns.seconds||8)*1000);
}
function simReply(){
  captionText="Your turn — speak (mic) or type your line, then Ask";
  captionQA=true;
  return new Promise(res=>{
    SIM._res=res;
    const t0=performance.now();
    const t=setInterval(()=>{   /* a stopped or redirected lesson lets go */
      if(lessonAbort||pendingSeek!=null||performance.now()-t0>60000){
        clearInterval(t);
        if(SIM._res){SIM._res=null;res(null);}}
      if(!SIM._res)clearInterval(t);
    },300);
  });
}
async function simChapter(sc){
  if(SIM.busy)return;
  SIM.busy=true;
  try{
    if(!SIM.told){SIM.told=true;
      chatMsg('sys','&#9673; social simulation — this chapter is INTERACTION '
        +'practice: the partner speaks from the 3D room, you reply by mic or '
        +'the Ask box. Every exchange is measured into your quantified self, '
        +'and its predictor sizes the difficulty to you.');}
    const pred=selfPredict();
    const shape=SELF.n<5?''
      :pred<0.4?'SCAFFOLD — the record predicts a struggle ('
        +Math.round(pred*100)+'%), open warm and easy.'
      :pred>0.75?'STRETCH — the record predicts an easy landing ('
        +Math.round(pred*100)+'%), make it realistically hard.':'';
    if(shape)chatMsg('sys','&#9678; quantified self: predicted '
      +Math.round(pred*100)+'% to land — '
      +(pred<0.4?'the partner will go easier':'the partner will push harder'));
    const raw=await askClaude(SIM_SYS+langRule(),
      'Topic: '+topicNow+'\nChapter: "'+sceneName(sc)+'" — '
      +(sc.narration||'')+'\n'+shape+'\n'+lnnDetailHint(),[],700);
    const p0=parseModelJSON(raw,'role-play');
    const d=Array.isArray(p0)?p0[0]:p0;
    if(!d||typeof d!=='object'||!d.partner)return;
    chatMsg('tutor','<b>role-play — '+(d.skill||'practice')+'</b><br>'
      +(d.scenario||''));
    if(voiceOn&&d.scenario)await speak(d.scenario,true);
    let line=d.partner, gesture=d.gesture, history=[];
    for(let turn=0;turn<3&&line;turn++){
      if(lessonAbort||pendingSeek!=null)break;
      chatMsg('tutor','&#128100; '+line);
      await simTurn(line,gesture,d.skill);
      if(lessonAbort||pendingSeek!=null)break;
      const askT0=performance.now();
      const reply=await simReply();
      captionText=""; captionQA=false;
      if(reply==null)break;
      const latency=(performance.now()-askT0)/1000;
      const words=reply.split(/\s+/).filter(Boolean).length;
      const eraw=await askClaude(SIM_EVAL_SYS+langRule(),
        'Skill: '+(d.skill||'')+'\nScenario: '+(d.scenario||'')
        +'\nHistory so far:\n'+history.join('\n')
        +'\nYour character said: "'+line+'"\nStudent replied: "'+reply+'"'
        +'\n'+lnnDetailHint(),[],700);
      const e0=parseModelJSON(eraw,'role-play grade');
      const ev=Array.isArray(e0)?e0[0]:e0;
      if(!ev||typeof ev!=='object'||!Number.isFinite(+ev.score))break;
      const score=Math.max(0,Math.min(100,+ev.score));
      const landed=score>=70;
      selfLearn(pred,latency,words,landed);
      selfRecord(score,latency,words);
      SIM.log.push({skill:d.skill||'',score:score});
      history.push('Partner: '+line,'Student: '+reply);
      chatMsg('tutor',(landed?'&#10003; ':'&#9678; ')+score+'/100 — '
        +(ev.feedback||'')
        +(ev.better&&!landed?'<br>stronger: &ldquo;'+ev.better+'&rdquo;':''));
      if(voiceOn)speak((landed?'Nice. ':'Almost. ')+(ev.feedback||''));
      chatMsg('sys','&#9678; quantified self: predicted '
        +Math.round(pred*100)+'% &rarr; scored '+score
        +' &middot; reply in '+latency.toFixed(1)+'s &middot; '+words
        +' words &middot; lifetime avg '+Math.round(SELF.score)
        +' over '+SELF.n);
      if(!landed){
        SIM.low++;
        /* the miss is re-explained IN FULL-STEPS ANIMATION through the
           same agentic QA path everything else uses */
        if(!answering&&!lessonAbort&&pendingSeek==null){
          $('q').value='Show me, step by step with an animation: how to '
            +(d.skill||'handle this social moment')
            +'. In the role-play I said "'+reply.slice(0,120)+'"';
          handleQuestion();
        }
        /* struggling twice sends the tutor to STUDY the skill live */
        if(SIM.low>=2){verifyStudy(d.skill||sceneName(sc));SIM.low=0;}
        break;
      }
      line=(ev.done||!ev.partner)?null:String(ev.partner);
      gesture=ev.gesture||'';
    }
  }catch(_){}
  finally{SIM.busy=false; SIM._res=null; captionQA=false;}
}
$('verifyBtn').onclick=()=>{
  /* mid-run the button is the escape hatch: skip THIS step, keep the mode —
     strict coaching must gate the lesson, not imprison the student */
  if(VERIFY.active){verifyNext(false);
    chatMsg('sys','step skipped by hand');return;}
  /* off -> verify -> coach (strict) -> off */
  if(!VERIFY.on){VERIFY.on=true;VERIFY.strict=false;}
  else if(!VERIFY.strict){VERIFY.strict=true;}
  else{VERIFY.on=false;VERIFY.strict=false;}
  $('verifyBtn').textContent=!VERIFY.on?'Verify: off'
    :VERIFY.strict?'Coach-verify':'Verify: on';
  $('verifyBtn').setAttribute('aria-pressed',String(VERIFY.on));
  chatMsg('sys',!VERIFY.on?'verify off'
    :VERIFY.strict
    ?'&#9673; COACH-VERIFY — the lesson proceeds ONLY when each required '
      +'action is actually performed on camera. A missed round is coached: '
      +'the tracked faults go to the tutor, it answers from the book, and '
      +'the pass band adapts to you round by round. The button becomes '
      +'"skip step" while a check is running.'
    :'&#9673; verify on — after each whole-body chapter the camera watches '
      +'YOU perform its steps, tracked joint by joint against that '
      +'chapter\'s own reference. Nothing leaves this tab. Click again for '
      +'strict coach-verify, which will not move on until the action lands.');
  if(!VERIFY.on&&!VERIFY.busy)verifyRelease();
};
$('mirrorBtn').onclick=e=>{
  COACH.mirror=!COACH.mirror;
  e.target.textContent="Mirror: "+(COACH.mirror?"on":"off");
  e.target.setAttribute('aria-pressed',COACH.mirror);
  COACH.spokeText=""; COACH.cueText="";
};
/* the camera is not left running because somebody closed the tab */
addEventListener('pagehide',()=>{coachRelease();verifyRelease();});

/* ?preset=world|both|fix|move|curve|anim|learn — deep-link into a preset,
   so a demo is one URL rather than one URL plus a click. */
/* the engaging tutorial, simulated end to end: three short chapters that
   exercise the WHOLE loop — anatomy-figure demonstration, camera-verified
   body and hand steps, quiz-able narration, interruptible throughout.
   ?preset=practice, or turn Verify/Quiz on first for the full experience. */
const HOW_PRACTICE=[
 {narration:"This is practice mode. I demonstrate each step, then it is "
   +"your turn: the camera checks it before we move on — and you can "
   +"interrupt me with a question at any moment, even mid-squat.",
  title:"how practice works",mode:"skeleton",seconds:10,
  motion_steps:["Stand tall with your feet shoulder-width apart"],
  muscles:["core"]},
 {narration:"First exercise, the squat. Sit back and down keeping your "
   +"back flat, then drive up through the heels. Your quads, glutes and "
   +"core do the work.",
  title:"the squat",mode:"skeleton",seconds:12,
  motion_steps:["Squat down keeping your back flat",
                "Stand back up driving through the heels"],
  muscles:["quads","glutes","core"]},
 {narration:"Now the fingers. Pinch your thumb and index finger together, "
   +"then spread the hand wide — the hand tracker is watching for real "
   +"movement, not a still hand.",
  title:"hand control",mode:"hand",seconds:10,
  hand_steps:["Pinch the thumb and index finger together",
              "Spread the fingers wide"]}];
const PRESETS={world:["one 3D room (LineFORM + generated footage)",()=>HOW_WORLD],
               both:["body skeleton and hand gestures together",()=>HOW_BOTH],
               fix:["fixing a slipped bicycle chain",()=>FIX_CHAIN],
               move:["how motion works (3D skeleton + gestures)",()=>HOW_MOVE],
               curve:["actuated curve interfaces (LineFORM)",()=>HOW_CURVE],
               anim:["how I animate",()=>HOW_ANIM],
               learn:["how I learn (crawler + hivemind)",()=>HOW_LEARN],
               practice:["practice: verified, quizzed, interruptible",
                         ()=>HOW_PRACTICE]};
/* ?mine=<youtube url> deep-links a mined lesson the same way, and
   ?coach=<what to practise> opens straight into a live session — one URL
   instead of a URL plus typing plus a click, which is also what makes the
   camera path testable without a person in front of the machine. */
(()=>{const q=new URLSearchParams(location.search);
  const p=q.get("preset"), m=q.get("mine"), c=q.get("coach");
  if(c){$('topic').value=c; setTimeout(coachStart,60); return;}
  if(m){$('tube').value=m; setTimeout(()=>mineVideo(m),60); return;}
  if(p&&PRESETS[p]){const[n,g]=PRESETS[p];setTimeout(()=>playPreset(n,g()),60);}})();

$('lang').onclick=e=>{
  lessonLang=lessonLang==="en"?"id":"en";
  e.target.textContent=lessonLang.toUpperCase();
  e.target.setAttribute('aria-pressed',lessonLang==="id");
  chatMsg('sys',lessonLang==="id"
    ?'&#9776; bahasa pelajaran: Indonesia — mulai pelajaran baru untuk menerapkannya'
    :'&#9776; lesson language: English — start a new lesson to apply it');
  withVoices(()=>voiceNote(true));       /* which voice will actually speak */
};
/* Flip the house style mid-lesson. Nothing is regenerated and nothing is
   refetched — the footage, the voice and the marker strokes are the same
   three layers either way; only how the words are set changes, which is
   exactly what makes the two comparable on one chapter. */
function capStyleLabel(){
  const b=$('capstyle'); if(!b)return;
  if(!mptGraphics){b.disabled=true;b.textContent="Look: sketch";
    b.setAttribute('aria-pressed','false');
    b.title="MoneyPrinterTurbo's fonts did not load, so only the board's own "
           +"hand is available"+(footageWhy?"":"");
    return;}
  b.disabled=false;
  b.textContent=capStyle==="mpt"?"Look: MPT":"Look: sketch";
  b.setAttribute('aria-pressed',capStyle==="mpt");
}
$('capstyle').onclick=()=>{
  if(!mptGraphics)return;
  capStyle=capStyle==="mpt"?"sketch":"mpt";
  capStyleLabel();
  /* re-enter the transition so the switch is visible immediately rather than
     at the next chapter boundary */
  if(capStyle==="mpt")mptTransStart();
  chatMsg('sys','look switched to '+(capStyle==="mpt"
    ?'MoneyPrinterTurbo — '+(MPTSUB.font||'')+', outlined, '+MPTSUB.position
    :'the board&rsquo;s own hand'));
};
$('voice').onclick=e=>{voiceOn=!voiceOn;
  e.target.textContent=voiceOn?"Voice on":"Voice off";
  e.target.setAttribute('aria-pressed',voiceOn);
  if(!voiceOn){if('speechSynthesis'in window)speechSynthesis.cancel();
    ttsStop();speaking=false;lipStop();}};
clearBoard();
</script>

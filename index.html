<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agentic Video Tutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#ECEDE9; --paper:#FDFDF8; --ink:#141412; --marker:#2456D6;
  --red:#C93A2E; --tray:#8A9086; --line:#D8DAD3;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--wall);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;min-height:100vh}
.wrap{max-width:1140px;margin:0 auto;padding:24px 18px 60px}
header{display:flex;align-items:baseline;gap:14px;margin-bottom:18px;flex-wrap:wrap}
h1{font-family:'Caveat',cursive;font-size:2.3rem;font-weight:600}
h1 .u{border-bottom:4px solid var(--marker);padding-bottom:2px}
header p{color:var(--tray);font-size:.88rem}
.grid{display:grid;grid-template-columns:1fr 320px;gap:20px}
@media(max-width:880px){.grid{grid-template-columns:1fr}}
.board-frame{background:#B9BDB4;border-radius:14px;padding:12px;box-shadow:0 6px 24px rgba(20,20,18,.12)}
.board{background:var(--paper);border-radius:8px 8px 0 0;position:relative;overflow:hidden}
canvas{display:block;width:100%;height:auto}
.badge{position:absolute;top:10px;right:10px;font-size:.72rem;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;padding:4px 10px;border-radius:99px;background:#F0F4FE;color:var(--marker);display:none}
.badge.paused{display:block;background:#FBEDEB;color:var(--red)}
.badge.live{display:block}
.recdot{position:absolute;top:10px;left:10px;display:none;align-items:center;gap:6px;
  font-size:.72rem;font-weight:600;color:var(--red)}
.recdot.on{display:flex}
.recdot i{width:10px;height:10px;border-radius:99px;background:var(--red);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
/* step pips: which beat of the explanation is on screen */
.beats{position:absolute;left:12px;bottom:78px;display:flex;flex-direction:column;gap:6px}
.beat{width:9px;height:9px;border-radius:99px;background:#D8DAD3;border:1.5px solid #C3C6BE;
  transition:background .3s ease,transform .3s ease}
.beat.on{background:var(--marker);border-color:var(--marker);transform:scale(1.35)}
.beat.past{background:#A9B6DA;border-color:#A9B6DA}

/* ===== CSS animation layer: chapter wipe over the board ===== */
.fx{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:linear-gradient(100deg,transparent 0%,rgba(36,86,214,.10) 38%,
    rgba(253,253,248,.88) 50%,rgba(36,86,214,.10) 62%,transparent 100%)}
.fx.on{animation:wipe .72s cubic-bezier(.5,0,.3,1)}
@keyframes wipe{0%{opacity:1;transform:translateX(-102%)}100%{opacity:1;transform:translateX(102%)}}

/* ===== CSS-animated tutor: idle bob, blink, think ring, lipsync mouth ===== */
.avatar{position:absolute;right:12px;bottom:10px;width:104px;pointer-events:none;
  --mo:.10;--mw:.90;
  animation:bob 4.6s ease-in-out infinite}
.avatar.rec-hidden{display:none}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.avatar svg{display:block;width:100%;height:auto;overflow:visible}
.avatar .head{fill:var(--paper);stroke:var(--ink);stroke-width:2.6;transition:stroke .25s ease}
.avatar.qa .head{stroke:var(--red)}
.avatar .eye{fill:var(--ink);transform-box:fill-box;transform-origin:center;
  animation:blinkeye 4.2s infinite}
@keyframes blinkeye{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.avatar .mouth{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;
  transform-box:fill-box;transform-origin:center;
  transform:scale(var(--mw),var(--mo));
  transition:transform 70ms linear}
.avatar.qa .mouth{stroke:var(--red)}
.avatar .ring{fill:none;stroke:var(--marker);stroke-width:2;stroke-dasharray:6 9;opacity:0}
.avatar.think .ring{opacity:.85;transform-box:fill-box;transform-origin:center;
  animation:spin 3.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.avatar.think .head{animation:pulse 1.25s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.avatar .tag{display:block;text-align:center;font-family:'Caveat',cursive;
  font-size:1rem;color:var(--tray);margin-top:-4px}

/* player chrome */
.chrome{background:#1E1F1D;border-radius:0 0 8px 8px;padding:10px 12px 12px}
.timeline{display:flex;gap:3px;height:12px;cursor:pointer;margin-bottom:8px}
.seg{position:relative;flex:1;background:#4A4C48;border-radius:3px;overflow:hidden;min-width:14px}
.seg .fill{position:absolute;inset:0;width:0;background:var(--marker)}
.seg.qa .fill{background:var(--red)}
.seg.photo .fill{background:#7A5AD6}
.seg.hybrid .fill{background:#1F9E7A}
.seg.skeleton .fill{background:#E08A2E}
.seg.hand .fill{background:#1F9E7A}
.seg.lineform .fill{background:#0F8B9E}
.seg.compose .fill{background:linear-gradient(90deg,#E08A2E,#1F9E7A,#0F8B9E)}
.seg:hover{outline:1.5px solid #fff}
.controls{display:flex;align-items:center;gap:10px;color:#D8DAD3;font-size:.8rem}
.controls button{background:transparent;border:1.5px solid #4A4C48;color:#EDEEE9;border-radius:6px;
  padding:5px 12px;font:inherit;font-weight:600;cursor:pointer}
.controls button:hover{border-color:#EDEEE9}
.controls button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.controls .spacer{flex:1}
.controls .rec{border-color:var(--red);color:#F5B8B1}
.interrupt{display:flex;gap:8px;margin-top:12px}
.interrupt input{flex:1;border:1.5px solid var(--line);border-radius:8px;padding:11px 14px;
  font:inherit;font-size:.95rem;background:#fff;color:var(--ink)}
.interrupt input:focus{outline:2px solid var(--red);outline-offset:1px;border-color:var(--red)}
button.big{font:inherit;font-weight:600;font-size:.92rem;border:none;border-radius:8px;
  padding:10px 16px;cursor:pointer}
button.big:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.danger{background:var(--red);color:#fff}
.primary{background:var(--marker);color:#fff;flex:1}
.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.ghost[aria-pressed="true"]{border-color:var(--marker);color:var(--marker)}
/* live coaching: green while the camera is on, so it is never ambiguous
   from across the room whether this page is watching you */
.coachbtn{background:transparent;color:#1F9E7A;border:1.5px solid #1F9E7A;flex:1}
.coachbtn.on{background:#1F9E7A;color:#fff}
.badge.coach{display:block;background:#E6F5F0;color:#1F9E7A}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;
  display:flex;flex-direction:column;gap:13px;align-self:start}
label{font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--tray)}
textarea{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;
  font:inherit;font-size:.95rem;resize:vertical;min-height:56px;background:#fff;color:var(--ink)}
textarea:focus{outline:2px solid var(--marker);outline-offset:1px;border-color:var(--marker)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.status{font-size:.85rem;color:var(--tray);min-height:1.2em}
.status.err{color:var(--red)}
.status.busy::after{content:"";display:inline-block;width:5px;height:5px;border-radius:99px;
  margin-left:7px;vertical-align:middle;background:var(--marker);animation:dots 1.1s infinite}
@keyframes dots{0%,100%{opacity:.25;transform:translateX(0)}50%{opacity:1;transform:translateX(4px)}}
.scenes{display:flex;flex-direction:column;gap:6px;max-height:170px;overflow-y:auto}
.scene{display:flex;gap:10px;align-items:baseline;padding:7px 10px;border-radius:8px;
  border:1px solid var(--line);font-size:.85rem;background:#fff;cursor:pointer;
  transition:border-color .18s ease,background .18s ease,transform .18s ease}
.scene:hover{border-color:var(--marker);transform:translateX(2px)}
.scene.active{border-color:var(--marker);background:#F0F4FE}
.scene.done{opacity:.55}
.scene.qa{border-style:dashed;border-color:var(--red)}
.scene.fresh{animation:popin .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes popin{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.scene .n{font-family:'Caveat',cursive;font-size:1.1rem;color:var(--marker);min-width:1.2em}
.scene .kind{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:.62rem;
  letter-spacing:.06em;text-transform:uppercase;color:var(--tray)}
.chat{display:flex;flex-direction:column;gap:6px;max-height:230px;overflow-y:auto;
  border-top:1px dashed var(--line);padding-top:10px}
.msg{font-size:.83rem;line-height:1.5;padding:7px 10px;border-radius:8px;max-width:95%;
  animation:slidein .3s ease}
@keyframes slidein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.tutor{background:#F0F4FE;align-self:flex-start}
.msg.you{background:#FBEDEB;align-self:flex-end}
.msg.sys{color:var(--tray);font-family:'IBM Plex Mono',monospace;font-size:.72rem;background:none;padding:2px 0}

@media(prefers-reduced-motion:reduce){
  .recdot i,.avatar,.avatar .eye,.avatar.think .ring,.avatar.think .head,
  .fx.on,.scene.fresh,.msg,.status.busy::after{animation:none}
  .avatar .mouth,.beat{transition:none}
  .scene:hover{transform:none}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Agentic <span class="u">video</span> tutor</h1>
  <p>Step-by-step animated explanations you can talk to — it pauses, annotates, even adds new scenes</p>
</header>

<div class="grid">
  <div>
    <div class="board-frame">
      <div class="board">
        <canvas id="cv" width="800" height="600"></canvas>
        <div class="fx" id="fx"></div>
        <div class="beats" id="beats"></div>
        <div class="avatar" id="avatar" aria-hidden="true">
          <svg viewBox="0 0 100 108">
            <circle class="ring" cx="50" cy="50" r="47"></circle>
            <circle class="head" cx="50" cy="50" r="42"></circle>
            <circle class="eye" cx="37" cy="40" r="3.2"></circle>
            <circle class="eye" cx="63" cy="40" r="3.2"></circle>
            <ellipse class="mouth" cx="50" cy="67" rx="12" ry="9"></ellipse>
          </svg>
          <span class="tag">tutor</span>
        </div>
        <div class="badge" id="badge">Live</div>
        <div class="recdot" id="recdot"><i></i>REC</div>
      </div>
      <div class="chrome">
        <div class="timeline" id="timeline" aria-label="Chapters"></div>
        <div class="controls">
          <button id="pauseBtn" disabled>Pause</button>
          <span id="timeMeta">0:00</span>
          <span class="spacer"></span>
          <span id="sceneMeta"></span>
          <button class="rec" id="rec" title="Record the board to a video file for YouTube">Record</button>
        </div>
      </div>
      <div class="interrupt">
        <input id="q" placeholder="Interrupt with a question — or ask for something new…" aria-label="Ask a question">
        <button class="big danger" id="ask">Ask</button>
        <button class="big ghost" id="mic" style="display:none">Mic</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <div>
      <label for="topic">Tutorial topic</label>
      <textarea id="topic">How photosynthesis works</textarea>
    </div>
    <div class="row">
      <button class="big primary" id="go">Start lesson</button>
      <button class="big ghost" id="demo">Demo</button>
      <button class="big ghost" id="voice" aria-pressed="true">Voice on</button>
      <button class="big ghost" id="lang" aria-pressed="false" title="Bahasa pelajaran / lesson language">EN</button>
      <button class="big ghost" id="capstyle" aria-pressed="true"
              title="Flip between MoneyPrinterTurbo's look — its bold outlined subtitle in its own font, entering on its transitions — and the board's own hand-drawn caption. Switches live, mid-lesson, so the two can be compared on the same chapter.">Look: MPT</button>
    </div>
    <div class="row">
      <button class="big ghost" id="howdraw">How I animate</button>
      <button class="big ghost" id="howlearn">How I learn</button>
    </div>
    <div class="row">
      <button class="big ghost" id="fixit">Fix something (hands)</button>
      <button class="big ghost" id="howmove">Show me a motion</button>
      <button class="big ghost" id="howcurve">Actuated curve</button>
      <button class="big ghost" id="howboth">Body + hands together</button>
      <button class="big ghost" id="howworld">One 3D room</button>
      <button class="big ghost" id="vectors" aria-pressed="true">Vectors on</button>
    </div>
    <label>Live coaching — your camera, scored against the rig</label>
    <div class="row">
      <button class="big coachbtn" id="coach"
              title="Turn on your camera. The rig performs the movement, MediaPipe tracks you, and the two are compared joint by joint — in your browser, nothing is uploaded.">Coach me</button>
      <button class="big ghost" id="mirrorBtn" aria-pressed="true"
              title="You are facing the demonstration, so copying it with the opposite arm is the natural thing to do. Mirror accepts that; turn it off to be graded on the same side the rig uses.">Mirror: on</button>
      <button class="big ghost" id="verifyBtn" aria-pressed="false"
              title="Verify each step through your camera as the lesson plays: after every whole-body chapter (a book exercise, a livestream step), the lesson pauses, you perform it, MediaPipe tracks your joints against that chapter's own steps, and the lesson moves on when you hit the pose. Click again for COACH-VERIFY: the lesson proceeds only when the action actually lands — missed rounds get a spoken correction grounded in the book, and the pass band adapts to you as you practice. Nothing uploaded.">Verify: off</button>
      <button class="big ghost" id="quizBtn" aria-pressed="false"
              title="Quiz what was just taught: after each chapter the tutor asks one check question grounded in the book/video/stream's own knowledge. Answer by clicking a choice; a miss is explained out loud AND as a new animated chapter, and a knowledge point missed twice sends the tutor off to study a video about it — the same self-experimentation loop the movements get.">Quiz: off</button>
    </div>
    <label>Teach from a book — upload a PDF and it becomes the lesson</label>
    <div class="row">
      <input id="bookfile" type="file" accept=".pdf,application/pdf" multiple style="display:none">
      <button class="big ghost" id="bookBtn"
              title="The book replaces the director: its exercises become animated chapters in its own teaching order — hand rigs, action reels, 3D rooms, and for exercise books a body figure with the working muscles lit up red — and its procedures go into the hivemind so interrupting mid-lesson gets answered from what the book actually says.">Upload a book</button>
    </div>
    <label for="tube">Mine a how-to — YouTube URL, wikiHow URL, or a topic</label>
    <div class="row">
      <input id="tube" type="text" placeholder="youtube URL, wikihow URL, or &quot;how to fix a bike chain&quot;"
             style="flex:1;min-width:0;padding:9px 11px;border:1px solid #DCDCD2;
                    border-radius:8px;font:inherit;font-size:13px;background:#FDFDF8">
      <button class="big ghost" id="mine">Mine it</button>
      <button class="big ghost" id="liveBtn" aria-pressed="false"
              title="Follow a livestream as it happens: every half-minute the new part of its transcript is mined into fresh chapters, appended to the playing lesson, and its procedures join the hivemind — the stream becomes a tutorial while it is still streaming.">Follow live</button>
      <button class="big ghost" id="track" aria-pressed="false"
              title="Track the real person in the video with BlazePose and MediaPipe Hands, instead of synthesising the motion from the transcript">Track: off</button>
    </div>
    <div class="status" id="status"></div>
    <label>Chapters (click to jump)</label>
    <div class="scenes" id="scenes"></div>
    <label>Conversation</label>
    <div class="chat" id="chat" aria-live="polite"></div>
  </div>
</div>
</div>

<script>
const GRID=50, cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
/* The render loop owns the canvas and runs 60 times a second, so a thrown
   error there would otherwise stop the board with no explanation. Surface it
   in the status line instead of the console nobody has open. */
window.onerror=(msg,src,line)=>{
  const s=$('status'); if(!s)return;
  s.textContent=`script error: ${msg} (line ${line})`; s.className='status err';
};
let voiceOn=true, scenes=[], topicNow="", qaHistory=[];
let videoEnabled=false, imageEnabled=false, recorder=null;
let trackEnabled=false, trackWhy="";
/* MoneyPrinterTurbo tiers, reported separately because they fail separately:
   narration needs only edge-tts (free, keyless), stock footage needs a Pexels
   key, and the MP4 export needs moviepy and an ffmpeg binary. A box that can
   narrate but not export should say so rather than hide all three. */
let ttsEnabled=false, footageEnabled=false, footageWhy="";
/* MoneyPrinterTurbo's GRAPHICS, not just its assets. Its renderer has a very
   particular caption look — a bold face from its own resource/fonts, white
   fill, black outline, centred at the bottom of the frame — and its own set
   of transitions between clips. Adopting both means a chapter on this board
   and a short rendered by its pipeline put the same words in the same place
   in the same face, instead of the board having a private house style that
   happens to sit on top of its footage. */
let mptGraphics=false, MPTSUB=null, mptFontFamily="";
/* Which of the two looks is on. They stay mutually exclusive on purpose —
   drawn together they would be two sets of words competing for the same
   corner — but the switch is live, so the same chapter can be seen both ways
   without restarting the lesson. "Look" covers the caption AND the
   transition, because those are the two halves of one house style. */
let capStyle="mpt";
const mptLook=()=>mptGraphics&&!!MPTSUB&&capStyle==="mpt";
fetch("/health").then(r=>r.json()).then(d=>{
  videoEnabled=!!d.video; imageEnabled=!!d.image;
  trackEnabled=!!d.track; trackWhy=d.track_why||"";
  /* mpt_status(): {ok, why} first, then per-tier. They fail separately —
     narration needs only edge-tts, stock footage needs a provider key, the
     export needs moviepy and ffmpeg — so each is read on its own. */
  const m=d.mpt||{};
  ttsEnabled=m.ok===true&&m.tts===true;
  footageEnabled=m.ok===true&&m.stock===true;
  footageWhy=m.ok!==true?String(m.why||"unavailable"):(m.stock_why||"");
  const bits=[];
  if(videoEnabled)bits.push("video "+(d.video_model||""));
  if(imageEnabled)bits.push("stills "+(d.image_model||""));
  if(trackEnabled)bits.push("pose tracking ready");
  if(ttsEnabled)bits.push("voice "+((m.voices||{})[lessonLang]||"neural"));
  if(footageEnabled)bits.push("stock footage");
  /* the caption look travels with the fonts, so both arrive together or
     neither does — a style that renders in a substitute face is worse than
     the board's own hand-drawn one */
  if(m.graphics===true&&m.subtitle){
    MPTSUB=m.subtitle;
    /* .ttc collections are CJK and browsers cannot load them at all, so the
       pick is the first Latin-capable face, preferring the configured one */
    const fonts=(m.fonts||[]).filter(f=>f.latin);
    const want=fonts.find(f=>f.file===m.subtitle.font)||fonts[0];
    if(want){
      const fam="MPT "+want.name;
      new FontFace(fam,`url("/api/mpt/font?f=${encodeURIComponent(want.file)}")`)
        .load().then(ff=>{document.fonts.add(ff);
                          mptFontFamily=fam; mptGraphics=true;
                          bits.push("MPT captions");
                          $('sceneMeta').textContent="Ready — "+bits.join(" · ");
                          capStyleLabel();})   /* the toggle is real now */
        .catch(()=>capStyleLabel());  /* font failed: board's own hand only */
    }
  }
  if(bits.length)$('sceneMeta').textContent="Ready — "+bits.join(" · ");
  const b=$('track');
  if(b&&!trackEnabled){b.disabled=true;b.textContent="Track: n/a";
    b.title="Real tracking needs mediapipe, opencv-python and yt-dlp on the server"
            +(trackWhy?" — "+trackWhy:"");}
}).catch(()=>{});
let captionText="", captionQA=false, speaking=false;

/* Replicate's CDN has to be proxied to stay same-origin — a cross-origin
   frame taints the canvas and a tainted canvas cannot be captureStream()'d,
   which would kill Record. MoneyPrinterTurbo's clips are ALREADY served from
   this origin by /api/mpt/media, so sending them through the proxy again
   would only get them rejected as a disallowed host. Anything starting with
   "/" is ours already and is passed straight through. */
const MEDIA=u=>String(u).startsWith("/")?u
              :"/api/media?u="+encodeURIComponent(u);
const reducedMotion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ============ coordinate mapping (grid y is bottom-up) ============ */
const PAD=42, CAP_H=64;
/* Every board->pixel mapping funnels through sx/sy/sscale, so putting one
   affine viewport in front of them lets ANY draw function render into a
   sub-rectangle of the canvas without knowing it is being composited.
   VP.on=false is the whole board, which is every non-composite scene. */
const VP={on:false,x:0,y:0,k:1};
const _sx=x=>PAD+(x/(GRID+1))*(cv.width-2*PAD);
const _sy=y=>cv.height-PAD-CAP_H-(y/(GRID+1))*(cv.height-2*PAD-CAP_H);
const sx=x=>VP.on?VP.x+_sx(x)*VP.k:_sx(x);
const sy=y=>VP.on?VP.y+_sy(y)*VP.k:_sy(y);
const sscale=()=>((cv.width-2*PAD)/(GRID+1))*(VP.on?VP.k:1);   /* grid -> px */
/* Run fn with the board squeezed into normalised rect [x,y,w,h]. The scale is
   uniform so nothing is stretched, and the rect is clipped so one pane can
   never scribble into its neighbour. */
function vpFor(r){
  const rx=r[0]*cv.width, ry=r[1]*cv.height,
        rw=r[2]*cv.width, rh=r[3]*cv.height;
  const k=Math.min(rw/cv.width,rh/cv.height);
  return {x:rx+(rw-cv.width*k)/2, y:ry+(rh-cv.height*k)/2, k:k};
}
function withViewport(r,fn){
  const prev={on:VP.on,x:VP.x,y:VP.y,k:VP.k}, v=vpFor(r);
  VP.on=true; VP.x=v.x; VP.y=v.y; VP.k=v.k;
  ctx.save(); ctx.beginPath();
  ctx.rect(r[0]*cv.width,r[1]*cv.height,r[2]*cv.width,r[3]*cv.height); ctx.clip();
  try{fn();}finally{ctx.restore(); VP.on=prev.on;VP.x=prev.x;VP.y=prev.y;VP.k=prev.k;}
}
/* inverse of _sx/_sy: pixels back to board grid, so a pane's landmark can be
   handed to the annotator in the coordinates its strokes actually use */
const ux=px=>(px-PAD)*(GRID+1)/(cv.width-2*PAD);
const uy=py=>(cv.height-PAD-CAP_H-py)*(GRID+1)/(cv.height-2*PAD-CAP_H);
const paneToBoard=(v,g)=>[ux(v.x+_sx(g[0])*v.k),uy(v.y+_sy(g[1])*v.k)];

/* ============ prompts ============ */
const STROKE_LANG=`Strokes use a ${GRID}x${GRID} grid: cells are x<COL>y<ROW>, x1y1 bottom-left, x${GRID}y${GRID} top-right. A stroke lists grid points plus t values in [0,1] (when the pen reaches each point). Repeat a point twice with adjacent t values for a sharp corner.
Examples:
Curve: <points>'x8y6','x6y7','x6y10','x8y11'</points><t_values>0.00,0.30,0.80,1.00</t_values>
Line: <points>'x18y31','x35y14'</points><t_values>0.00,1.00</t_values>
Rectangle: <points>'x13y27','x24y27','x24y27','x24y11','x24y11','x13y11','x13y11','x13y27'</points><t_values>0.00,0.30,0.25,0.50,0.50,0.75,0.75,1.00</t_values>`;

/* The board is an ANIMATED explainer, not a hand-drawing. The director writes
   the animation itself: elements that appear, move and pulse, grouped into
   beats that are revealed one at a time. */
const ANIM_LANG=`An animated scene is a list of "steps" (beats). Each beat reveals some elements and is on screen for an equal share of the chapter.
Coordinates are a ${GRID}x${GRID} grid: x1y1 is bottom-left, x${GRID}y${GRID} is top-right. Keep everything between 4 and 46 on both axes so nothing is clipped.
Element shapes:
  {"type":"box","x":cx,"y":cy,"w":W,"h":H,"label":"name"}
  {"type":"circle","x":cx,"y":cy,"r":R,"label":"name"}
  {"type":"dot","x":cx,"y":cy,"label":"name"}
  {"type":"arrow","from":[x,y],"to":[x,y],"label":"name"}
  {"type":"line","from":[x,y],"to":[x,y],"label":"name"}
  {"type":"text","x":cx,"y":cy,"text":"a few words"}
Every element also takes:
  "color": "ink" | "blue" | "red" | "green" | "purple"    (default ink)
  "in":    "pop" | "fade" | "slide" | "grow"              (how it enters)
  "motion":"none" | "pulse" | "bob" | "flow" | "orbit"    (what it keeps doing)
"flow" only means anything on an arrow or line — it animates dashes travelling along it, which is how you show something moving through a path. "orbit" circles a dot around its own position. Use motion deliberately: the thing the beat is ABOUT should be the thing that moves.
Build up a picture across beats — later beats add to what earlier beats put on screen, they do not replace it. 2-4 beats per chapter, 2-5 elements per beat. Label the parts, because the tutor points at them by name later.`;

const DIRECTOR_SYS=`You are the director of short animated tutorial videos. Given a topic, plan 3-4 chapters. Respond with ONLY a JSON array, no markdown fences.
Output STRICT JSON: every key and string double-quoted, no comments, no trailing commas, and never write "..." or an ellipsis as a placeholder — write the real content or leave the key out.
Shape of one chapter:
[{"narration":"1-2 conversational sentences, spoken aloud","title":"short noun phrase","mode":"actions","seconds":14,"actions":[{"text":"Drain the coolant into a pan","footage":"car radiator draining coolant"},{"text":"Unclip the upper hose","footage":"hands removing radiator hose clamp"}]}]
A chapter of abstract structure instead uses the shape mode, which is the OLD default and should now be rare:
[{"narration":"...","title":"short noun phrase","mode":"anim","seconds":10,"footage":"water pump impeller","steps":[{"beat":"what this beat shows","els":[{"type":"box","x":20,"y":30,"w":12,"h":8,"label":"pump","color":"blue","in":"pop"},{"type":"arrow","from":[27,30],"to":[36,30],"label":"flow","color":"red","in":"grow","motion":"flow"}]}]}]
${ANIM_LANG}
Four other modes exist for when a diagram is the wrong tool:
- "hand": a close-up 3D hand — 21 tracked landmarks, five finger chains — demonstrating the actual hand movements of a repair, with the gesture named and the finger curl read out live. Set "hand_steps" to 2-5 SHORT imperative actions that START WITH THE VERB ("Pinch the tab and peel it back", "Grip the cap and twist counter-clockwise", "Press the tab until it clicks"), and omit "steps". THIS IS THE BEST MODE FOR SHOWING SOMEONE HOW TO FIX SOMETHING — hands are what actually do a repair, and the student can ask about the grip and get an answer about the grip.
- "skeleton": the whole body performing the task, with gesture tracking and motion vectors. Set "motion_steps" the same way. Use it when the WHOLE BODY matters (posture, reach, a two-handed lift); use "hand" when the fingers matter, which for most repairs they do. When the task is an EXERCISE or athletic movement, also set "muscles":["glutes","quads",...] (lowercase common names: glutes, quads, hamstrings, calves, core, back, chest, shoulders, biceps, triceps, neck) — the figure is then drawn as an anatomy body, individual muscle bellies with fiber striations, and the named groups burn red-orange while they work, brighter the faster they move. For a fitness topic, one exercise per chapter with its reps and form cues as motion_steps and its working muscles named — and when a paid generation is justified, make that chapter "hybrid" instead, with a video_prompt beginning with this EXACT style sentence in every such chapter so the lesson looks like one production: "Smooth 3D-rendered fitness anatomy animation, matte white 3D figure with sculpted muscle definition, the working muscles glowing red-orange, modern gym with polished wooden floor and a large ocean-view window, soft studio lighting, slow orbiting camera, seamless loop, no text." followed by one sentence naming the exercise and equipment, and STILL carrying motion_steps and muscles so the anatomy figure performs it whenever video is off or fails.
- "lineform": an actuated curve interface — a chain of servo motors that bends itself into shapes. Set "shapes" to 2-4 of: curve, helix, surface, solid, phone, wristband, lamp, ruler, slider, data. Use it to show how one physical line can display a curve, a surface, a solid or an icon.
- "compose": TWO OR THREE of the above side by side on one timeline — the board splits into panes that all play together. Set "parts" to 2-3 of {"kind":"hand","steps":[...]}, {"kind":"skeleton","steps":[...]}, {"kind":"lineform","shapes":[...]}, each with an optional short "title". This is the RIGHT MODE whenever a step has both a whole-body component and a fingers component — "brace the wheel with your body while your fingers seat the chain" — because the student can watch the posture and the grip at the same time instead of choosing. Example: {"mode":"compose","seconds":12,"parts":[{"kind":"skeleton","steps":["Brace the wheel against your knee"],"title":"posture"},{"kind":"hand","steps":["Pinch the chain onto the teeth"],"title":"grip"}]}
- "world": ONE 3D room instead of panes — the strongest mode when WHERE things are is part of the lesson. Set "actors" to 1-3 of {"kind":"skeleton","steps":[...]}, {"kind":"hand","steps":[...]}, {"kind":"lineform","shapes":[...]}, each optionally with "title". They stand in one space at real scale, so they occlude each other; a hand and a body are automatically the SAME person's hand. Add "wrap":true to a lineform actor and the servo chain bandages itself around the moving forearm — that is the paper's constraint, and it cannot be shown in a pane. Add "video_prompt" and the diffusion footage plays on a screen hanging in the room instead of behind everything. Better still, set "step_videos":true and EVERY step gets its own generated clip, cut onto that screen exactly when the rig performs it — real footage of the pinch playing behind the servo chain doing the pinch. Only do that when seeing the real thing matters, because it is one paid generation per step (max 4); you may instead write the prompts yourself as "step_videos":["one dense cinematic sentence for step 1", "...step 2"]. The camera moves on its own shot list, cutting close for finger work and wide for whole-body work, and the student can drag it. Example: {"mode":"world","seconds":15,"actors":[{"kind":"skeleton","title":"posture","steps":["Brace the wheel against your knee"]},{"kind":"hand","title":"grip","steps":["Pinch the chain onto the teeth"]},{"kind":"lineform","title":"target shape","shapes":["curve","wristband"],"wrap":true}]}
- "photo": a diffusion-generated still photograph as the backdrop. Set "image_prompt" to a dense photographic description (subject, setting, lighting, no text in frame) and omit "steps". Use it for a real object, place or specimen the student should SEE.
- "hybrid": diffusion-generated film footage as the backdrop. Set "video_prompt" to 1-2 dense cinematic sentences naming the subject, its MOTION and the camera move, one continuous shot. Use it only when the motion is the point.
- "actions": THE DEFAULT AND THE ONE YOU SHOULD REACH FOR FIRST. The chapter is a list of real ACTIONS, and each action is shown as its own piece of REAL FILM, cut on the action's own boundary. Set "actions" to 2-5 objects: {"text":"Undo the quick link with pliers","footage":"bicycle chain quick link pliers"}. "text" is one short imperative instruction STARTING WITH THE VERB — it is spoken and captioned. "footage" is 2-5 words naming the filmable object or movement for that ONE action; omit it and the action text is searched instead. The clips cut in sequence, each action getting a slice of the chapter proportional to how long its instruction takes to say, and the tutor's marker strokes are drawn ON TOP of the film. This is how you show someone HOW TO DO SOMETHING: they watch the real movement, in order, annotated. Example: {"mode":"actions","seconds":16,"actions":[{"text":"Shift to the smallest sprocket","footage":"bicycle rear derailleur shifting"},{"text":"Undo the quick link","footage":"bicycle chain quick link"},{"text":"Thread the new chain through the derailleur cage","footage":"threading bicycle chain derailleur"}]}
Do NOT use "anim" for a physical action. A box labelled "chain" sliding next to a box labelled "sprocket" is a diagram OF an action, not the action, and nobody has ever learned a movement from it. "anim" now exists only for genuinely abstract structure that was never filmed — a data flow, a hierarchy, a before/after comparison of quantities — and should be at most ONE chapter of a lesson, if any.
EVERY chapter, in ANY mode, may also carry "footage": 2-5 words naming REAL FILM to play behind the explanation — the concrete, filmable noun, not the idea. Write "bicycle chain sprocket", not "how gears transmit force". This is a stock-library search, so it finds a real object being handled by real hands, in seconds and at no cost, and the diagram, the rig and the tutor's marker strokes are all drawn ON TOP of it. Use it on most chapters: seeing the actual part while the animation explains it is the whole point. Set "footage": false on a chapter that is pure abstraction and would only be muddied by film. This is NOT "video_prompt" — video_prompt is a paid diffusion generation and describes a shot; "footage" is two or three nouns.
Prefer "actions" — real film of the real movement, cut action by action, is the strongest explanation this board can give and it costs nothing. "skeleton", "compose" and "world" are also instant and free (a world chapter only costs money if you give it a "video_prompt"), so reach for them freely whenever a human action is being taught; use "world" for at least one chapter when the lesson involves a body, a tool and a part that have to be in the right places relative to each other. Use photo/hybrid for at most one chapter.`;

const SKETCH_SYS=`You are an expert annotator. You do NOT draw the subject — it is already on screen. You add a few marker strokes ON TOP of it: circles around a part, arrows pointing at it, underlines. ${STROKE_LANG}
Scale matters — a mark smaller than 4 grid units is invisible, so:
- A circle around a part is a closed loop of 6-8 points with a radius of 6 to 10 units around the part's location. Never a tiny scribble on top of it.
- An arrow is a straight line at least 10 units long ENDING at the part, starting from empty space to one side. Add a 2-stroke chevron at the tip if you want a head.
- An underline sits 4-6 units BELOW the part and runs 8-14 units wide.
Never draw through a label — circle around it or point at it from outside, so the text stays readable.
Plan in <thinking> tags in UNDER 40 words, then answer ONLY:
<strokes><s1><points>...</points><t_values>...</t_values><id>what you are pointing at</id></s1>...</strokes>
2-3 strokes, no more. Stay inside the grid. Do not use markdown fences.`;

const QA_SYS=`You are a friendly live tutor narrating an animated lesson. A student just INTERRUPTED with a question. You can see what is on the board (parts and grid locations are in the user message). ${STROKE_LANG}
Respond in exactly this format:
<answer>1-3 short spoken sentences, conversational, directly answering</answer>
Then OPTIONALLY exactly one of:
<strokes>1-3 annotation strokes placed ON the existing animation — a circle around a part, an arrow at it, an underline, at the parts' grid locations. Same stroke format with <id> labels.</strokes>
<new_scene>{"narration":"1-2 spoken sentences","title":"short noun phrase","mode":"anim","seconds":10,"steps":[{"beat":"...","els":[ ... ]}]}</new_scene>
A <new_scene> — a FULL animated chapter, played immediately as the answer — is REQUIRED for any question that asks how, why, "show me", "what happens if", "full steps", or whose answer involves a movement, a mechanism, a structure, a process or a place. Words plus a marker stroke are the whole answer only for a quick factual clarification ("what's that called?", "how many?") — and even then a new_scene is welcome. A student who interrupts deserves to be SHOWN, not told: when in doubt, build the chapter.
RECOGNIZE THE FORMAT of the question and pick the chapter mode to match it:
- a physical procedure -> "actions" (real film per action);
- finger technique -> "hand"; a whole-body movement or posture -> "skeleton" (with "muscles" when it is an exercise);
- body AND fingers together -> "compose"; where things are relative to each other -> "world";
- an abstract mechanism, comparison or structure -> "anim" with 2-4 beats that BUILD the picture.
Make the new_scene DETAILED — its own narration (2-3 sentences), a real title, 2-4 steps/actions — and it may carry "footage": 2-5 words naming real stock film to play behind it.
When coach-verify is armed, the steps of your new_scene are REQUIRED PRACTICE, not illustration: after the chapter plays, the student must perform those exact steps on their camera, tracked joint by joint, before the lesson proceeds — and the check of the chapter they interrupted still runs right after yours. So write every step as ONE short physically performable imperative ("Bend both knees to ninety degrees"), never a fact or an abstraction.
THE PREFERRED new_scene whenever the student asks how to physically DO something — "show me", "how do I", "what grip", "walk me through it" — is {"mode":"actions","actions":[{"text":"Grip the cap and twist counter-clockwise","footage":"hand twisting bottle cap"}, ...]}: 2-4 short imperative actions, each with 2-5 words of "footage" naming the filmable thing. That chapter plays REAL FILM of each action cut to its narration, with the tracked hand or body rig performing the same movement over the film and your marker strokes on top — the fully physical explanation, and the strongest one this board has.
A new_scene may instead be {"mode":"hand","hand_steps":["Grip the cap and twist counter-clockwise", ...]} — a close-up tracked hand demonstrating the actual finger movements, with no film behind it. Or {"mode":"skeleton","motion_steps":[...]} for a whole-body action — and when that action is an exercise, add "muscles":["glutes","quads",...] (lowercase common names) and the figure is drawn as an anatomy body with those groups burning red-orange while they work, exactly like the lesson's own exercise chapters. All of these are fast, so prefer them over a diagram any time the answer is a movement rather than a fact.
When the answer needs the body AND the fingers together, use {"mode":"compose","parts":[{"kind":"skeleton","steps":[...],"title":"posture"},{"kind":"hand","steps":[...],"title":"grip"}]} — the board splits and both play on one timeline, which is the honest answer to "show me how to hold it while I do that". Or {"mode":"world","step_videos":true,"actors":[{"kind":"skeleton","steps":[...]},{"kind":"hand","steps":[...]}]} to put them in ONE 3D ROOM at real scale — with "step_videos":true the room's screen plays REAL FOOTAGE of each step, cut to the moment the actor performs it, while the camera travels between the actors and the screen. That room is this board's FULL INSTRUCTION VIDEO: prefer it for a complete how-to that involves the body AND the hands AND real objects or tools, and for any question about where things are relative to each other. The room is INTERACTIVE — the student can drag to orbit it while you keep teaching, and your <camera> moves answer vantage-point questions inside it.
If the board is already a 3D room, you may ALSO answer by moving the camera:
<camera>{"target":"grip index tip","dist":0.8,"seconds":1.4,"label":"close on the grip"}</camera>
"target" is one of the anchor names listed on the board above (or [x,y,z]); "shot" may instead name one of the director's own shots (wide, medium, close, side, screen, curve); "dist" is metres from the target; "yaw" and "pitch" are radians. Use it whenever the question is really about a vantage point — "show me from the side", "get closer", "what is behind it", "can I see the screen" — because in a room that question has a real answer. A camera move can accompany <answer> and <strokes>; annotations stay stuck to what they were pointing at while the camera moves.
${ANIM_LANG}
You may ALSO answer by putting REAL FILM on the board and marking it up:
<footage>bicycle chain sprocket</footage>
2-5 words naming a filmable object or action — a stock-library search, not a shot description. The clip replaces the backdrop and YOUR STROKES ARE DRAWN ON TOP OF IT, so the honest answer to "what does that actually look like" or "show me the real thing" is film with a circle around the part in question. Use it together with <answer> and <strokes>: the footage shows it, the strokes point at it, the words explain it. It costs nothing and arrives in seconds. Do not use it for an abstraction that was never filmed.
Use <strokes> to point at what is already on screen. Omit both if words alone answer it. Never leave the grid.
The question may be UNRELATED to the current lesson topic. That changes nothing: answer it fully and teach it from scratch with its own new_scene — there is no such thing as off-topic, and you never refuse or defer an interrupt.`;

/* the liquid network's applied hand in every ANSWER: the detail-need trait
   (fourth readout, earned from the student's own camera practice) sizes the
   steps of every generated chapter — finer for a student who needs coached
   rounds, leaner for one who hits clean. General purpose by construction:
   the trait is about the STUDENT, not the topic, so it applies to any
   question, related to the lesson or not. */
function lnnDetailHint(){
  try{lnnInit();}catch(_){return '';}
  const n=LNN.need;
  return n>0.6
    ?'TRACKED PRACTICE (liquid network, this student): they tend to need '
     +'coached rounds before a step lands — write MORE and FINER steps '
     +'(5-7, one small explicit action each, nothing implied).'
    :n<0.4
    ?'TRACKED PRACTICE (liquid network, this student): they hit steps '
     +'clean on the first try — 3-5 efficient steps are enough.'
    :'TRACKED PRACTICE: no strong signal on this student yet — 4-6 clear '
     +'steps.';
}
const QA_STEPS_SYS=`You convert a tutor's SPOKEN answer into ONE complete animated chapter, returned as STRICT JSON only — no prose, no markdown fence, no XML tags.
RECOGNIZE THE FORMAT of the question and pick the mode:
- a physical procedure -> {"mode":"actions","actions":[{"text":"one short imperative","footage":"2-5 words of filmable action"}, ...]}
- finger technique -> {"mode":"hand","hand_steps":["...", ...]}
- a whole-body movement or exercise -> {"mode":"skeleton","motion_steps":["...", ...]} plus "muscles":["quads",...] when it is an exercise
- body AND fingers together -> {"mode":"compose","parts":[{"kind":"skeleton","title":"posture","steps":[...]},{"kind":"hand","title":"grip","steps":[...]}]}
- a COMPLETE how-to involving the body AND the hands AND real objects or tools, or where things are relative to each other -> {"mode":"world","step_videos":true,"actors":[{"kind":"skeleton","steps":[...]},{"kind":"hand","steps":[...]}]} — the INTERACTIVE instruction video: real footage of every step plays on the room's screen, cut to the actor performing it, the camera travels between them, and the student can drag to orbit the room
- an abstract mechanism, fact or comparison -> {"mode":"anim","steps":[{"beat":"one spoken beat","els":[...]},...]}
ALWAYS include "narration" (2-3 spoken sentences that TEACH it), "title" (short noun phrase) and "seconds" (8-18).
The steps are the FULL STEPS of the how-to: every action, one short physically performable imperative each, nothing skipped and nothing implied. The question may be UNRELATED to any current lesson — teach it from scratch anyway; there is no such thing as off-topic.`;
async function qaFullSteps(q,answer){
  /* the second chance the answer is OWED: when the tutor's reply carried
     no playable chapter (or a malformed one), this call builds the full-
     steps animation from the reply itself — format recognized by the
     model, step granularity set by the liquid network's detail-need trait */
  try{
    const raw=await askClaude(QA_STEPS_SYS+langRule(),
      'Question: '+q+'\nSpoken answer to expand into the chapter:\n'+answer
      +'\n\n'+lnnDetailHint(),[],1400);
    const p=parseModelJSON(raw,"full-steps chapter");
    const ns=Array.isArray(p)?p[0]:p;
    if(!ns||typeof ns!=="object"||Array.isArray(ns))return null;
    return ns;
  }catch(_){return null;}
}

/* ============ lesson language ============
   Only the SPOKEN and DISPLAYED text changes. Keys, mode names and enum
   values stay English or the parser stops recognising its own scenes, and
   the diffusion prompts stay English because the image and video models
   were trained that way. */
let lessonLang="en";
const LANG_RULE={
  en:"",
  id:`

BAHASA: Tulis SEMUA teks yang diucapkan atau tampil di layar dalam Bahasa Indonesia yang wajar dan santai — "narration", "title", "beat", setiap "label" dan "text" pada elemen, setiap kalimat di <answer>, dan setiap <id> pada stroke.
JANGAN diterjemahkan: kunci JSON, nama mode ("anim","world","hand","skeleton","lineform","compose","photo","hybrid"), nilai "color"/"in"/"motion", nama tag XML, dan isi "image_prompt"/"video_prompt" — semuanya tetap bahasa Inggris persis seperti aslinya, karena model gambar dan videonya berbahasa Inggris.
Langkah gerakan ("steps","hand_steps","motion_steps") juga tetap bahasa Inggris: pengurai gerak mencocokkan kata kerja bahasa Inggris untuk memilih gestur. Narasinya yang berbahasa Indonesia, bukan langkahnya.`
};
const langRule=()=>LANG_RULE[lessonLang]||"";
const speechLang=()=>lessonLang==="id"?"id-ID":"en-US";

/* Voice choice is not cosmetic. With no id-ID voice on the machine the
   browser happily narrates an Indonesian lesson with an American voice,
   mispronouncing every word — and says nothing about it. So: rank what is
   actually on offer, and announce which one won, because a missing voice
   should be visible rather than merely audible. */
const allVoices=()=>('speechSynthesis'in window)
  ?(speechSynthesis.getVoices()||[]):[];
function scoreVoice(v,locale){
  const lang=(v.lang||"").toLowerCase().replace("_","-");
  const want=locale.toLowerCase();
  let s;
  if(lang===want)s=100;                                   /* id-ID exactly */
  else if(lang.split("-")[0]===want.split("-")[0])s=70;   /* any id-* */
  else return -1;                                /* wrong language: unusable */
  const n=(v.name||"").toLowerCase();
  if(n.includes("natural"))s+=30;      /* Edge's cloud voices, far better */
  if(n.includes("online"))s+=10;
  if(n.includes("desktop"))s-=15;      /* legacy SAPI, robotic */
  if(v.localService)s+=5;              /* still works with no network */
  return s;
}
function pickVoice(locale){
  let best=null,bs=-1;
  for(const v of allVoices()){
    const s=scoreVoice(v,locale);
    if(s>bs){bs=s;best=v;}
  }
  return bs>=0?best:null;
}
/* getVoices() is empty until the browser has loaded them, and not every
   browser fires voiceschanged, hence the timeout. */
function withVoices(cb){
  if(!('speechSynthesis'in window)||allVoices().length)return cb();
  let done=false;
  const fire=()=>{if(!done){done=true;cb();}};
  speechSynthesis.addEventListener('voiceschanged',fire,{once:true});
  setTimeout(fire,1200);
}
let voiceNoted="";
function voiceNote(force){
  const loc=speechLang();
  if(!force&&voiceNoted===loc)return;          /* say it once per language */
  voiceNoted=loc;
  if(!('speechSynthesis'in window))
    return chatMsg('sys','&#9888; this browser has no speech synthesis');
  const v=pickVoice(loc);
  if(v)return chatMsg('sys','&#9834; voice: '+v.name+' ('+v.lang+')');
  const others=allVoices().length;
  chatMsg('sys',lessonLang==="id"
    ?'&#9888; tidak ada suara Indonesia di perangkat ini'
      +(others?' (dari '+others+' suara terpasang)':'')
      +' — narasi akan dibacakan suara Inggris. Buka halaman ini di Microsoft '
      +'Edge untuk suara Ardi/Gadis dari cloud, atau pasang paket Speech '
      +'Bahasa Indonesia lewat Windows Settings &gt; Time &amp; language.'
    :'&#9888; no '+loc+' voice installed — falling back to the browser default');
}

/* Same-origin Python backend proxy — see server.py. No CORS, key stays on the server. */
async function askClaude(system,user,history=[],max=2500){
  const r=await fetch("/api/claude",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:max,system,
      messages:[...history,{role:"user",content:user}]})});
  const d=await r.json();
  if(!d.content) throw new Error(d.error?.message||"API call failed");
  return d.content.map(b=>b.type==="text"?b.text:"").join("");
}

/* ============ tolerant JSON for model output ============
   The director returns a JSON array. Models occasionally emit JSON-ish
   instead: a trailing comma, a bare key, a smart quote from a narration
   sentence. One bad character used to lose the whole lesson, so parse
   strictly first, then repair, and if it still fails report the offending
   text rather than a bare position number nobody can act on. */
function jsonSlice(txt){
  txt=txt.replace(/```[a-z]*\n?|```/g,"").trim();
  /* whichever container OPENS first is the outer one. Preferring [ ]
     unconditionally used to GUT any object whose first nested array
     closed before the object did — {"mode":"actions","actions":[...]}
     came back as just the actions, and a full-steps answer chapter
     degraded into one modeless fragment. */
  const a=txt.indexOf('['), c=txt.indexOf('{');
  if(a>=0&&(c<0||a<c)){
    const b=txt.lastIndexOf(']');
    if(b>a)return txt.slice(a,b+1);
  }
  const d=txt.lastIndexOf('}');
  if(c>=0&&d>c)return '['+txt.slice(c,d+1)+']';
  const b=txt.lastIndexOf(']');
  if(a>=0&&b>a)return txt.slice(a,b+1);
  return txt;
}
/* Split into string / non-string runs so repairs never touch prose. A
   narration like "Step 1: tighten it, then check" contains both a colon and
   a comma; rewriting those would corrupt the text it is trying to save. */
function jsonSegments(t){
  const segs=[]; let buf='', inStr=false, esc=false;
  for(const ch of t){
    if(inStr){
      buf+=ch;
      if(esc)esc=false; else if(ch==='\\')esc=true;
      else if(ch==='"'){segs.push({s:true,t:buf});buf='';inStr=false;}
    }else if(ch==='"'){
      if(buf)segs.push({s:false,t:buf});
      buf='"'; inStr=true;
    }else buf+=ch;
  }
  if(buf)segs.push({s:inStr,t:buf});
  return segs;
}
function repairJSON(t){
  return jsonSegments(t).map(seg=>seg.s?seg.t:seg.t
      .replace(/,(\s*[}\]])/g,'$1')                       /* trailing comma */
      .replace(/([{,]\s*)([A-Za-z_$][\w$]*)(\s*:)/g,'$1"$2"$3')  /* bare key */
      .replace(/\[\s*\.\.\.\s*\]/g,'[]')                  /* copied ellipsis */
      .replace(/(\}|\])\s*(?=\{)/g,'$1,')                 /* missing comma */
    ).join('')

}
function repairBrackets(t){
  /* The regex repairs cannot fix a MISMATCHED bracket — the director writing
     "y": 46] where the ] belongs to nothing, which took down a whole lesson.
     This walks the text with a real bracket stack (strings skipped, so a "]"
     inside a label is left alone) and, at each closer that disagrees with
     the stack, decides between the two ways a model makes this mistake:
     - the closer is NOISE and the object/array continues ("y": 46], "r": 3
       — the next token is a key, so the ] is simply deleted), or
     - the closer is the WRONG CHARACTER for a real close ({"a": 1], {"b"...
       — the next element starts, so ] becomes }).
     Anything still open at the end is closed, which also rescues a director
     reply that was truncated between elements. */
  const n=t.length, stack=[]; let out='', i=0;
  const skipStr=j=>{j++;
    while(j<n){if(t[j]==='\\')j+=2;else if(t[j]==='"')return j+1;else j++;}
    return n;};
  const tok=j=>{while(j<n&&/\s/.test(t[j]))j++;return j;};
  while(i<n){
    const c=t[i];
    if(c==='"'){const e=skipStr(i);out+=t.slice(i,e);i=e;continue;}
    if(c==='{'||c==='['){stack.push(c);out+=c;i++;continue;}
    if(c==='}'||c===']'){
      const want=c==='}'?'{':'[';
      if(stack.length&&stack[stack.length-1]===want){stack.pop();out+=c;i++;continue;}
      if(!stack.length){i++;continue;}          /* closer with nothing open */
      const top=stack[stack.length-1];
      const j=tok(i+1);
      if(t[j]===','){
        const k=tok(j+1);
        if(t[k]==='"'){
          const m=tok(skipStr(k));
          if(top==='{'&&t[m]===':'){i++;continue;}   /* a key follows: noise */
          if(top==='['&&t[m]!==':'){i++;continue;}   /* an element follows */
        }else if(top==='['&&t[k]!==undefined){i++;continue;}
      }
      stack.pop();out+=(top==='{'?'}':']');i++;      /* meant the other one */
      continue;
    }
    out+=c;i++;
  }
  while(stack.length)out+=(stack.pop()==='{'?'}':']');
  return out;
}
function parseModelJSON(raw,what){
  const t=jsonSlice(raw);
  try{return JSON.parse(t);}catch(e1){
    try{
      const fixed=repairJSON(t);
      const v=JSON.parse(fixed);
      chatMsg('sys','&#9888; '+what+' JSON needed repair (trailing comma or bare key)');
      return v;
    }catch(e2){
      try{
        const v=JSON.parse(repairBrackets(repairJSON(t)));

      }catch(e3){

        throw new Error(e2.message+'  |  near: …'+near+'…');
      }

/* ============ stroke parsing + Bezier fit (SketchAgent Eq. 2) ============
   Kept only for ANNOTATIONS now — the subject itself is animated, not drawn. */
function parseStrokes(txt){
  txt=txt.replace(/```[a-z]*\n?|```/g,"");
  const out=[];
  const blocks=[...txt.matchAll(/<s\d*>([\s\S]*?)<\/s\d*>/g)].map(m=>m[1]);
  if(!blocks.length){
    const ps=[...txt.matchAll(/<points>([\s\S]*?)<\/points>/g)];
    const tb=[...txt.matchAll(/<t_values>([\s\S]*?)<\/t_values>/g)];
    ps.forEach((p,i)=>blocks.push(
      `<points>${p[1]}</points><t_values>${tb[i]?tb[i][1]:""}</t_values>`));
  }
  for(const b of blocks){
    const pm=b.match(/<points>([\s\S]*?)<\/points>/);
    if(!pm) continue;
    const pts=[...pm[1].matchAll(/x\s*(\d+)\s*y\s*(\d+)/gi)].map(c=>[+c[1],+c[2]]);
    if(!pts.length) continue;
    const tm=b.match(/<t_values>([\s\S]*?)<\/t_values>/);
    let ts=tm?(tm[1].match(/\d*\.?\d+/g)||[]).map(Number):[];
    if(ts.length!==pts.length) ts=pts.map((_,i)=>pts.length>1?i/(pts.length-1):0);
    const im=b.match(/<id>([\s\S]*?)<\/id>/);
    out.push({pts,ts,label:im?im[1].trim():""});
  }
  return out;
}
const bern=t=>[(1-t)**3,3*(1-t)**2*t,3*(1-t)*t*t,t**3];
function fitSegment(pts,ts){
  if(pts.length===1) return [[pts[0],pts[0],pts[0],pts[0]]];
  if(pts.length===2){const[a,b]=pts;
    return [[a,[a[0]+(b[0]-a[0])/3,a[1]+(b[1]-a[1])/3],[a[0]+2*(b[0]-a[0])/3,a[1]+2*(b[1]-a[1])/3],b]];}
  const t0=ts[0],span=Math.max(ts[ts.length-1]-t0,1e-9);
  const A=ts.map(t=>bern((t-t0)/span));
  const AtA=[...Array(4)].map((_,i)=>[...Array(4)].map((_,j)=>A.reduce((s,r)=>s+r[i]*r[j],0)));
  const AtB=[...Array(4)].map((_,i)=>[A.reduce((s,r,k)=>s+r[i]*pts[k][0],0),
                                      A.reduce((s,r,k)=>s+r[i]*pts[k][1],0)]);
  const P=[[0,0],[0,0],[0,0],[0,0]];
  for(let ax=0;ax<2;ax++){
    const M=AtA.map(r=>[...r]), v=AtB.map(r=>r[ax]);
    for(let c=0;c<4;c++){
      let p=c;for(let r=c+1;r<4;r++)if(Math.abs(M[r][c])>Math.abs(M[p][c]))p=r;
      [M[c],M[p]]=[M[p],M[c]];[v[c],v[p]]=[v[p],v[c]];
      if(Math.abs(M[c][c])<1e-12)continue;
      for(let r=0;r<4;r++){if(r===c)continue;
        const f=M[r][c]/M[c][c];
        for(let k=c;k<4;k++)M[r][k]-=f*M[c][k];v[r]-=f*v[c];}
    }
    for(let i=0;i<4;i++)P[i][ax]=Math.abs(M[i][i])>1e-12?v[i]/M[i][i]:pts[0][ax];
  }
  let err=0;
  A.forEach((r,k)=>{const x=r[0]*P[0][0]+r[1]*P[1][0]+r[2]*P[2][0]+r[3]*P[3][0],
    y=r[0]*P[0][1]+r[1]*P[1][1]+r[2]*P[2][1]+r[3]*P[3][1];
    err=Math.max(err,Math.abs(x-pts[k][0]),Math.abs(y-pts[k][1]));});
  if(err>0.9&&pts.length>=5){
    const mid=pts.length>>1;
    return [...fitSegment(pts.slice(0,mid+1),ts.slice(0,mid+1)),
            ...fitSegment(pts.slice(mid),ts.slice(mid))];
  }
  P[0]=pts[0];P[3]=pts[pts.length-1];
  return [P];
}
function fitStroke(st){
  const segs=[];let start=0;
  for(let i=1;i<st.pts.length;i++)
    if(st.pts[i][0]===st.pts[i-1][0]&&st.pts[i][1]===st.pts[i-1][1]){segs.push([start,i]);start=i;}
  segs.push([start,st.pts.length]);
  st.beziers=[];
  for(const[a,b]of segs) if(b-a>=1)
    st.beziers.push(...fitSegment(st.pts.slice(a,b),st.ts.slice(a,b)));
  return st;
}
function bezierPolyline(P,n=48,jit=0.09){
  const pl=[];
  for(let i=0;i<n;i++){const w=bern(i/(n-1));
    pl.push([w[0]*P[0][0]+w[1]*P[1][0]+w[2]*P[2][0]+w[3]*P[3][0]+(Math.random()-.5)*jit*2,
             w[0]*P[0][1]+w[1]*P[1][1]+w[2]*P[2][1]+w[3]*P[3][1]+(Math.random()-.5)*jit*2]);}
  return pl;
}
function strokesToItems(strokes,jit=0.09){
  const items=[];
  for(const st of strokes){fitStroke(st);
    st.beziers.forEach((P,i)=>items.push({pl:bezierPolyline(P,48,jit),label:i===0?st.label:null,st}));}
  return items;
}
const centroid=st=>{
  const cx=st.pts.reduce((s,p)=>s+p[0],0)/st.pts.length,
        cy=st.pts.reduce((s,p)=>s+p[1],0)/st.pts.length;
  return `x${Math.round(cx)}y${Math.round(cy)}`;
};

/* ============ animation engine ============
   Elements are rendered as finished shapes that ANIMATE IN — they are never
   drawn stroke by stroke. Each beat's elements enter together (staggered), then
   keep whatever continuous motion they were given for the rest of the chapter. */
const COLORS={ink:"#141412",blue:"#2456D6",red:"#C93A2E",green:"#1F9E7A",purple:"#7A5AD6"};
const TINTS ={ink:"rgba(20,20,18,.05)",blue:"rgba(36,86,214,.09)",red:"rgba(201,58,46,.08)",
               green:"rgba(31,158,122,.09)",purple:"rgba(122,90,214,.09)"};
const ENTER_MS=520, STAGGER_MS=130;
const easeOut=p=>1-Math.pow(1-p,3);
const easeBack=p=>{const c=1.7;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2);};

function normEls(spec){
  /* flatten steps -> elements carrying their beat index, and sanity-clamp
     everything the model gave us so one bad number can't wreck the board */
  const out=[];
  (spec||[]).forEach((step,si)=>{
    (step.els||[]).slice(0,6).forEach((raw,ei)=>{
      const e={...raw};
      e.step=si; e.order=ei;
      e.type=["box","circle","dot","arrow","line","text"].includes(e.type)?e.type:"box";
      e.color=COLORS[e.color]?e.color:"ink";
      e.in=["pop","fade","slide","grow"].includes(e.in)?e.in:"pop";
      e.motion=["none","pulse","bob","flow","orbit"].includes(e.motion)?e.motion:"none";
      const cl=(v,d)=>Number.isFinite(+v)?Math.max(1,Math.min(GRID,+v)):d;
      e.x=cl(e.x,25); e.y=cl(e.y,25);
      e.w=Math.max(2,Math.min(44,+e.w||10)); e.h=Math.max(2,Math.min(40,+e.h||8));
      e.r=Math.max(1.5,Math.min(20,+e.r||5));
      if(Array.isArray(e.from))e.from=[cl(e.from[0],10),cl(e.from[1],25)];
      if(Array.isArray(e.to))e.to=[cl(e.to[0],30),cl(e.to[1],25)];
      if((e.type==="arrow"||e.type==="line")&&(!e.from||!e.to)){
        e.from=e.from||[e.x-5,e.y]; e.to=e.to||[e.x+5,e.y];
      }
      e.label=typeof e.label==="string"?e.label.slice(0,42):"";
      e.text=typeof e.text==="string"?e.text.slice(0,60):"";
      out.push(e);
    });
  });
  return out;
}
function elAnchor(e){                       /* grid point the tutor points at */
  if(e.type==="arrow"||e.type==="line")
    return [(e.from[0]+e.to[0])/2,(e.from[1]+e.to[1])/2];
  return [e.x,e.y];
}
function arrowHead(x1,y1,x2,y2,color,lw){
  const a=Math.atan2(y2-y1,x2-x1), L=11+lw;
  ctx.fillStyle=color; ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2-L*Math.cos(a-0.42),y2-L*Math.sin(a-0.42));
  ctx.lineTo(x2-L*Math.cos(a+0.42),y2-L*Math.sin(a+0.42));
  ctx.closePath(); ctx.fill();
}
function labelAt(txt,px,py,color){
  if(!txt)return;
  ctx.font='19px "Caveat", cursive'; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillStyle=color; ctx.fillText(txt,px,py);
}
function drawEl(e,now,onMedia){
  const p=e._p;                       /* entrance progress 0..1 */
  if(p<=0)return;
  const col=COLORS[e.color], tint=TINTS[e.color];
  const lw=onMedia?3.4:2.8;
  const t=now/1000;
  let ox=0, oy=0, k=1;                /* continuous motion offsets */
  if(!reducedMotion()&&p>=1){
    if(e.motion==="pulse")k=1+0.045*Math.sin(t*2.6+e.order);
    if(e.motion==="bob")oy=-Math.sin(t*1.9+e.order)*5;
    if(e.motion==="orbit"){ox=Math.cos(t*1.7+e.order)*9;oy=Math.sin(t*1.7+e.order)*9;}
  }
  ctx.save();
  ctx.globalAlpha=e.in==="fade"?easeOut(p):Math.min(1,p*1.6);
  if(e.in==="slide")ox+=(1-easeOut(p))*36;
  const scale=e.in==="pop"?easeBack(Math.min(p,1))*k
             :e.in==="grow"?easeOut(p)*k:k;
  ctx.lineWidth=lw; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle=col;

  if(e.type==="box"||e.type==="circle"||e.type==="dot"||e.type==="text"){
    const px=sx(e.x)+ox, py=sy(e.y)+oy;
    ctx.translate(px,py); ctx.scale(scale,scale); ctx.translate(-px,-py);
    if(e.type==="box"){
      const w=e.w*sscale(), h=e.h*sscale(), r=Math.min(10,w/4,h/4);
      ctx.beginPath();
      ctx.moveTo(px-w/2+r,py-h/2);
      ctx.arcTo(px+w/2,py-h/2,px+w/2,py+h/2,r);
      ctx.arcTo(px+w/2,py+h/2,px-w/2,py+h/2,r);
      ctx.arcTo(px-w/2,py+h/2,px-w/2,py-h/2,r);
      ctx.arcTo(px-w/2,py-h/2,px+w/2,py-h/2,r);
      ctx.closePath();
      ctx.fillStyle=onMedia?"rgba(253,253,248,.80)":tint; ctx.fill(); ctx.stroke();
      labelAt(e.label,px,py,col);
    }else if(e.type==="circle"){
      const r=e.r*sscale();
      ctx.beginPath(); ctx.arc(px,py,r,0,7);
      ctx.fillStyle=onMedia?"rgba(253,253,248,.80)":tint; ctx.fill(); ctx.stroke();
      labelAt(e.label,px,py,col);
    }else if(e.type==="dot"){
      ctx.beginPath(); ctx.arc(px,py,7,0,7); ctx.fillStyle=col; ctx.fill();
      labelAt(e.label,px,py-18,col);
    }else{
      ctx.font='24px "Caveat", cursive'; ctx.textAlign="center"; ctx.textBaseline="middle";
      if(onMedia){const m=ctx.measureText(e.text||e.label);
        ctx.fillStyle="rgba(253,253,248,.85)";
        ctx.fillRect(px-m.width/2-8,py-16,m.width+16,32);}
      ctx.fillStyle=col; ctx.fillText(e.text||e.label,px,py);
    }
  }else{                                     /* arrow / line */
    const x1=sx(e.from[0])+ox, y1=sy(e.from[1])+oy;
    const fx=sx(e.to[0])+ox,  fy=sy(e.to[1])+oy;
    const g=e.in==="grow"||e.in==="pop"?easeOut(p):1;   /* extend to length */
    const x2=x1+(fx-x1)*g, y2=y1+(fy-y1)*g;
    if(e.motion==="flow"&&p>=1&&!reducedMotion()){
      ctx.setLineDash([13,9]); ctx.lineDashOffset=-(t*46)%22;
    }
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.setLineDash([]);
    if(e.type==="arrow"&&g>0.55)arrowHead(x1,y1,x2,y2,col,lw);
    if(e.label){
      const mx=(x1+x2)/2, my=(y1+y2)/2-16;
      if(onMedia){const m=ctx.measureText(e.label);
        ctx.fillStyle="rgba(253,253,248,.85)";
        ctx.fillRect(mx-m.width/2-6,my-12,m.width+12,24);}
      labelAt(e.label,mx,my,col);
    }
  }

}

/* ============ 3D vector data: skeleton + actuated curve ============
   Mirrors motion.py / lineform.py. The wire carries SERVO ANGLES, not points
   — the same thing that goes down LineFORM's serial link to the Arduino — so
   this runs the forward kinematics to recover the shape. project() must stay
   byte-identical to motion.project(), because the dense flow field was
   computed in that exact space and would otherwise land beside the body. */
const V={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  len:a=>Math.hypot(a[0],a[1],a[2]),
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  norm:a=>{const n=Math.hypot(a[0],a[1],a[2]);return n<1e-12?[0,0,1]:[a[0]/n,a[1]/n,a[2]/n];},
  lerp:(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t],
  rot:(v,ax,an)=>{const c=Math.cos(an),s=Math.sin(an);
    return V.add(V.add(V.mul(v,c),V.mul(V.cross(ax,v),s)),V.mul(ax,V.dot(ax,v)*(1-c)));}

/* world metres -> grid coords, matching motion.project() exactly */
function project(p,cam){
  const t=cam.target;
  let x=p[0]-t[0],y=p[1]-t[1],z=p[2]-t[2];
  const cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw);
  [x,z]=[x*cy+z*sy,-x*sy+z*cy];
  const cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);
  [y,z]=[y*cp-z*sp,y*sp+z*cp];
  const depth=Math.max(cam.dist-z,0.05);
  const f=1/Math.tan(cam.fov*Math.PI/180/2);
  return [x*f/depth,y*f/depth,depth];
}
const NDC2G=20, GC=25.5;                      /* ndc -> the 50x50 stroke grid */
const g2=(nd)=>[GC+nd[0]*NDC2G,GC+nd[1]*NDC2G];
/* --- the shared room (see world.py) ------------------------------------
   WX is the override the world renderer installs while it draws one actor:
   `xf` lifts that actor's local metres into room metres and `cam` is the one
   camera the room is filmed with. Every routine below already sends its
   geometry through pxOf, so a skeleton, a hand and an actuated curve need no
   changes at all to stop owning the board and start standing in a place. */

  return [sx(g[0]),sy(g[1])];};

function pxPerM(p,cam){
  const c=WX.on?WX.cam:cam, d=Math.max(project(WX.on?WX.xf(p):p,c)[2],0.05);
  return (1/Math.tan(c.fov*Math.PI/360))*NDC2G*sscale()/d;
}
/* landmark dots and bone widths are UI, not anatomy: shrink them when the

const D=r=>WX.on?r*WX.dot:r;

/* --- chain kinematics, mirroring lineform.py ------------------------- */
const DEFAULT_HEADING=[[0,0,1],[0,1,0],[1,0,0]];
function chainHeading(path){
  const fwd=V.norm(V.sub(path[1],path[0]));
  const ref=Math.abs(fwd[2])<0.9?[0,0,1]:[0,1,0];
  const right=V.norm(V.cross(fwd,ref));
  return [right,V.norm(V.cross(right,fwd)),fwd];

function fkChain(anglesDeg,dev,base,heading){
  let [right,up,fwd]=heading||DEFAULT_HEADING;

  for(let i=0;i<anglesDeg.length;i++){
    const ax=dev.axes==='single'?right:(i%2===0?right:up);
    const th=Math.max(-lim,Math.min(lim,anglesDeg[i]*Math.PI/180));
    right=V.rot(right,ax,th); up=V.rot(up,ax,th); fwd=V.rot(fwd,ax,th);
    p=V.add(p,V.mul(fwd,dev.link_m)); pts.push(p);

  const hips=mid('hip_l','hip_r'), shou=mid('shoulder_l','shoulder_r');

    spine:[hips,V.lerp(hips,shou,0.5),shou],
    neck:[shou,V.lerp(shou,pos[JI.nose],0.6),pos[JI.nose]],
    arm_l:[pos[JI.shoulder_l],pos[JI.elbow_l],pos[JI.wrist_l]],
    arm_r:[pos[JI.shoulder_r],pos[JI.elbow_r],pos[JI.wrist_r]],
    leg_l:[pos[JI.hip_l],pos[JI.knee_l],pos[JI.ankle_l]],
    leg_r:[pos[JI.hip_r],pos[JI.knee_r],pos[JI.ankle_r]]

  const bin=atob(s), out=new Int16Array(bin.length);

/* --- drawing ---------------------------------------------------------- */

function frameAt(clip,t){

     collected and merged into one panel by drawWorldClip. */
  if(WX.on){if(WX.hud)WX.hud.push({lines:lines,accent:accent});return;}
  const k=VP.on?Math.max(0.62,VP.k):1;
  const fs=Math.round(13*k), lh=Math.round(18*k), pad=10*(VP.on?VP.k:1);
  const ox=(VP.on?VP.x:0)+pad, oy=(VP.on?VP.y:0)+pad;

  ctx.strokeStyle='rgba(20,20,18,.12)';ctx.lineWidth=1;ctx.strokeRect(ox,oy,w,h);
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  lines.forEach((l,i)=>{ctx.fillStyle=i===0?(accent||'#2456D6'):'#5A5F58';

/* --- fitness figure ----------------------------------------------------

   abs, traps) built on the same servo chains, ivory flesh with the working
   groups in a red-orange gradient, fiber striations and a glow, brighter

  [/quad|squat|lunge|leg press|knee|step.?up/i, ['quads','glutes']],
  [/hamstring|rdl|deadlift|leg curl|hinge/i,    ['hams','glutes','back']],
  [/calf|calv|raise/i,                          ['calves']],
  [/core|ab|crunch|plank|oblique|situp|sit-up/i,['abs']],
  [/back|lat|row|pull|trap|spine|lumbar|posture/i,['back']],
  [/chest|pec|push|bench|press/i,               ['chest','delts','triceps']],
  [/shoulder|delt|overhead|raise/i,             ['delts']],
  [/bicep|curl/i,                               ['biceps','forearms']],
  [/tricep|extension|dip/i,                     ['triceps']],
  [/forearm|grip|wrist/i,                       ['forearms']],
  [/\bleg\b/i,                                  ['quads','hams','calves','glutes']],
  [/\barm\b/i,                                  ['biceps','triceps','delts','forearms']],
  [/neck/i,                                     ['neck']]];

  names.forEach(n=>MUSCLE_RX.forEach(([rx,regs])=>{
    if(rx.test(String(n)))regs.forEach(r=>on.add(r));}));

  if(!on.size)['quads','hams','glutes','abs','back','delts'].forEach(r=>on.add(r));

const CHAIN_JOINTS={arm_l:['shoulder_l','elbow_l','wrist_l'],

function _mfPaint(shape,sp,ns,wOf,active,heat){

  else{g.addColorStop(0,'#F4F2ED');g.addColorStop(.45,'#E6E3DA');

function _mfLobe(c,rx,ry,rot,active,heat){

  else{g.addColorStop(0,'#F4F2ED');g.addColorStop(1,'#C3BFB3');}
  ctx.fillStyle=g;
  ctx.beginPath();ctx.ellipse(c[0],c[1],rx,ry,rot||0,0,7);ctx.fill();
  if(active&&heat>0.2)ctx.restore();

function _mfDepth(p,cam){

function drawMuscleFigure(clip,fi,pos,vel,JI,cam,paths,burn,u){

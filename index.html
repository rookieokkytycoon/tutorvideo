  const ges=(clip.gestures||[]).find(g=>t>=g.start&&t<g.end);
  const sp=V.len(vel[JI.wrist_r]);
  drawHud([
    burn?`working: ${clip.muscles.slice(0,5).join(', ')}`:'',
    ges?`gesture: ${ges.name}  (${ges.hand}, conf ${ges.conf})`:'gesture: —',
    seg?`step ${seg.step}: ${seg.primitive}`:'',
    `wrist ${sp.toFixed(2)} m/s   frame ${fi+1}/${n}`,
    `${Object.keys(clip.chains).length} actuated curve chains`
  ].filter(Boolean),burn?BURN:'#C93A2E');
}
function drawHandClip(clip,t){
  /* Five finger chains, drawn from the servo angles the way the body is.
     The hand is ~18cm so the camera sits close; everything else is shared. */
  const cam=clip.camera, n=clip.frames.length;
  const {fi,u,nx}=frameAt(clip,t);
  const pts=ipPoints(clip.frames[fi],clip.frames[nx],u), vel=clip.vectors[fi];
  if(showVectors)drawFlow(clip,fi,cam);

  /* palm first, as a filled quad, so fingers read as attached to something */
  const LMI={}; clip.landmarks.forEach((nm,i)=>LMI[nm]=i);
  const palm=['wrist','index_mcp','middle_mcp','ring_mcp','pinky_mcp']
    .map(nm=>pxOf(pts[LMI[nm]],cam));
  ctx.fillStyle='rgba(36,86,214,.10)';ctx.strokeStyle='#141412';ctx.lineWidth=D(3);
  ctx.beginPath();palm.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
  ctx.closePath();ctx.fill();ctx.stroke();

  clip.bones.forEach(([a,b])=>{
    const p=pxOf(pts[a],cam),q=pxOf(pts[b],cam);
    ctx.strokeStyle='rgba(253,253,248,.92)';ctx.lineWidth=D(8);
    ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.stroke();
    ctx.strokeStyle='#141412';ctx.lineWidth=D(4);ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.stroke();
  });
  /* one dot per landmark; the three servo joints per finger in blue */
  const servo=new Set();
  clip.fingers.forEach(f=>['_mcp','_pip','_dip','_ip'].forEach(sfx=>{
    if(LMI[f+sfx]!==undefined)servo.add(LMI[f+sfx]);}));
  pts.forEach((p,i)=>{
    const q=pxOf(p,cam);
    ctx.fillStyle=servo.has(i)?'#2456D6':'#C93A2E';
    ctx.beginPath();ctx.arc(q[0],q[1],D(servo.has(i)?3.4:4.2),0,7);ctx.fill();});

  if(showVectors){
    const back=Math.max(0,fi-Math.round(clip.fps*0.8));
    clip.fingers.forEach(f=>{
      const tip=LMI[f+'_tip']; if(tip===undefined)return;
      ctx.lineWidth=2;
      for(let i=back;i<fi;i++){
        const a=pxOf(clip.frames[i][tip],cam),b=pxOf(clip.frames[i+1][tip],cam);
        ctx.strokeStyle=`rgba(31,158,122,${0.06+0.5*(i-back)/Math.max(fi-back,1)})`;
        ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}
      if(V.len(vel[tip])>0.05)vecArrow(pts[tip],vel[tip],cam,0.9,'#C93A2E');
    });
  }

  const ges=(clip.gestures||[]).find(g=>t>=g.start&&t<g.end);
  const seg=(clip.segments||[]).find(s=>t>=s.start&&t<s.end);
  const curls=clip.curls?clip.curls[fi]:null;
  const lines=[ges?`hand gesture: ${ges.name}  (conf ${ges.conf})`:'hand gesture: —'];
  if(seg)lines.push(`step ${seg.step}: ${seg.text.slice(0,44)}`);
  if(curls)lines.push('curl '+clip.fingers.map((f,i)=>
    f[0].toUpperCase()+curls[i].toFixed(2).slice(1)).join(' '));
  lines.push(`5 chains x 3 servos - ${clip.backend}`);
  drawHud(lines,'#1F9E7A');
}
function drawLineformClip(clip,t){
  const cam=clip.camera||{yaw:0.5,pitch:0.12,dist:3.0,target:[0,0.9,0],fov:40};
  const n=clip.frames.length;
  const {fi,u,nx}=frameAt(clip,t);
  const pts=ipPoints(clip.frames[fi],clip.frames[nx],u);
  const foot=pxOf([0,0,0],cam), sc=WX.on?pxPerM([0,0,0],cam)*0.1:sscale();
  if(!WX.on||!WX.bound){                /* a chain wrapped on a limb has no
                                           floor under it to cast onto */
    ctx.fillStyle='rgba(20,20,18,.06)';
    ctx.beginPath();ctx.ellipse(foot[0],foot[1],sc*4.5,sc*1.2,0,0,7);ctx.fill();
  }
  strokePath(pts,cam,'#141412',D(5),true);
  pts.forEach((p,i)=>{                            /* servo housings */
    const q=pxOf(p,cam);
    ctx.fillStyle=i===0?'#C93A2E':'#2456D6';
    ctx.beginPath();ctx.arc(q[0],q[1],D(i===0?4:2.6),0,7);ctx.fill();});
  const seg=clip.segment?clip.segment[fi]:0;
  const d=clip.device;
  drawHud([
    `shape: ${(clip.labels&&clip.labels[seg])||'curve'}`,
    `${d.name} — ${d.joints} servos, ${(d.link_m*100).toFixed(1)} cm links`,
    `fit residual ${((clip.fit_error&&clip.fit_error[seg])*100||0).toFixed(1)} cm`
      +(clip.clipped&&clip.clipped[seg]?`, ${clip.clipped[seg]} at limit`:''),
    clip.snap?'snap-to-grid: right angles only':''
  ].filter(Boolean));
}

/* --- composite scenes: several clips, one playhead ---------------------- */
const CLIP_DRAW={lineform:drawLineformClip,hand:drawHandClip,skeleton:drawSkeleton};
const PANE_LABEL={lineform:'actuated curve',hand:'hand gesture',skeleton:'body skeleton'};
function paneChrome(r,clip,i){
  /* A hairline and a caption per pane, drawn in raw pixels so it does not
     move with the pane's own camera. */
  const rx=r[0]*cv.width, ry=r[1]*cv.height, rw=r[2]*cv.width, rh=r[3]*cv.height;
  ctx.strokeStyle='rgba(20,20,18,.14)';ctx.lineWidth=1;
  ctx.strokeRect(rx+.5,ry+.5,rw-1,rh-1);
  const name=(clip.title||'')+(clip.title?' — ':'')+(PANE_LABEL[clip.kind]||clip.kind);
  ctx.font='11px "IBM Plex Mono", monospace';
  ctx.textAlign='right';ctx.textBaseline='alphabetic';
  ctx.fillStyle='rgba(253,253,248,.88)';
  const w=ctx.measureText(name).width+12;
  ctx.fillRect(rx+rw-w-6,ry+rh-22,w,17);
  ctx.fillStyle='#8A9086';ctx.fillText(name,rx+rw-12,ry+rh-10);
  ctx.textAlign='left';
}
function drawComposeClip(clip,t){
  const parts=clip.parts||[], lay=clip.layout||[];
  parts.forEach((p,i)=>{
    const r=lay[i]||[0,0,1,1];
    const fn=CLIP_DRAW[p.kind]||drawSkeleton;
    withViewport(r,()=>{try{fn(p,t);}catch(e){}});
    if(parts.length>1)paneChrome(r,p,i);
  });
}

/* --- one shared room ----------------------------------------------------
   The panes above are three separate rooms: nothing in one can be behind
   anything in another, and the generated footage can only ever be a flat
   backdrop pasted behind all of them. A world clip (world.py) places the
   same clips at real positions in ONE room, hangs the diffusion footage on
   a surface inside it, and films the lot with a single camera that the
   director moves, the student drags, and the tutor can take over mid-answer.

   That is what LineFORM's third affordance needs. Display and interaction
   fit in a pane; a constraint — "wrapping the actuated curve around limbs
   like bandages so that it acts as an exoskeleton" — is a spatial
   relationship between the chain and the arm, and a pane cannot hold one. */
const VIEW={dyaw:0,dpitch:0,dist:1,on:false};        /* the student's drag */
const QCAM={on:false,from:null,to:null,t0:0,ms:1300,label:''};  /* tutor's move */
const WORLD_HUD=[];
let WORLD_ANCHORS=[], WORLD_CAM=null, WORLD_SHOT='';
const worldOn=()=>!!(player.clip&&player.clip.kind==='world');
function resetView(){VIEW.dyaw=VIEW.dpitch=0;VIEW.dist=1;VIEW.on=false;QCAM.on=false;}

const yawRot=(p,a)=>{const c=Math.cos(a),s=Math.sin(a);
  return [p[0]*c+p[2]*s,p[1],-p[0]*s+p[2]*c];};
const smooth=p=>p*p*(3-2*p);
const clampf=(v,a,b)=>Math.max(a,Math.min(b,v));
const fiOf=(c,t)=>Math.max(0,Math.min((c.frames||[]).length-1,Math.floor(t*c.fps)));
/* how far each kind of clip was filmed from when it owned the board — used
   to keep landmark dots the right weight once the room camera moves */
const NATIVE_DIST={skeleton:3.2,hand:0.62,lineform:3.0};
const ANCHOR_NAMES={skeleton:["wrist_r","wrist_l","elbow_r","nose"],
                    hand:["index_tip","thumb_tip","wrist"],
                    lineform:["base","tip","middle"]};
const actorOf=(clip,id)=>(clip.actors||[]).find(a=>a.id===id);

/* a named point in an actor's OWN metres */
function rawPoint(a,name,fi){
  const c=a.clip, f=(c.frames||[])[fi];
  if(!f)return null;
  if(a.kind==='skeleton'){const i=(c.joints||[]).indexOf(name);return i<0?null:f[i];}
  if(a.kind==='hand'){const i=(c.landmarks||[]).indexOf(name);return i<0?null:f[i];}
  return name==='base'?f[0]:name==='tip'?f[f.length-1]:f[f.length>>1];
}
/* Where an actor stands this frame. A bound actor rides another actor's
   joint, which is how a chain stays bandaged to a forearm that is moving
   and how the detailed hand stays the body's own right hand. */
function actorAt(a,clip,t,depth){
  if(!a.bind||(depth||0)>3)return a.at;
  const host=actorOf(clip,a.bind.actor); if(!host)return a.at;
  const p=rawPoint(host,a.bind.point,fiOf(host.clip,t)); if(!p)return a.at;
  const w=actorXF(host,clip,t,(depth||0)+1)(p), o=a.bind.offset||[0,0,0];
  return [w[0]+o[0],w[1]+o[1],w[2]+o[2]];
}
/* p_world = at + yaw_rot(scale * (p_local - origin)) — world.py's transform */
function actorXF(a,clip,t,depth){
  const at=actorAt(a,clip,t,depth), o=a.origin||[0,0,0];
  const s=a.scale==null?1:a.scale, y=a.yaw||0;
  return p=>{const q=yawRot([(p[0]-o[0])*s,(p[1]-o[1])*s,(p[2]-o[2])*s],y);
    return [q[0]+at[0],q[1]+at[1],q[2]+at[2]];};
}
const worldPoint=(a,clip,t,name)=>{
  const p=rawPoint(a,name,fiOf(a.clip,t));
  return p?actorXF(a,clip,t,0)(p):null;};

/* --- the camera: a shot list, a drag, and whatever the tutor asked for --- */
function resolveTarget(tg,clip,t){
  if(Array.isArray(tg))return tg;
  if(tg&&tg.actor){
    const a=actorOf(clip,tg.actor);
    if(a)return worldPoint(a,clip,t,tg.point)||a.at;
  }
  return (clip.camera&&clip.camera.target)||[0,1,0];
}
const shotCam=(s,clip,t)=>({yaw:s.yaw,pitch:s.pitch,dist:s.dist,fov:s.fov||40,
                            target:resolveTarget(s.target,clip,t)});
function blendCam(a,b,p){
  const l=(x,y)=>x+(y-x)*p;
  return {yaw:l(a.yaw,b.yaw),pitch:l(a.pitch,b.pitch),dist:l(a.dist,b.dist),
          fov:l(a.fov||40,b.fov||40),
          target:[l(a.target[0],b.target[0]),l(a.target[1],b.target[1]),
                  l(a.target[2],b.target[2])]};
}
function camAt(clip,t){
  const shots=clip.shots||[];
  let cam=shots.length?shotCam(shots[0],clip,t)
         :{...clip.camera,target:((clip.camera||{}).target||[0,1,0]).slice()};
  let label=shots.length?shots[0].label:'';
  for(let i=1;i<shots.length;i++){
    const s=shots[i], mv=s.move||0;
    if(t<s.t-mv)break;                       /* this move has not started yet */
    const from=shotCam(shots[i-1],clip,t), to=shotCam(s,clip,t);
    if(mv>0&&t<s.t){
      cam=blendCam(from,to,smooth((t-(s.t-mv))/mv));
      label=shots[i-1].label+' → '+s.label;
    }else{cam=to;label=s.label;}
  }
  WORLD_SHOT=label;
  return cam;
}
function liveCam(clip,t){
  let cam=camAt(clip,t);
  if(QCAM.on){                          /* the tutor answered by moving */
    const p=smooth(Math.min((performance.now()-QCAM.t0)/QCAM.ms,1));
    cam=blendCam(QCAM.from,{...QCAM.to,target:resolveTarget(QCAM.to.target,clip,t)},p);
    WORLD_SHOT=QCAM.label||'tutor camera';
  }
  if(VIEW.on){                          /* the student is holding the camera */
    cam={...cam,yaw:cam.yaw+VIEW.dyaw,
         pitch:clampf(cam.pitch+VIEW.dpitch,-0.5,1.15),
         dist:clampf(cam.dist*VIEW.dist,0.28,9)};
    WORLD_SHOT=(WORLD_SHOT||'wide')+' (yours)';
  }
  return cam;
}

/* --- the room itself ----------------------------------------------------- */
function drawGround(g,cam){
  const y=g.y||0, h=g.half||2.6, st=g.step||0.4;
  ctx.lineWidth=1;
  const seg=(a,b)=>{
    const da=project(a,cam)[2], db=project(b,cam)[2];
    if(da<0.35||db<0.35)return;              /* through or behind the lens */
    const p=pxOf(a,cam), q=pxOf(b,cam);
    ctx.strokeStyle='rgba(20,20,18,'+(0.11*Math.min(1,2.4/Math.max(da,db))).toFixed(3)+')';
    ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.stroke();
  };
  for(let i=-h;i<=h+1e-6;i+=st){seg([-h,y,i],[h,y,i]);seg([i,y,-h],[i,y,h]);}
}
function screenCorners(s){
  const c=s.center, w=(s.w||3.4)/2, h=(s.h||1.9)/2, r=yawRot([1,0,0],s.yaw||0);
  const at=(k,j)=>[c[0]+r[0]*w*k,c[1]+h*j,c[2]+r[2]*w*k];
  return [at(-1,1),at(1,1),at(1,-1),at(-1,-1)];        /* TL TR BR BL */
}
/* affine map of a source triangle onto a destination triangle: two of these
   put a moving image on a quad that is standing in the room, so the footage
   skews with the wall instead of being pasted over the whole board */
function texTri(img,u0,v0,u1,v1,u2,v2,x0,y0,x1,y1,x2,y2){
  const den=u0*(v2-v1)-u1*(v2-v0)+u2*(v1-v0);
  if(!den)return;
  ctx.save();
  ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.lineTo(x2,y2);
  ctx.closePath();ctx.clip();
  ctx.transform(
    -(v0*(x2-x1)-v1*(x2-x0)+v2*(x1-x0))/den,
     (v0*(y2-y1)-v1*(y2-y0)+v2*(y1-y0))/den,
     (u0*(x2-x1)-u1*(x2-x0)+u2*(x1-x0))/den,
    -(u0*(y2-y1)-u1*(y2-y0)+u2*(y1-y0))/den,
     (u0*(v2*x1-v1*x2)+v0*(u1*x2-u2*x1)+(u2*v1-u1*v2)*x0)/den,
     (u0*(v2*y1-v1*y2)+v0*(u1*y2-u2*y1)+(u2*v1-u1*v2)*y0)/den);
  ctx.drawImage(img,0,0);
  ctx.restore();
}
function drawScreen(s,cam,t){
  const C=screenCorners(s);
  if(C.some(p=>project(p,cam)[2]<0.3))return;    /* the camera walked past it */
  const P=C.map(p=>pxOf(p,cam));
  /* a step's own clip wins over the chapter's single clip */
  const reel=reelAt(t);
  const pv=player.videoEl;
  const vid=(reel&&reel.el)||((pv&&pv.readyState>=2)?pv:null);
  const im=player.imgEl;
  const src=vid||((im&&im.complete&&im.naturalWidth)?im:null);
  const sw=src?(vid?(vid.videoWidth||16):src.naturalWidth):16;
  const sh=src?(vid?(vid.videoHeight||9):src.naturalHeight):9;
  const path=()=>{ctx.beginPath();
    P.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();};
  path(); ctx.fillStyle=src?'#141412':'rgba(20,20,18,.045)'; ctx.fill();
  if(src){
    texTri(src,0,0,sw,0,sw,sh,P[0][0],P[0][1],P[1][0],P[1][1],P[2][0],P[2][1]);
    texTri(src,0,0,sw,sh,0,sh,P[0][0],P[0][1],P[2][0],P[2][1],P[3][0],P[3][1]);
  }
  path(); ctx.strokeStyle='rgba(20,20,18,.32)'; ctx.lineWidth=2; ctx.stroke();
  const mid=[(P[3][0]+P[2][0])/2,(P[3][1]+P[2][1])/2];
  ctx.font='11px "IBM Plex Mono", monospace';
  ctx.textAlign='center';ctx.textBaseline='top';
  ctx.fillStyle=src?'#8A9086':'rgba(138,144,134,.75)';
  const cap=reel&&reel.cue
    ?(reel.el?'footage: '+reel.cue.text.slice(0,54)
             :'no clip for "'+reel.cue.text.slice(0,40)+'"')
    :(src?(s.label||'generated footage'):'screen — no clip generated');
  ctx.fillText(cap,mid[0],mid[1]+6);
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
}
function drawActor(a,clip,t,cam){
  const fn=CLIP_DRAW[a.kind]; if(!fn)return;
  const at=actorAt(a,clip,t,0);
  const native=NATIVE_DIST[a.kind]||3.0;
  WX.on=true; WX.cam=cam; WX.xf=actorXF(a,clip,t,0);
  WX.hideHands=!!a.hide_hands; WX.bound=!!a.bind; WX.hud=WORLD_HUD;
  WX.dot=clampf(native/Math.max(project(at,cam)[2],0.05)*(a.scale||1),0.35,1.6);
  try{fn(a.clip,Math.min(t,a.clip.seconds-1e-3));}
  finally{WX.on=false;WX.hud=null;WX.hideHands=false;WX.bound=false;WX.dot=1;}
}
/* the points the tutor may annotate, aim the camera at, or bind to */
function worldAnchors(clip,t,cam){
  const out=[];
  (clip.actors||[]).forEach(a=>{
    const names=(clip.anchors&&clip.anchors[a.id])||ANCHOR_NAMES[a.kind]||[];
    names.forEach(nm=>{
      const p=worldPoint(a,clip,t,nm); if(!p)return;
      const pr=project(p,cam);
      out.push({name:(a.title||a.id)+' '+nm.replace(/_/g,' '),
                p:p,g:g2(pr),depth:pr[2],actor:a.id,point:nm});
    });
  });
  const s=(clip.stage||{}).screen;
  if(s){const pr=project(s.center,cam);
    out.push({name:'the screen',p:s.center,g:g2(pr),depth:pr[2],
              actor:'screen',point:'center'});}
  return out;
}
function actorTag(a,clip,t,cam){
  const at=actorAt(a,clip,t,0);
  const top=[at[0],at[1]+(a.kind==='skeleton'?1.85:a.kind==='lineform'?1.7:0.16),at[2]];
  const pr=project(top,cam); if(pr[2]<0.35)return;
  const q=pxOf(top,cam);
  const name=(a.title||'')+(a.title?' — ':'')+(PANE_LABEL[a.kind]||a.kind)
            +(a.bind?' (bound)':'');
  ctx.font='11px "IBM Plex Mono", monospace';
  const w=ctx.measureText(name).width+10;
  if(q[1]<12||q[0]<0||q[0]>cv.width)return;
  ctx.strokeStyle='rgba(20,20,18,.18)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(q[0],q[1]+2);ctx.lineTo(q[0],q[1]-6);ctx.stroke();
  ctx.fillStyle='rgba(253,253,248,.88)';ctx.fillRect(q[0]-w/2,q[1]-22,w,15);
  ctx.fillStyle='#8A9086';ctx.textAlign='center';
  ctx.fillText(name,q[0],q[1]-11);ctx.textAlign='left';
}
function drawWorldClip(clip,t){
  const cam=liveCam(clip,t); WORLD_CAM=cam; WORLD_HUD.length=0;
  const st=clip.stage||{};
  if(st.ground)drawGround(st.ground,cam);

  /* Back to front, so the body can stand in front of the footage and the
     chain can pass behind the arm it is wrapped around. */
  const items=[];
  if(st.screen)items.push({d:project(st.screen.center,cam)[2],
                           draw:()=>drawScreen(st.screen,cam,t)});
  (clip.actors||[]).forEach(a=>items.push(
    {d:project(actorAt(a,clip,t,0),cam)[2],draw:()=>drawActor(a,clip,t,cam)}));
  items.sort((x,y)=>y.d-x.d).forEach(i=>{try{i.draw();}catch(e){}});

  (clip.actors||[]).forEach(a=>{try{actorTag(a,clip,t,cam);}catch(e){}});
  WORLD_ANCHORS=worldAnchors(clip,t,cam);

  const lines=[`shot: ${WORLD_SHOT||'wide'}`];
  WORLD_HUD.forEach(h=>{if(h.lines[0])lines.push(h.lines[0]);});
  lines.push(`camera yaw ${cam.yaw.toFixed(2)} pitch ${cam.pitch.toFixed(2)} `
            +`dist ${cam.dist.toFixed(2)}m`);
  lines.push(`${(clip.actors||[]).length} rigs in one room — drag to orbit, `
            +`wheel to zoom, double-click to reset`);
  drawHud(lines,'#7A5AD6');
}

/* --- annotations that survive the camera ---------------------------------
   A stroke is a 2D polyline on the 50x50 grid, which is fine while the
   camera is nailed down. In a room it would slide off whatever it was
   circling the moment the shot changed. So each stroke is bound once to the
   nearest anchor point IN THE ROOM, and thereafter it is drawn relative to
   where that point currently projects, scaled by how much closer the camera
   has come. Circle the wrist, orbit 90 degrees, the circle is still on the
   wrist. */
function bindAnnos(){
  player.annosBound=true;
  const pool=player.annoAnchors&&player.annoAnchors.length
    ?player.annoAnchors:WORLD_ANCHORS;
  player.annoAnchors=null;
  if(!worldOn())return;
  for(const it of player.annos){
    if(!it.pl.length)continue;
    let cx=0,cy=0;
    it.pl.forEach(p=>{cx+=p[0];cy+=p[1];});
    cx/=it.pl.length; cy/=it.pl.length;
    let best=null,bd=1e9;
    for(const a of pool){
      const d=Math.hypot(a.g[0]-cx,a.g[1]-cy);
      if(d<bd){bd=d;best=a;}
    }
    if(best&&bd<28){
      it.aP=best.p; it.aG=best.g.slice(); it.aD=best.depth; it.aName=best.name;

function drawCaptionMPT(){

     stroke_width, centred, sat at subtitle_position. Everything is scaled off
     canvas height so the board matches the proportions rather than the pixels
     of a 1920x1080 render. */

  const size=Math.max(15,Math.round((S.size||60)*k));
  ctx.font=`${size}px "${mptFontFamily}", system-ui, sans-serif`;
  ctx.textAlign="center"; ctx.textBaseline="alphabetic";

  if(!lines.length)return;

  const pos=String(S.position||"bottom");
  /* its four positions, custom being a percentage down the frame */
  let top=pos==="top"?cv.height*0.06
         :pos==="center"?(cv.height-block)/2
         :pos==="custom"?cv.height*((S.custom_position||70)/100)-block/2
         :cv.height-block-Math.round(cv.height*0.06);

    const w=Math.min(cv.width*0.92,

    const r=Math.round((S.background_radius||16)*k);

    const a=Math.max(0,Math.min(255,S.background_alpha==null?140:S.background_alpha))/255;
    ctx.fillStyle=`rgba(${parseInt(bg.slice(1,3),16)},${parseInt(bg.slice(3,5),16)},`

  ctx.lineWidth=Math.max(1,(S.stroke_width==null?1.5:S.stroke_width)*2*(size/60));

  ctx.fillStyle=captionQA?"#FF5A4A":(S.fore||"#FFFFFF");

}
function drawActionLabel(){

function stepOf(elapsed){return Math.min(player.nSteps-1,Math.floor(elapsed/player.stepMs));}

/* ============ MoneyPrinterTurbo transitions ============

   effects instead of a hard cut. The board cuts between chapters, so the same
   six are available here and mean the same thing.

   Applied to the PICTURE only. Its renderer overlays subtitles after the
   transition has been composited, so the words do not slide or fade with the
   footage — and neither do they here, which is also why a caption stays
   readable across a cut. */

let MPTTRANS={mode:"FadeIn",t0:-1e9};
function mptTransStart(){
  if(!mptLook())return;
  let m=MPTSUB&&MPTSUB.transition||"FadeIn";
  if(m==="Shuffle")m=MPT_TRANS_IN[Math.floor(Math.random()*MPT_TRANS_IN.length)];
  MPTTRANS={mode:m,t0:performance.now()};

function mptTransBegin(now){
  /* -> true when a transform was pushed and the caller must restore() */
  if(!mptLook()||MPTTRANS.mode==="None")return false;
  const p=(now-MPTTRANS.t0)/MPT_TRANS_MS;
  if(p<0||p>=1)return false;
  const e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;          /* easeInOutQuad */

    /* slidein_transition translates the incoming clip in from one edge */
    const dx=(m==="SlideIn"?-1:1)*cv.width*(1-e)*0.35;
    ctx.translate(dx,0);
  }else if(m==="ZoomIn"||m==="ZoomOut"){
    /* zoomin starts large and settles; zoomout starts small and grows */
    const s=m==="ZoomIn"?1+0.14*(1-e):1-0.12*(1-e);
    ctx.translate(cv.width/2,cv.height/2);
    ctx.scale(s,s);
    ctx.translate(-cv.width/2,-cv.height/2);

function updateChrome(){

    const fill=seg.firstChild;
    if(i<player.sceneIdx)fill.style.width="100%",done+=scenes[i].seconds||8;
    else if(i===player.sceneIdx){

/* --- the student's hands on the camera -----------------------------------
   Only while a room is on screen: everywhere else the board is a flat
   drawing and a drag should do nothing. The drag is an OFFSET on top of the
   director's shot, not a replacement, so the lesson keeps cutting and the
   student keeps their angle. */
(()=>{
  let drag=null;
  cv.addEventListener('pointerdown',e=>{
    if(!worldOn())return;
    drag={x:e.clientX,y:e.clientY}; QCAM.on=false;   /* taking it back */
    try{cv.setPointerCapture(e.pointerId);}catch(_){}
    cv.style.cursor='grabbing';
  });

    VIEW.on=true; drag={x:e.clientX,y:e.clientY};

  cv.addEventListener('pointerup',up);
  cv.addEventListener('pointercancel',up);

    if(!worldOn())return;

/* --- footage cut to the steps -------------------------------------------

   step 3 while the screen behind it plays a clip of the whole job. A reel is
   a list of cues keyed to the SAME segment boundaries the rig is animating
   from, so the footage on the screen is footage of the step being performed
   in front of it. Each cue owns a <video> element, preloaded; only the
   active one is playing. */

  REEL.els.forEach(v=>{v.pause();v.src="";});
  REEL.els.clear(); REEL.cues=cues&&cues.length?cues:[]; REEL.idx=-1;
  REEL.cur=null; REEL.force=null;

    const v=document.createElement('video');
    v.crossOrigin="anonymous";v.muted=true;v.loop=true;v.playsInline=true;

function reelAt(t){

  if(REEL.force!=null){
    /* An action chapter cuts on the NARRATION, not on a timer: the clip
       changes at the instant the voice starts describing that action, so the
       film always shows what is being said. A proportional time slice was a
       good estimate, but an estimate is exactly what drifts — one long action
       and the picture is a sentence behind for the rest of the chapter.
       An action whose search found nothing holds the previous clip rather
       than going dark, and never borrows a LATER action's film. */
    i=REEL.cues.findIndex(c=>c.ai===REEL.force);
    if(i<0)for(let k=0;k<REEL.cues.length;k++)
      if(REEL.cues[k].ai<REEL.force)i=k;
    if(i<0)i=0;
  }
  if(i<0)for(let k=0;k<REEL.cues.length;k++){
    const c=REEL.cues[k];
    if(t>=c.start&&t<c.end){i=k;break;}
    if(t>=c.start)i=k;            /* past the last cue: hold it, do not go dark */

  const cue=REEL.cues[i], v=REEL.els.get(cue.url);

    REEL.idx=i;

    if(v){try{v.currentTime=0;}catch(_){ } v.play().catch(()=>{});}

/* ============ lipsync ============

   expanded into a viseme sequence from its letters and stepped through over the
   word's estimated duration; the CSS transition on .mouth tweens between them. */
const VIS={
  rest:[.10,.90], A:[1.00,.95], E:[.55,1.18], I:[.42,1.10], O:[.95,.62],
  U:[.62,.50], M:[.05,.86], F:[.26,.98], L:[.50,.86], S:[.24,1.06],
  R:[.44,.78], T:[.30,1.00], K:[.40,.92]

let mouthNow=VIS.rest;

  mouthNow=VIS[v]||VIS.rest;

}
function visemeOf(c){
  if("aeiouy".includes(c)){
    if(c==="a")return"A"; if(c==="e")return"E";
    if(c==="i"||c==="y")return"I"; if(c==="o")return"O"; return"U";
  }
  if("mbp".includes(c))return"M";
  if("fv".includes(c))return"F";
  if(c==="l")return"L";
  if("szxc".includes(c))return"S";
  if(c==="r")return"R";
  if("tdnh".includes(c))return"T";
  if("kgqjw".includes(c))return"K";

}
function visemesFor(word){

/* ============ neural narration (MoneyPrinterTurbo /api/tts) ============
   speechSynthesis is free but robotic, and for a language the machine has no
   voice installed for it is silently WRONG — an Indonesian lesson read in an
   American accent, with nothing on screen to say so. The server has edge-tts,
   which has the voice, needs no API key and costs nothing per chapter, so it
   is preferred and the browser becomes the fallback rather than the default.

   The real duration comes back in a header, so lipsync runs off the audio's
   actual length instead of a word-count guess; the mouth stops when the voice
   does. Everything else about a chapter is unchanged — this is one function
   swapped underneath, which is why pause, interrupt and resume keep working. */

function ttsStop(){
  /* Resolving the pending promise is not optional. speechSynthesis.cancel()
     fires onend, so the browser path always settled and `await speech` in the
     Q&A handler always returned. An <audio> that is merely paused fires
     nothing, so without this a pause mid-answer would leave that await hanging
     for good — answering stuck true and the Ask button dead for the session.
     A cancelled narration is FINISHED, not failed: resolve true so the caller
     does not fall back and start talking over itself. */
  const fin=ttsDone; ttsDone=null;
  if(ttsAudio){
    try{ttsAudio.pause();}catch(e){}
    if(ttsAudio.src&&ttsAudio.src.startsWith("blob:"))URL.revokeObjectURL(ttsAudio.src);
    ttsAudio=null;
  }

}
function speakNeural(text){
  /* -> Promise<bool>. false means "could not", and the caller falls back to
     speechSynthesis, because a chapter that goes silent is worse than one
     read in the wrong accent.

     /api/tts answers with a URL and WORD CUES rather than bare audio. The
     cues are the whole point: the avatar's mouth is driven by word
     boundaries, which speechSynthesis emits and a plain <audio> does not, so
     without them the mouth would flap on an average while a real voice said
     something else. With them the lipsync is tighter than the browser's. */
  return (async()=>{
    const r=await fetch("/api/tts",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({text,lang:lessonLang})});
    if(!r.ok)return false;
    const d=await r.json().catch(()=>null);
    /* a server without the pipeline answers {"disabled":true,"why":...} */
    if(!d||d.disabled||!d.audio)return false;
    return await new Promise(done=>{
      ttsStop();
      const a=new Audio(d.audio); ttsAudio=a;
      let timers=[];
      const end=ok=>{timers.forEach(clearTimeout); timers=[];
                     if(ttsAudio===a)ttsStop(); done(ok);};
      a.onended=()=>end(true);
      a.onerror=()=>end(false);

        speaking=true;
        const cues=Array.isArray(d.cues)?d.cues:[];
        if(cues.length){
          /* each word's own start and length, straight off the synthesiser.
             The guard matters: pausing calls ttsStop(), and a timer that
             fires afterwards must not move a mouth that is meant to be shut. */
          cues.forEach(c=>timers.push(setTimeout(()=>{
            if(ttsAudio===a)lipSay(String(c.w||""),Math.max(90,(c.d||0.2)*1000));
          },Math.max(0,(c.t||0)*1000))));
        }else{
          /* a voice that reports no boundaries still has a real length */
          lipRun(text,(d.seconds>0?d.seconds
                       :Math.max(1,text.split(/\s+/).length*0.36))*1000);

/* ============ the edit: film cut to the explanation ============

   paragraph, and each action's clip is cut in at the instant its sentence
   starts. That is the whole edit: the picture is never showing step 2 while
   the voice is still on step 1, because the same loop drives both.

   longer without anyone having to estimate how long it takes to say. */

function speak(text,qa){

function clipContextFor(c,t,v,bare){

     landmarks are then reported in board coordinates, so a stroke aimed at
     the hand pane lands on the hand pane. */

  if(c.kind==='compose'){
    const out=[];
    (c.parts||[]).forEach((p,i)=>{
      const pv=vpFor((c.layout&&c.layout[i])||[0,0,1,1]);
      const lbl=PANE_LABEL[p.kind]||p.kind;
      clipContextFor(p,t,pv).forEach(s=>out.push(`[${lbl} pane] ${s}`));
    });
    out.push(`the board is split into ${(c.parts||[]).length} panes: `
            +(c.parts||[]).map(p=>PANE_LABEL[p.kind]||p.kind).join(', ')
            +' — all playing on one timeline');
    return out;
  }
  if(c.kind==='world')return worldContext(c,t);
  const fi=Math.max(0,Math.min(c.frames.length-1,Math.floor(t*c.fps)));
  const G=p=>{const g=g2(project(p,c.camera));return v?paneToBoard(v,g):g;};
  const parts=[];

     reports its own, from where things actually are. */

    const pts=c.frames[fi], ends=[[pts[0],'chain base'],[pts[pts.length-1],'chain tip'],

    if(!bare)ends.forEach(([p,nm])=>{const g=G(p);
      parts.push(`${nm} (around x${Math.round(g[0])}y${Math.round(g[1])})`);});
    const seg=c.segment?c.segment[fi]:0;
    parts.push(`the chain is holding the "${(c.labels&&c.labels[seg])||'curve'}" shape`);

  }

                +`(around x${Math.round(g[0])}y${Math.round(g[1])})`);});
    const hg=(c.gestures||[]).find(g=>t>=g.start&&t<g.end);

                    +`(confidence ${hg.conf})`);

    parts.push(`${nm.replace('_r',' (right)').replace('_l',' (left)')} `
              +`(around x${Math.round(g[0])}y${Math.round(g[1])})`);
  });

  if(ges)parts.push(`the tracked gesture right now is "${ges.name}" with the `
                   +`${ges.hand} hand, confidence ${ges.conf}`);

    target=spec.target.slice(0,3).map(Number);

    }
    /* Real film as part of the ANSWER. Swapped in BEFORE the strokes play,
       and awaited on purpose: a stock search is a second or two, and a circle
       drawn around a part on the diagram it is about to replace would point at
       nothing. Order is the whole feature — footage, then marker strokes on
       top of it, while the neural voice explains. */
    const fm=raw.match(/<footage>([\s\S]*?)<\/footage>/);
    const fterm=fm?fm[1].trim().slice(0,120):"";
    if(fterm&&!nm&&!COACH.on){
      if(!footageEnabled){
        chatMsg('sys','real footage was offered but the stock library is off'
                     +(footageWhy?' ('+footageWhy+')':''));
      }else{
        try{
          $('status').textContent="Finding real footage — seconds";
          $('status').className='status busy';
          const fr=await fetch("/api/stock",{method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({terms:[fterm],seconds:5})});
          const fd=await fr.json();
          const furl=(fr.ok&&Array.isArray(fd.videos))?fd.videos[0]:null;
          if(furl){
            setSceneMedia(furl,null);
            /* keep it on the chapter so resuming does not throw it away */
            const cur=scenes[currentScene]; if(cur)cur.videoUrl=furl;
            chatMsg('sys','&#9635; real footage — &ldquo;'+fterm+'&rdquo;');
          }else chatMsg('sys','no footage for &ldquo;'+fterm+'&rdquo;'
                             +(fd.why?' ('+fd.why+')':''));
        }catch(e){}
        $('status').textContent=""; $('status').className='status';
      }
    }
    /* Nothing in an answer is allowed to hold the Ask button hostage.
       These promises resolve on their own in every path we know; the races
       are for the path we don't — a stalled one costs a bounded wait, not
       the rest of the session. */
    const bounded=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(r,ms))]);
    const speech=speak(answer,true);
    await bounded(playAnnotations(annos,anchorSnap),20000);
    for(const a of annos)if(a.label)chatMsg('sys','&#10148; annotated: '+a.label);
    await bounded(speech,90000);
    /* THE CONTRACT: every interrupt is answered with a FULL-STEPS animated
       chapter — short answers included, malformed offers rebuilt, topics
       unrelated to the lesson taught from scratch. "shown" tracks whether
       a playable chapter carried the answer; if nothing did, one is BUILT. */
    let shown=false;
    if(nm&&COACH.on){
      chatMsg('sys','(a new chapter was offered — finish coaching to play it, '
                   +'the camera session would be thrown away)');
      shown=true;              /* by design: the camera session is the board */
    }else if(nm){
      try{
        const p=parseModelJSON(nm[1].trim(),"new scene");
        const ns=Array.isArray(p)?p[0]:p;
        /* Valid JSON is not a valid chapter. Without this, a reply that
           parses to a string or a number sails through: assigning to a
           primitive's properties is a silent no-op in sloppy mode, so
           prepScene "succeeds", a modeless scene lands in the timeline, and
           it plays as a blank board for its full duration. */
        if(!ns||typeof ns!=="object"||Array.isArray(ns))
          throw new Error("new scene was not an object");
        ns.qa=true; ns.fresh=true; prepScene(ns);
        const at=Math.min(currentScene+1,scenes.length);
        scenes.splice(at,0,ns);
        renderSceneList(); renderTimeline();
        chatMsg('sys','&#43; new chapter added: '+(ns.title||ns.sketch_prompt));
        if(!lessonRunning){answering=false;$('ask').disabled=false;resumeLesson();runLesson(at);return;}
        else pendingSeek=at;
        shown=true;
      }catch(e){chatMsg('sys','(the offered chapter was malformed — '
                       +'building the full-steps animation instead)');}
    }
    if(!shown&&!COACH.on){
      /* the answer is OWED its animation. First choice: a second model
         call expands the spoken answer into a complete chapter — format
         recognized (actions/hand/skeleton/compose/world/anim), FULL steps,
         granularity set by the liquid network's detail-need trait. If even
         that fails, the rescue path still PERFORMS the prose: a picture
         always plays, never just a voice. */
      $('status').textContent="Building the full-steps animation";
      $('status').className='status busy';
      const built=await qaFullSteps(q,answer);
      $('status').textContent="";$('status').className='status';
      const ns=built||{mode:'anim',narration:answer};
      ns.qa=true; ns.fresh=true;
      if(!ns.narration)ns.narration=answer;
      if(!ns.title)ns.title=q.length>46?q.slice(0,45)+'…':q;
      prepScene(ns);
      const at=Math.min(currentScene+1,scenes.length);
      scenes.splice(at,0,ns);
      renderSceneList(); renderTimeline();
      chatMsg('sys',built
        ?'&#43; the answer plays as a full-steps '+(ns.mode||'anim')
          +' chapter'
        :'&#43; the answer will be performed on the board');
      if(!lessonRunning){answering=false;$('ask').disabled=false;
        resumeLesson();runLesson(at);return;}
      else pendingSeek=at;
    }
    await new Promise(r=>setTimeout(r,450));
  }catch(e){
    $('status').textContent=e.message;$('status').className='status err';
  }
  answering=false; $('ask').disabled=false;
  resumeLesson();
  /* cancel only a scene that is actually PLAYING so the lesson jumps to
     the answer's new chapter. Asked between scenes (mid-verify, mid-quiz,
     paused) there is nothing to cancel — and a lingering flag used to
     kill the new animation itself on its very first frame. */
  if(pendingSeek!=null&&lessonRunning&&player.active)
    player.cancelRequested=true;
}
$('ask').onclick=handleQuestion;
$('q').addEventListener('keydown',e=>{if(e.key==='Enter')handleQuestion();});
$('pauseBtn').onclick=()=>{player.paused?resumeLesson():pauseLesson();};

if(SR){

  rec.onend=()=>{listening=false;$('mic').setAttribute('aria-pressed','false');};

  };

/* ============ chapters / timeline / seeking ============ */
const KIND={photo:"still",hybrid:"film",skeleton:"motion",hand:"hands",
            lineform:"curve",compose:"multi",world:"3D room"};
const sceneName=s=>s.title||s.sketch_prompt||"chapter";
function renderSceneList(){
  $('scenes').innerHTML=scenes.map((s,i)=>
    `<div class="scene ${i===currentScene?'active':''} ${i<currentScene?'done':''} ${s.qa?'qa':''} ${s.fresh?'fresh':''}"
          role="button" tabindex="0" data-i="${i}">
       <span class="n">${i+1}</span><span>${sceneName(s)}</span>
       ${KIND[s.mode]?`<span class="kind">${KIND[s.mode]}</span>`:""}</div>`).join("");
  scenes.forEach(s=>{delete s.fresh;});
  [...$('scenes').children].forEach(el=>{
    el.onclick=()=>seekTo(+el.dataset.i);
    el.onkeydown=e=>{if(e.key==='Enter')seekTo(+el.dataset.i);};
  });
}
function renderTimeline(){
  const total=scenes.reduce((s,x)=>s+(x.seconds||8),0)||1;
  $('timeline').innerHTML=scenes.map((s,i)=>
    `<div class="seg ${s.qa?'qa':(s.mode||'')}" style="flex:${(s.seconds||8)/total}" title="${sceneName(s)}" data-i="${i}"><div class="fill"></div></div>`).join("");
  [...$('timeline').children].forEach(el=>el.onclick=()=>seekTo(+el.dataset.i));
}
function seekTo(i){
  if(answering||!scenes.length)return;
  pendingSeek=i;
  /* cancel only a scene that is actually playing — set between scenes
     (during a camera verify, say) the stale flag would skip the first
     frame of whatever chapter plays next */
  if(lessonRunning){resumeLesson();
    if(player.active)player.cancelRequested=true;}
  else runLesson(i);
}

/* ============ lesson pipeline ============ */
async function waitWhilePaused(){
  while((player.paused||answering)&&pendingSeek==null)await new Promise(r=>setTimeout(r,200));
}
/* There is no such thing as "animation unavailable".
   The rigs (hand, skeleton, actuated curve) are pure maths on the server —
   no API key, no diffusion token, no GPU — so a chapter that has lost its
   authored animation can always still be PERFORMED. The old placeholder box
   was a lie told whenever the director omitted steps or a clip errored.

   The ladder, best first:
     1. ask the hivemind what procedure this chapter is about and animate the
        steps the graph actually knows (grounded, and physics-checked)
     2. hand the narration straight to the rigs — text_to_hand/text_to_motion
        parse free text, so any sentence yields real motion
   Only a rig failure after both can leave the board still, and that has no
   code path left. */
async function rescueScene(sc){
  const q=((sceneName(sc)||"")+" "+(sc.narration||"")).trim();
  sc.rescued=true;
  try{
    const r=await fetch("/api/graph",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({question:q})});
    const d=await r.json();
    const node=d.nodes&&d.nodes[0];
    const steps=(node&&node.steps||[]).map(s=>s.text).filter(Boolean).slice(0,5);
    /* A weak lexical match is worse than no match: performing a robotic-
       gripper procedure over a photosynthesis chapter is confidently wrong.
       Measured separation on this corpus is ~26-37 for a real hit against
       ~1.7 for noise, so the gate sits well clear of both. */
    if(steps.length>=2&&node.score>=8){
      sc.mode="compose"; sc.seconds=sc.seconds||Math.max(10,Math.min(20,steps.length*3));
      sc.parts=[{kind:"skeleton",title:"posture",steps:steps.slice(0,3)},
                {kind:"hand",title:"grip",steps:steps.slice(-3)}];
      chatMsg('sys','&#9683; no animation authored — performing "'+node.title
             +'" from the hivemind instead ('+steps.length+' steps)');
      return;
    }
  }catch(e){}
  /* nothing in the graph: the rigs still parse the narration itself */
  sc.mode="hand"; sc.hand_steps=[]; sc.motion_prompt=q||sceneName(sc)||"explain";
  sc.seconds=sc.seconds||10;
  chatMsg('sys','&#9995; no animation authored — performing the narration '
         +'as hand motion');
}
const SCENE_MODES=["anim","hand","skeleton","lineform","compose","world",
                   "photo","hybrid"];
function prepScene(sc){
  /* normalise whatever the director produced into renderable elements.
     An unrecognised mode used to fall through every branch of coerceMode
     and play as an empty board, so anything not on this list becomes an
     animation — which is the one mode that always works. */
  if(typeof sc.mode!=="string"||SCENE_MODES.indexOf(sc.mode)<0)sc.mode="anim";
  /* an ANSWER that arrives as a 3D room is the full instruction video:
     unless the model said otherwise, the room's screen carries real
     footage of every step, cut to the actor performing it — the
     explanation, the interaction and the film integrated in one space */
  if(sc.qa&&sc.mode==="world"&&sc.step_videos===undefined
     &&(Array.isArray(sc.actors)?sc.actors:[])
       .some(a=>a&&Array.isArray(a.steps)&&a.steps.length))
    sc.step_videos=true;
  /* narration is spoken AND captioned, so it has to exist; a chapter the
     model wrote without one still has a title to fall back on */
  sc.narration=(typeof sc.narration==="string"&&sc.narration.trim())
    ?sc.narration.trim()
    :(sc.title?`Here is ${sc.title}.`:"");
  /* an "anim" chapter with no elements can still be performed by the rigs —
     flag it and let ensureMedia rescue it rather than drawing a placeholder */
  if(sc.mode==="anim"&&(!Array.isArray(sc.steps)||!sc.steps.length)){
    sc.steps=[]; if(!sc.rescued)sc.needsRescue=true;
  }
  sc.els=sc.mode==="anim"?normEls(sc.steps):[];
  if((sc.mode==="skeleton"||sc.mode==="hand")&&!sc.seconds)
    sc.seconds=Math.max(8,Math.min(20,((sc.motion_steps||sc.hand_steps||[]).length)*3||10));
  if((sc.mode==="compose"||sc.mode==="world")&&!sc.seconds){
    const parts=sc.mode==="world"?worldActors(sc):composeParts(sc);
    const longest=Math.max(...parts.map(p=>(p.steps||p.shapes||[]).length),0);
    /* a room needs longer than a pane: the camera has to travel between the
       things it is cutting to, and a cut every two seconds is unreadable */
    sc.seconds=sc.mode==="world"?Math.max(12,Math.min(30,longest*4||14))
                                :Math.max(10,Math.min(24,longest*3||12));
  }
  if(!sc.seconds)sc.seconds=Math.max(6,Math.min(20,
    (Array.isArray(sc.actions)&&sc.actions.length?sc.actions.length*5
     :(sc.steps||[]).length*4)||8));
  return sc;
}
function ensureVideo(sc,quiet){
  /* "world" wants a clip too — not as a backdrop but as the thing playing on
     the screen standing in the room. No token, and the screen is simply not
     part of the room. */
  if(!videoEnabled||(sc.mode!=="hybrid"&&sc.mode!=="world")
     ||!sc.video_prompt||sc.videoUrl!==undefined
     ||(sc.mode==="world"&&sc.step_videos))   /* step clips replace the single one */
    return sc._videoJob||Promise.resolve();
  if(sc._videoJob)return sc._videoJob;
  sc._videoJob=(async()=>{
    try{
      if(!quiet){$('status').textContent="Generating diffusion clip — 30–90s";$('status').className='status busy';}
      const r=await fetch("/api/video",{method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({prompt:sc.video_prompt})});
      const d=await r.json();
      sc.videoUrl=(r.ok&&d.video)?d.video:null;
      if(sc.videoUrl)chatMsg('sys','&#9635; diffusion clip ready'+(quiet?' (prefetched)':''));
      else chatMsg('sys','diffusion clip unavailable'+(d.error?' ('+d.error.message+')':''));
    }catch(e){sc.videoUrl=null;}
    if(!quiet){$('status').textContent="";$('status').className='status';}
  })();
  return sc._videoJob;
}
/* --- one clip per step ---------------------------------------------------
   The cues come out of the SOLVED clip, not out of the director's text, so
   they land on the exact segment boundaries the rig is animating from: the
   screen cuts to footage of step 3 on the frame the fingers start step 3. */
function stepVideoPrompt(text,kind,topic){
  const shot=kind==='hand'?"Tight macro shot of a pair of real hands"
                          :"Medium shot of one person, waist up";
  return `${shot}: ${text}. ${topic?`Context: ${topic}. `:""}`
        +`Photoreal, natural workshop light, shallow depth of field, one `
        +`continuous take, camera almost still, no text or captions in frame.`;
}
function stepCues(sc){
  const clip=sc.clip;
  if(!clip||clip.kind!=='world')return [];
  const lead=(clip.actors||[]).find(a=>a.kind==='hand')
           ||(clip.actors||[]).find(a=>a.kind==='skeleton');
  const segs=(lead&&lead.clip.segments)||[];
  if(!segs.length)return [];
  const given=Array.isArray(sc.step_videos)?sc.step_videos:null;
  const cues=segs.slice(0,4).map((s,i)=>({
    start:s.start, end:s.end, text:s.text||`step ${i+1}`,
    prompt:(given&&given[i])||stepVideoPrompt(s.text||sceneName(sc),
                                              lead.kind,topicNow)}));
  /* hold the last clip to the end of the chapter rather than going dark */
  cues[cues.length-1].end=Math.max(cues[cues.length-1].end,clip.seconds);
  return cues;
}
function ensureStepVideos(sc,quiet){
  /* Two providers, one contract. Diffusion INVENTS footage of the step and
     bills per clip; MoneyPrinterTurbo's stock search finds footage that was
     really filmed, in seconds instead of 30-90s, for nothing. For "hands
     turning a wrench" the real thing is both faster and more honest, so
     stock is preferred and diffusion is what you pay for when no stock
     clip could exist. Both answer {"videos":[url|null,...]}, so everything
     downstream — the cue list, the cut points, the quiet screen on a miss —
     is untouched. */
  if(sc.mode!=="world"||!sc.step_videos||sc.reel!==undefined)
    return sc._reelJob||Promise.resolve();
  if(!videoEnabled&&!footageEnabled){
    /* the director asked for footage and neither provider can supply it.
       Say which one was missing rather than leaving the screen quietly
       blank — "nothing happened" is the one thing a lesson must not do. */
    sc.reel=[];
    if(!sc._reelSaid){sc._reelSaid=1;
      chatMsg('sys','step footage unavailable — '+(footageWhy
        ||'no stock provider and no REPLICATE_API_TOKEN')
        +'; the room plays without the screen');}
    return Promise.resolve();
  }
  if(sc._reelJob)return sc._reelJob;
  const cues=stepCues(sc);
  if(!cues.length){sc.reel=[];return Promise.resolve();}
  /* an explicit step_videos array is a director's cinematic prompt — that is
     a diffusion instruction, so honour it by staying on diffusion */
  const stock=footageEnabled&&!(Array.isArray(sc.step_videos)&&videoEnabled);
  sc._reelJob=(async()=>{
    try{
      if(!quiet){
        $('status').textContent=stock
          ?`Finding ${cues.length} real clips — seconds`
          :`Generating ${cues.length} step clips — 30–90s, all at once`;
        $('status').className='status busy';}
      const r=stock
        ?await fetch("/api/stock",{method:"POST",
            headers:{"Content-Type":"application/json"},
            /* the STEP TEXT is the search, not the cinematic prompt: a stock
               library matches "seat the chain", not a paragraph about light */
            body:JSON.stringify({terms:cues.map(c=>c.text),
                                 seconds:Math.max(2,Math.round(
                                   cues[0].end-cues[0].start)||4)})})
        :await fetch("/api/videos",{method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({prompts:cues.map(c=>c.prompt)})});
      const d=await r.json();
      const urls=(r.ok&&Array.isArray(d.videos))?d.videos:[];
      sc.reel=cues.map((c,i)=>({...c,url:urls[i]||null})).filter(c=>c.url);
      const err=(d.errors||[]).find(Boolean);
      const what=stock?`real clips (${d.source||"stock"})`:"step clips";
      chatMsg('sys',sc.reel.length
        ?`&#9635; ${sc.reel.length}/${cues.length} ${what} ready — the `
         +`screen cuts with the steps`+(quiet?' (prefetched)':'')
        :what+' unavailable'+(err?' ('+err+')':
            d.why?' ('+d.why+')':d.error?' ('+d.error.message+')':''));
      /* a stock search that found nothing is not the end of the road if the
         paid provider is configured — fall through to it once */
      if(!sc.reel.length&&stock&&videoEnabled){
        sc.reel=undefined; sc._reelJob=null; footageEnabled=false;
        return ensureStepVideos(sc,quiet);
      }
    }catch(e){sc.reel=[];}
    if(!quiet){$('status').textContent="";$('status').className='status';}
  })();
  return sc._reelJob;
}
function ensureImage(sc,quiet){
  /* also the still that hangs on a room's screen when there is no clip */
  if(!imageEnabled||(sc.mode!=="photo"&&sc.mode!=="world")
     ||!sc.image_prompt||sc.imageUrl!==undefined)
    return sc._imageJob||Promise.resolve();
  if(sc._imageJob)return sc._imageJob;
  sc._imageJob=(async()=>{
    try{
      if(!quiet){$('status').textContent="Generating a still";$('status').className='status busy';}
      const r=await fetch("/api/image",{method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({prompt:sc.image_prompt})});
      const d=await r.json();
      sc.imageUrl=(r.ok&&d.image)?d.image:null;
      if(sc.imageUrl)chatMsg('sys','&#9707; generated still ready'+(quiet?' (prefetched)':''));
      else chatMsg('sys','still unavailable'+(d.error?' ('+d.error.message+')':''));
    }catch(e){sc.imageUrl=null;}
    if(!quiet){$('status').textContent="";$('status').className='status';}
  })();
  return sc._imageJob;
}
const CLIP_MODES={skeleton:"/api/motion",hand:"/api/hand",lineform:"/api/lineform",
                  compose:"/api/compose",world:"/api/world"};
/* A composite scene names its panes loosely — normalise whatever the director
   wrote into the {kind, ...} specs /api/compose expects. */
function composeParts(sc){
  const src=Array.isArray(sc.parts)&&sc.parts.length?sc.parts:
    /* no explicit parts: infer them from whichever step lists are present */
    [sc.hand_steps&&{kind:"hand",steps:sc.hand_steps},
     sc.motion_steps&&{kind:"skeleton",steps:sc.motion_steps},
     sc.shapes&&{kind:"lineform",shapes:sc.shapes,snap:!!sc.snap}].filter(Boolean);
  return src.slice(0,4).map(p=>{
    const k=({body:"skeleton",motion:"skeleton",fingers:"hand",gesture:"hand",
              curve:"lineform",device:"lineform"})[p.kind]||p.kind||"skeleton";
    const o={kind:k,title:p.title||""};
    if(k==="lineform"){o.shapes=p.shapes||["curve","phone","wristband"];
      o.device=p.device||"large";o.snap=!!p.snap;if(p.values)o.values=p.values;}
    else{o.steps=p.steps||p.hand_steps||p.motion_steps||[];
      if(p.question)o.question=p.question;
      if(p.yaw!=null)o.yaw=p.yaw;
      if(k==="skeleton"&&p.constraint)o.constraint=true;
      /* a book exercise names the muscles it works — the figure burns them */
      if(k==="skeleton"&&Array.isArray(p.muscles)&&p.muscles.length)
        o.muscles=p.muscles.slice(0,8).map(String);}
    return o;
  });
}
/* A world chapter names its actors the same loose way a composite names its
   panes, and adds where each one stands. Placement is optional — world.py
   has a sensible spot for every kind — but a director that does say gets
   what it asked for. */
function worldActors(sc){
  const src=Array.isArray(sc.actors)&&sc.actors.length?sc.actors:composeParts(sc);
  return src.slice(0,4).map((p,i)=>{
    const o=composeParts({parts:[p]})[0];
    o.id=String(p.id||o.kind+(i?i+1:""));
    ["at","origin","bind"].forEach(k=>{if(p[k]!=null)o[k]=p[k];});
    ["yaw","scale"].forEach(k=>{if(p[k]!=null)o[k]=p[k];});
    if(p.wrap)o.wrap=true;
    return o;
  });
}
function ensureClip(sc,quiet){
  /* skeleton / hand / lineform scenes. Pure maths on the server — no key, no
     token, so unlike diffusion these can never be "disabled", only malformed. */
  if(sc.clip!==undefined||!CLIP_MODES[sc.mode])return sc._clipJob||Promise.resolve();
  if(sc._clipJob)return sc._clipJob;
  /* A mined chapter that knows which second of the source video it came from
     asks for the REAL tracked body and fingers instead of the synthesised
     ones. Same clip contract, so nothing downstream changes; if the person
     is not visible in that window it quietly falls back to synthesis. */
  if(sc.track&&sc.track.url&&!sc._trackTried){
    sc._trackTried=true;
    sc._clipJob=(async()=>{
      try{
        if(!quiet){
          $('status').textContent="Tracking the real hands and body in the video";
          $('status').className='status busy';}
        const r=await fetch("/api/track",{method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify(sc.track)});
        const d=await r.json();
        if(r.ok&&(d.frames||(d.parts&&d.parts.length))){
          sc.clip=d;
          const what=d.kind==='compose'
            ?d.parts.map(p=>PANE_LABEL[p.kind]||p.kind).join(' + ')
            :(PANE_LABEL[d.kind]||d.kind);
          chatMsg('sys','&#9673; tracked from the video — '+what
                 +' ('+(d.parts?d.parts[0].backend:d.backend)+')');
        }else{
          chatMsg('sys','could not track that moment'
                 +(d.error?' ('+d.error.message+')':'')+' — synthesising instead');
          sc._clipJob=null; delete sc.clip;
          await ensureClip(sc,quiet);
        }
      }catch(e){ sc._clipJob=null; delete sc.clip; await ensureClip(sc,quiet); }
      if(!quiet){$('status').textContent="";$('status').className='status';}
    })();
    return sc._clipJob;
  }
  const m=sc.mode;
  sc._clipJob=(async()=>{
    try{
      if(!quiet){
        $('status').textContent=m==="skeleton"?"Solving the skeleton chains"
                               :m==="hand"?"Solving the finger chains"
                               :m==="compose"?"Solving every pane on one timeline"

/* ============ real film under EVERY explanation ============
   The board used to be able to show real footage in exactly two places: a
   "hybrid" chapter's diffusion backdrop, and a room's screen. Both cost money
   per clip, so most chapters were a diagram or a rig on blank paper and the
   real thing was never seen.

   MoneyPrinterTurbo's stock search changes the economics — a clip that was
   really filmed, in seconds, for nothing — so footage stops being a mode and
   becomes a LAYER available to every mode. An "anim" chapter can now explain
   over film of the actual part; a "hand" chapter can put the tracked rig in
   front of a real pair of hands doing the same move.

   The annotation layer needs no changes at all to sit on top of it, which is
   the point: drawMediaFrame() already reports onMedia, and every stroke and
   element already switches to the heavier weight and the paper-white halo
   that keeps it readable over video. Footage, voice and marker strokes are
   three independent layers that happen to compose. */
function footageTerms(sc){
  /* The director may name the search; otherwise the chapter title is a far
     better stock query than its narration, because narration is prose and a
     stock library matches nouns. */
  const given=(sc.footage===true?"":sc.footage)||"";
  const t=String(given||sceneName(sc)||topicNow||"").trim();
  return t.slice(0,120);
}
/* ============ MoneyPrinterTurbo action animation ============
   The board's original "anim" mode drew the explanation as shapes — boxes,
   circles, arrows appearing beat by beat. It is instant and free, and it is
   also a diagram of an action rather than the action: a box labelled "chain"
   sliding next to a box labelled "sprocket" is not what seating a chain looks
   like, and a student who has never done it cannot learn the movement from it.

   An ACTION CHAPTER replaces the shapes with MoneyPrinterTurbo's own model:
   the chapter is a list of ACTIONS, each action gets its own real clip, and
   the reel cuts between them on the action boundaries — the same
   one-clip-per-script-line composition its renderer uses, played live instead
   of muxed to a file. The marker strokes still land on top, so the annotator
   is now pointing at a real hand doing a real thing.

   Each action's slice of the chapter is proportional to how long it takes to
   SAY it, not an equal division: "undo the quick link" and "thread the chain
   through the rear derailleur cage, over the jockey wheels" are not the same
   length of instruction and should not get the same length of film. */
function actionList(sc){
  const src=Array.isArray(sc.actions)&&sc.actions.length?sc.actions
           :Array.isArray(sc.hand_steps)&&sc.hand_steps.length?sc.hand_steps
           :Array.isArray(sc.motion_steps)?sc.motion_steps:[];
  return src.map(a=>typeof a==="string"?{text:a,footage:""}
                   :{text:String(a.text||a.step||""),
                     footage:String(a.footage||"")})
            .filter(a=>a.text.trim()).slice(0,6);
}
function actionCues(sc,urls){
  const acts=actionList(sc), total=Math.max(4,sc.seconds||10);
  const weight=acts.map(a=>Math.max(3,a.text.split(/\s+/).length));
  const sum=weight.reduce((x,y)=>x+y,0)||1;
  let t=0;
  return acts.map((a,i)=>{
    const d=total*weight[i]/sum;
    const cue={start:t,end:(i===acts.length-1?total:t+d),
               ai:i,                       /* which action this clip is OF */
               text:a.text,url:urls[i]||null};
    t+=d; return cue;
  }).filter(c=>c.url);
}
async function liveCutActions(sc,acts,quiet){

  const d=await r.json();

  sc.reel=actionCues(sc,urls);

async function reelUpgrade(sc,acts){
  /* MoneyPrinterTurbo composing the ANSWER, behind the live cut that is
     already playing: /api/reel speaks each step with the neural voice,
     trims its stock shot to exactly the sentence's measured length, burns
     the step in as that shot's subtitle (MPT's font, outline, position)
     and joins the shots with its fade — one mp4, voice muxed in. The
     chapter is upgraded IN PLACE when the file lands; the next play of
     it (a click on the chapter, a verify demo loop) is the composed
     edit. Never awaited, so the answer is never delayed by ffmpeg. */

  try{
    const r=await fetch("/api/reel",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({actions:acts,lang:lessonLang})});
    const d=await r.json();
    if(!d.job)return;                       /* no MPT on this server: fine */
    for(let n=0;n<150;n++){                              /* up to ~5 min */
      await new Promise(z=>setTimeout(z,2000));
      const s=await (await fetch("/api/reel/status?job="
                                 +encodeURIComponent(d.job))).json();
      if(s.state==="done"&&s.video){
        /* sc.reel (the live cut's cues) is left ALONE — this scene may be
           mid-play on those clips right now. The composed file wins on
           the next play, where the "edited" path checks reelVideo only. */
        sc.reelVideo=s.video; sc.reelCues=s.cues||[];
        if(s.seconds)sc.seconds=Math.max(sc.seconds||0,s.seconds);
        chatMsg('sys','&#9635; MoneyPrinterTurbo finished the composed edit '
          +'of the answer — replay "'+sceneName(sc)+'" to watch it: '
          +(s.cues||[]).length+' shots, each held exactly as long as its '
          +'step is spoken, subtitles burned in');
        renderSceneList();
        return;
      }
      if(s.state==="error"){
        chatMsg('sys','the answer\'s composed edit failed ('
          +(s.error||'unknown')+') — the live cut stands');
        return;
      }
    }
  }catch(_){}

async function ensureRigOverlay(sc){
  /* The PHYSICAL layer of an action chapter: the tracked rig performs the
     same actions over the film. The reel shows what the action looks like;
     the rig shows what the BODY does — landmarks, finger chains, motion
     vectors — and because both are driven by the same action list, the rig
     is always demonstrating the movement the footage is showing.

     Free and instant (pure maths, no key), so it rides along rather than
     being a mode of its own. Solved by /api/hand for finger work and
     /api/motion when the actions read as whole-body. */

  const body=/\b(stand|squat|lift|carry|walk|brace|kneel|bend|lean|step|reach|posture|shoulder|leg|knee|hip)\b/i;
  const wantsBody=sc.rig==="skeleton"||(sc.rig!=="hand"&&acts.some(t=>body.test(t)));
  try{
    const r=await fetch(wantsBody?"/api/motion":"/api/hand",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({steps:acts,seconds:sc.seconds||undefined})});
    const d=await r.json();
    sc.clip=(r.ok&&d&&(d.frames||d.kind))?d:null;
    if(sc.clip)chatMsg('sys','&#9995; '+(wantsBody?'body':'hand')
      +' rig overlay ready — the physical motion plays over the film');
  }catch(e){sc.clip=null;}
}
function rigTimeFor(clip){
  /* Map chapter time into the rig's own timeline so the rig performs the
     SAME action the film is currently showing. The reel's cues say which
     action window we are in (or REEL.force says it exactly, when the live
     narration is driving); the rig's solved segments say where that action
     lives on ITS clock. Progress through the cue window scrubs through the
     matching segment, so a long sentence stretches the gesture rather than
     letting the rig run ahead to the next one. */
  const cues=player.reelCues;
  if(!cues||!cues.length||!clip.segments||!clip.segments.length)
    return Math.min(player.elapsed/1000,clip.seconds-1e-3);
  const t=player.elapsed/1000;
  let i=REEL.force!=null?REEL.force
       :cues.findIndex(c=>t>=c.start&&t<c.end);
  if(i<0)i=t>=cues[cues.length-1].end?cues.length-1:0;
  const c=cues[Math.min(i,cues.length-1)];
  const seg=clip.segments[Math.min(i,clip.segments.length-1)];
  const frac=Math.max(0,Math.min(1,(t-c.start)/Math.max(0.5,c.end-c.start)));
  return Math.min(seg.start+frac*Math.max(0,seg.end-seg.start),
                  clip.seconds-1e-3);

function ensureFootage(sc,quiet){

     ||sc.imageUrl||sc._footJob)

  const wanted=sc.footage!==undefined||!(sc.image_prompt||sc.video_prompt);
  if(!wanted)return Promise.resolve();

  return new Promise(res=>{
    const t=setInterval(()=>{if(!lessonRunning){clearInterval(t);res();}},60);
    setTimeout(()=>{clearInterval(t);res();},4000);   /* never hang the button */
  });
}
async function runLesson(startAt=0){
  if(lessonRunning)return;
  lessonRunning=true; lessonAbort=false;
  player.cancelRequested=false;   /* a stale cancel must not skip chapter 1 */
  setBadge('live'); $('pauseBtn').disabled=false;
  try{
    for(let i=startAt;i<scenes.length;i++){
      if(lessonAbort)break;
      if(pendingSeek!=null){i=pendingSeek;pendingSeek=null;}
      await waitWhilePaused();
      currentScene=i; player.sceneIdx=i; const sc=scenes[i];
      coerceMode(sc);
      renderSceneList(); renderTimeline();
      $('sceneMeta').textContent=`Ch. ${i+1}/${scenes.length} — ${sceneName(sc)}`;
      await ensureMedia(sc);                 /* the backdrop must be there first */
      await fallbackFromFailedMedia(sc);
      ensureAnnotations(sc).then(()=>attachAnnos(sc));   /* never blocks the beat */
      await waitWhilePaused();
      if(pendingSeek!=null){i=pendingSeek-1;pendingSeek=null;continue;}
      captionText=sc.narration; captionQA=false;
      wipe();
      /* Three ways a chapter can be voiced, in order of preference:
         - an EDITED REEL: the mp4 already contains the voice, and each shot
           was cut to its sentence at compose time — the file IS the sync, so
           the board neither speaks nor captions over it;
         - a LIVE CUT: the board narrates action by action and forces the raw
           clip to match the sentence being spoken;
         - everything else: one narration over one backdrop, as always. */
      const edited=sc.mode==="actions"&&sc.reelVideo;
      const acting=!edited&&sc.mode==="actions"&&(sc.reel||[]).length>0;
      let narrating=null;
      if(edited){sc.videoUrl=sc.reelVideo; captionText="";}
      else if(acting)narrating=speakActions(sc);
      else if(voiceOn)speak(sc.narration); else {speaking=false;}
      if(scenes[i+1]){                       /* prefetch the next chapter */
        coerceMode(scenes[i+1]);
        ensureMedia(scenes[i+1],true); ensureAnnotations(scenes[i+1]);
      }
      await playScene(sc,(sc.seconds||8)*1000);
      /* the chapter is not over until the last action has been described —
         the visual timer is a floor, the narration is the truth */
      if(narrating)await narrating;
      if(lessonAbort)break;
      /* verified tutorial: the demonstration is only half the loop — now
         the CAMERA watches the student perform this chapter's own steps,
         gesture-tracked joint by joint, before the lesson moves on */
      /* a pending seek means the student redirected the lesson — usually
         to the animated answer of the question they just asked. NOTHING
         stands between them and it: no camera check, no quiz question of
         the chapter they interrupted. The answer plays NEXT. */
      let vcut=true;               /* not run at all = still owed */
      if(pendingSeek==null&&VERIFY.on)vcut=await verifyChapter(sc);
      if(lessonAbort)break;
      /* but an interrupt DEFERS the camera check, it never waives it: a
         check that was skipped — or cut mid-round — to play an answer is
         banked as owed, and re-runs the moment the answer has played */
      if(vcut&&VERIFY.on&&pendingSeek!=null&&(scenes[pendingSeek]||{}).qa
         &&verifySteps(sc).length&&VERIFY.owed.indexOf(sc)<0){
        VERIFY.owed.push(sc);
        chatMsg('sys','&#9202; camera check deferred — "'+sceneName(sc)
          +'" is still verified right after the answer plays');
      }
      /* the debt comes due HERE: after the answer chapter played and its
         OWN steps were verified, every owed check runs before the lesson
         may proceed — being interrupted never skips the verification */
      while(pendingSeek==null&&VERIFY.on&&VERIFY.owed.length&&!lessonAbort){
        const owed=VERIFY.owed.shift();
        chatMsg('sys','&#9673; back to the deferred camera check — "'
          +sceneName(owed)+'"');
        const ocut=await verifyChapter(owed);
        /* interrupted AGAIN mid-debt: the debt survives, front of the line */
        if(ocut&&pendingSeek!=null&&(scenes[pendingSeek]||{}).qa
           &&VERIFY.owed.indexOf(owed)<0)VERIFY.owed.unshift(owed);
      }
      if(lessonAbort)break;
      /* and the knowledge loop: was the chapter LEARNED, not just watched?
         One grounded check question; a miss becomes an animated
         re-explanation and, missed twice, a study trip */
      if(pendingSeek==null&&QUIZ.on)await quizChapter(sc);
      if(lessonAbort)break;
      /* and a SOCIAL chapter ends in practice of the only kind that can
         verify it: a role-play with the partner in the 3D room, measured
         into the quantified self */
      if(pendingSeek==null&&SIM.on&&simIsSocial(sc))await simChapter(sc);
      if(lessonAbort)break;
      await waitWhilePaused();
      if(pendingSeek!=null){i=pendingSeek-1;pendingSeek=null;}
    }
    if(!lessonAbort){
      currentScene=scenes.length; player.sceneIdx=scenes.length;
      renderSceneList();
      $('sceneMeta').textContent="Done — keep asking, or click a chapter to replay";
    }
  }catch(e){
    $('status').textContent=e.message;$('status').className='status err';
  }
  lessonRunning=false; player.active=false;
  setBadge(LIVE.on?'live':'');   /* a followed stream keeps the session live */
  if(!LIVE.on){
    verifyRelease();             /* holding live keeps the camera warm */
    /* the session's self-experiment, reported: which actions the student
       hit clean and which ones the band had to adapt around */
    if(VERIFY.log.length){
      const tough=VERIFY.log.filter(l=>l.rounds>0);
      chatMsg('sys','&#9673; session experiment: '+VERIFY.log.length
        +' action(s) camera-verified'
        +(tough.length?' — the pass band adapted for '
          +tough.map(l=>'"'+l.title+'" ('+l.rounds+' coached round'
            +(l.rounds>1?'s':'')+')').join(', '):' — all hit clean'));
      VERIFY.log.length=0;
    }
    if(QUIZ.asked){
      chatMsg('sys','&#9673; knowledge check: '+QUIZ.right+'/'+QUIZ.asked
        +' answered right'
        +(QUIZ.missed.length?' — missed: '
          +QUIZ.missed.map(m=>'"'+String(m.topic||'').slice(0,40)+'"')
            .join(', ')
          +' — ask about any of them, or click their chapters to replay'
        :' — clean sweep'));
      QUIZ.asked=QUIZ.right=0; QUIZ.missed.length=0;
    }
    if(SIM.log.length){
      const avg=Math.round(SIM.log.reduce((a,l)=>a+l.score,0)/SIM.log.length);
      chatMsg('sys','&#9673; social practice: '+SIM.log.length
        +' exchange(s), session avg '+avg
        +' — quantified self: lifetime avg '+Math.round(SELF.score)
        +' over '+SELF.n+' exchanges, typical reply '
        +SELF.latency.toFixed(1)+'s / '+Math.round(SELF.words)+' words'
        +(SELF.accN>=4?', forecast right '
          +Math.round(100*SELF.acc/SELF.accN)+'% of the time':''));
      SIM.log.length=0; SIM.low=0;
    }
  }
  if(lessonAbort){lessonAbort=false;return;}      /* something else is starting */
  if(pendingSeek!=null){const s=pendingSeek;pendingSeek=null;runLesson(s);return;}
  if(LIVE.on)chatMsg('sys','&#9679; holding live — the lesson resumes when '
                    +'the stream teaches its next chapter');
}
async function startLesson(){
  if(answering){                       /* mid-answer: say so instead of nothing */
    $('status').textContent="Finishing an answer first — press Start again in a second";
    $('status').className='status busy'; return;
  }
  topicNow=$('topic').value.trim();
  if(!topicNow){$('status').textContent="Enter a topic first";$('status').className='status err';return;}
  if(COACH.on)await coachStop();       /* the camera does not survive a lesson */
  if(lessonRunning){
    $('status').textContent="Stopping the current lesson";
    $('status').className='status busy';
    chatMsg('sys','&#9632; stopped the lesson that was playing');
    await stopLesson();
    if(lessonRunning){    /* parked in a camera prompt — do not stack two */
      $('status').textContent="Could not stop the previous lesson — "
        +"answer or dismiss the camera prompt, then press Start again";
      $('status').className='status err'; return;
    }
  }
  $('status').className='status';$('go').disabled=true;
  $('chat').innerHTML="";qaHistory=[];currentScene=-1;
  if(voiceOn)withVoices(()=>voiceNote(true));   /* before a word is spoken */
  try{
    $('status').textContent="Director is storyboarding the animation";$('status').className='status busy';
    /* The action reel is film of a MOVEMENT, so it only earns its place when
       the lesson is a technical how-to — a wiki-style procedure somebody
       performs with their hands. "How photosynthesis works" has no gesture to
       film, and a stock search for it returns handsome greenery that
       illustrates nothing, so the reel is switched off rather than offered
       and wasted. The server decides, from the hivemind's own steps first and
       the phrasing second, and says why. */
    const gate=await fetch("/api/howto",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({topic:topicNow})}).then(r=>r.json()).catch(()=>({}));
    const technical=gate.technical===true&&footageEnabled;
    if(gate.why)chatMsg('sys',(technical?'&#9635; technical how-to — action '
        +'reels on':'&#9998; not a hands-on procedure — explaining it instead')
        +' ('+gate.why+')');
    const modeRule=technical?"":
      `\n\nTHIS LESSON IS NOT A HANDS-ON PROCEDURE. Do NOT use "actions" mode `
      +`and do NOT set "footage" on any chapter: there is no movement to film `
      +`and stock film of the subject would decorate the lesson without `
      +`explaining it. Use "anim" for structure, and the rig modes only if a `
      +`real human movement genuinely appears in the topic.`;
    let raw=await askClaude(DIRECTOR_SYS+modeRule+langRule(),
                            `Topic: ${topicNow}`,[],6000);
    scenes=parseModelJSON(raw,"director").map(prepScene);
    renderSceneList(); renderTimeline();
    $('status').textContent="";$('status').className='status';
    await runLesson(0);
  }catch(e){
    $('status').textContent=e.message;$('status').className='status err';
  }finally{$('go').disabled=false;}
}
$('go').onclick=startLesson;

/* ============ teach from a book ============
   A how-to book is a finished curriculum — someone already sequenced the
   skills and wrote the exercises as imperatives. So the book replaces the
   DIRECTOR, not the player: the server reads the PDF, converts its own
   exercises into hand-rig and action-reel chapters in its own teaching
   order, and ingests its procedures into the hivemind. From there it is an
   ordinary lesson: same narration, same footage, same rigs, same strokes —
   and an interruption is answered from what the book says, with the book
   cited as the source. */
/* every ANALYZED tutorial — an uploaded book, a mined YouTube how-to, a
   followed livestream — is a curriculum to be FOLLOWED, not watched:
   analyzing one arms strict coach-verify, so every step of every chapter
   (and of every interrupt answer) is performed on camera before the
   lesson proceeds. One click on Coach-verify relaxes it back. */
function verifyArm(source){
  if(VERIFY.on&&VERIFY.strict)return;
  VERIFY.on=true; VERIFY.strict=true;
  $('verifyBtn').textContent='Coach-verify';
  $('verifyBtn').setAttribute('aria-pressed','true');
  chatMsg('sys','&#9673; '+source+' — COACH-VERIFY armed: each step is '
    +'performed on camera, graded against the exact demonstrated motion, '
    +'and the lesson proceeds only when it lands. Interrupt answers are '
    +'verified too, and an interrupted check comes back right after the '
    +'answer. Click "Coach-verify" to relax it.');
}
